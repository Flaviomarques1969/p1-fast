<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>P1 Fast — Antes de rodar (status) · vira o painel do piloto quando anda</title>
<style>
  :root{
    --bg:#050a14; --bg2:#0b1220; --linha:#1e293b;
    --txt:#e8eef5; --txt2:#94a3b8; --txt3:#64748b;
    --verde:#34d399; --verde-glow:rgba(52,211,153,.35);
    --vermelho:#f87171; --vermelho-glow:rgba(248,113,113,.30);
    --amarelo:#fbbf24; --amarelo-glow:rgba(251,191,36,.32);
    --cinza:#5b6677;
    --ff:-apple-system,"Segoe UI",Roboto,sans-serif;
    --ffm:"JetBrains Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:var(--ff);overflow:hidden}

  /* PAINEL DO PILOTO embutido (o APROVADO, intocado) — aparece quando o carro anda */
  #cockpitFrame{ position:fixed; inset:0; width:100%; height:100%; border:0; background:var(--bg); z-index:1; }

  /* OVERLAY DE STATUS (carro parado) */
  #garagem{
    position:fixed; inset:0; z-index:10;
    background:radial-gradient(120% 120% at 50% -10%, #0c1526 0%, var(--bg) 60%);
    display:flex; flex-direction:column; opacity:1; transition:opacity .4s ease;
  }
  body[data-modo="andando"] #garagem{ opacity:0; pointer-events:none; }

  /* Cabeçalho */
  .cab{ display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .cab__tit h1{ margin:0; font-weight:900; letter-spacing:.01em; }
  .cab__tit p{ margin:0; color:var(--txt2); }
  .cab__dir{ display:flex; align-items:center; gap:12px; }
  .modo-chip{ color:var(--txt3); font-family:var(--ffm); display:flex; align-items:center; gap:7px;
    border:1px solid var(--linha); border-radius:999px; padding:5px 11px; white-space:nowrap; }
  .modo-chip b{ color:var(--txt); }
  .pronto{ display:flex; align-items:center; gap:9px; border-radius:11px; font-weight:900;
    letter-spacing:.03em; text-transform:uppercase; border:1px solid transparent; white-space:nowrap; }
  .pronto[data-ok="sim"]{ color:var(--verde); background:rgba(52,211,153,.10); border-color:rgba(52,211,153,.45); box-shadow:0 0 20px var(--verde-glow); }
  .pronto[data-ok="nao"]{ color:var(--amarelo); background:rgba(251,191,36,.08); border-color:rgba(251,191,36,.40); }
  .pronto .dot{ width:10px; height:10px; border-radius:50%; background:currentColor; box-shadow:0 0 10px currentColor; }

  /* Destaque GPS + MOTOR (os dois que decidem a gravação) — só no notebook */
  .destaque{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .big{ display:flex; align-items:center; gap:16px; padding:14px 18px; border-radius:15px;
    background:linear-gradient(180deg,#0e1828,#0a1018); border:1px solid var(--linha); }
  .big__ico{ width:48px; height:48px; flex:0 0 48px; display:flex; align-items:center; justify-content:center;
    border-radius:13px; background:#0a0f1a; border:1px solid var(--linha); color:var(--cinza); }
  .big__ico svg{ width:28px; height:28px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
  .big__txt{ display:flex; flex-direction:column; gap:2px; min-width:0; }
  .big__nome{ font-size:12px; color:var(--txt2); text-transform:uppercase; letter-spacing:.08em; font-weight:700; }
  .big__estado{ font-size:21px; font-weight:900; line-height:1.05; }
  .big__dado{ font-family:var(--ffm); font-size:12px; color:var(--txt3); height:15px; }
  .big[data-state="ok"] .big__ico{ color:var(--verde); border-color:rgba(52,211,153,.45); box-shadow:inset 0 0 0 1px rgba(52,211,153,.25),0 0 16px var(--verde-glow); }
  .big[data-state="ok"] .big__estado{ color:var(--verde); }
  .big[data-state="off"] .big__ico{ color:var(--vermelho); border-color:rgba(248,113,113,.40); }
  .big[data-state="off"] .big__estado{ color:var(--vermelho); }
  .big[data-state="warn"] .big__ico{ color:var(--amarelo); border-color:rgba(251,191,36,.40); }
  .big[data-state="warn"] .big__estado{ color:var(--amarelo); }

  /* Grade de status */
  .grupos{ flex:1; display:grid; grid-template-columns:repeat(3,1fr); gap:14px; min-height:0; }
  .grupo{ display:flex; flex-direction:column; background:rgba(255,255,255,.015); border:1px solid var(--linha); border-radius:15px; }
  .grupo__tit{ font-weight:800; letter-spacing:.16em; text-transform:uppercase; color:var(--txt3); }
  .cards{ display:grid; gap:10px; align-content:start; }

  .card{ display:flex; flex-direction:column; align-items:center; text-align:center; gap:5px;
    border-radius:12px; background:#0a1018; border:1px solid #16202f;
    transition:border-color .25s ease, box-shadow .25s ease; }
  .card__nome{ font-weight:700; color:var(--txt); letter-spacing:.01em; line-height:1.1; }
  .card__ico{ display:flex; align-items:center; justify-content:center; color:var(--cinza); transition:color .25s ease, filter .25s ease; }
  .card__ico svg{ fill:none; stroke:currentColor; stroke-width:1.55; stroke-linecap:round; stroke-linejoin:round; }
  .card__dado{ font-family:var(--ffm); font-weight:800; color:var(--txt); line-height:1; }
  .card__estado{ font-weight:700; letter-spacing:.02em; line-height:1; }
  .card[data-state="ok"]{ border-color:rgba(52,211,153,.45); box-shadow:0 0 14px var(--verde-glow); }
  .card[data-state="ok"] .card__ico{ color:var(--verde); filter:drop-shadow(0 0 5px var(--verde-glow)); }
  .card[data-state="ok"] .card__estado{ color:var(--verde); }
  .card[data-state="off"]{ border-color:rgba(248,113,113,.40); }
  .card[data-state="off"] .card__ico{ color:var(--vermelho); }
  .card[data-state="off"] .card__estado{ color:var(--vermelho); }
  .card[data-state="off"] .card__dado{ color:var(--txt3); }
  .card[data-state="warn"]{ border-color:rgba(251,191,36,.45); box-shadow:0 0 14px var(--amarelo-glow); }
  .card[data-state="warn"] .card__ico{ color:var(--amarelo); animation:pulso 1.4s ease-in-out infinite; }
  .card[data-state="warn"] .card__estado{ color:var(--amarelo); }
  .card[data-state="instalar"]{ opacity:.6; }
  .card[data-state="instalar"] .card__ico{ color:var(--cinza); }
  .card[data-state="instalar"] .card__estado{ color:var(--cinza); }
  .card[data-state="instalar"] .card__dado{ color:var(--txt3); }
  @keyframes pulso{ 0%,100%{filter:drop-shadow(0 0 3px var(--amarelo-glow))} 50%{filter:drop-shadow(0 0 9px var(--amarelo))} }

  .rodape{ text-align:center; color:var(--txt3); }
  .rodape b{ color:var(--txt2); font-weight:700; }

  /* ───────────── VERSÃO NOTEBOOK (tela 10,5", ~1280×692) ───────────── */
  body[data-tela="notebook"] #garagem{ padding:14px 24px 10px; }
  body[data-tela="notebook"] .cab__tit h1{ font-size:20px; }
  body[data-tela="notebook"] .cab__tit p{ font-size:12px; margin-top:2px; }
  body[data-tela="notebook"] .modo-chip{ font-size:11px; }
  body[data-tela="notebook"] .pronto{ font-size:14px; padding:9px 16px; }
  body[data-tela="notebook"] .destaque{ margin:12px 0; }
  body[data-tela="notebook"] .big{ padding:9px 16px; gap:14px; }
  body[data-tela="notebook"] .big__ico{ width:40px; height:40px; flex-basis:40px; }
  body[data-tela="notebook"] .big__ico svg{ width:24px; height:24px; }
  body[data-tela="notebook"] .big__estado{ font-size:18px; }
  body[data-tela="notebook"] .grupos{ gap:14px; }
  body[data-tela="notebook"] .grupo{ padding:12px 14px 8px; }
  body[data-tela="notebook"] .grupo__tit{ font-size:11px; margin-bottom:9px; }
  body[data-tela="notebook"] .cards{ grid-template-columns:repeat(2,1fr); gap:8px; }
  body[data-tela="notebook"] .card{ padding:8px 6px; gap:4px; }
  body[data-tela="notebook"] .card__nome{ font-size:12px; min-height:14px; }
  body[data-tela="notebook"] .card__ico{ width:30px; height:30px; }
  body[data-tela="notebook"] .card__ico svg{ width:24px; height:24px; }
  body[data-tela="notebook"] .card__dado{ font-size:15px; height:16px; }
  body[data-tela="notebook"] .card__estado{ font-size:10px; height:12px; }
  body[data-tela="notebook"] .rodape{ margin-top:8px; font-size:11px; }

  /* ───────────── VERSÃO CELULAR (girado, ~956×440) ─────────────
     MESMO desenho da web (3 blocos, 2 colunas, cartões de tamanho natural),
     só menor pra caber na tela baixa do celular. Sem esticar cartões. */
  body[data-tela="celular"] #garagem{ padding:8px 14px 6px; }
  body[data-tela="celular"] .cab{ margin-bottom:6px; }
  body[data-tela="celular"] .cab__tit h1{ font-size:14px; }
  body[data-tela="celular"] .cab__tit p{ display:none; }
  body[data-tela="celular"] .modo-chip{ font-size:9.5px; padding:4px 8px; }
  body[data-tela="celular"] .pronto{ font-size:11px; padding:6px 11px; }
  body[data-tela="celular"] .destaque{ display:none; }            /* GPS e Motor já estão na grade */
  body[data-tela="celular"] .grupos{ gap:10px; }
  body[data-tela="celular"] .grupo{ padding:8px 10px 5px; }
  body[data-tela="celular"] .grupo__tit{ font-size:9px; margin-bottom:6px; }
  body[data-tela="celular"] .cards{ grid-template-columns:repeat(2,1fr); gap:6px; }
  body[data-tela="celular"] .card{ padding:6px 4px; gap:3px; }
  body[data-tela="celular"] .card__nome{ font-size:10px; min-height:12px; }
  body[data-tela="celular"] .card__ico{ width:22px; height:22px; }
  body[data-tela="celular"] .card__ico svg{ width:18px; height:18px; }
  body[data-tela="celular"] .card__dado{ font-size:12px; height:13px; }
  body[data-tela="celular"] .card__estado{ font-size:8.5px; height:10px; }
  body[data-tela="celular"] .rodape{ margin-top:5px; font-size:8.5px; }
</style>
</head>
<body data-tela="notebook" data-modo="parado">

<!-- O painel do piloto APROVADO, embutido sem qualquer alteração -->
<iframe id="cockpitFrame" src="cockpit-volta-real.html" title="Painel do piloto"></iframe>

<!-- Tela de status (aparece com o carro parado) -->
<section id="garagem">
  <div class="cab">
    <div class="cab__tit">
      <h1>Antes de rodar</h1>
      <p>Status de todos os aparelhos. Quando o carro andar, esta tela vira o painel do piloto.</p>
    </div>
    <div class="cab__dir">
      <div class="modo-chip">Carro: <b id="modoTxt">parado</b> · <span id="velTxt">0 km/h</span></div>
      <div class="pronto" id="pronto" data-ok="nao"><span class="dot"></span><span id="prontoTxt">Aguardando sinal</span></div>
    </div>
  </div>

  <div class="destaque">
    <div class="big" id="bigGps" data-state="off">
      <div class="big__ico"><svg viewBox="0 0 24 24"><path d="M12 21c-4-4.5-6-7.6-6-10a6 6 0 1 1 12 0c0 2.4-2 5.5-6 10z"/><circle cx="12" cy="11" r="2.3"/></svg></div>
      <div class="big__txt"><span class="big__nome">GPS</span><span class="big__estado" id="bigGpsEstado">Sem sinal</span><span class="big__dado" id="bigGpsDado">&nbsp;</span></div>
    </div>
    <div class="big" id="bigMotor" data-state="off">
      <div class="big__ico"><svg viewBox="0 0 24 24"><path d="M5.2 17.8a9 9 0 1 1 13.6 0"/><path d="M12 12l4-2.5"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/><path d="M12 5v1.4M6.6 9.4l1 .6M17.4 9.4l-1 .6"/></svg></div>
      <div class="big__txt"><span class="big__nome">Motor (injeção)</span><span class="big__estado" id="bigMotorEstado">Sem sinal</span><span class="big__dado" id="bigMotorDado">&nbsp;</span></div>
    </div>
  </div>

  <div class="grupos" id="grupos"><!-- preenchido por JS --></div>

  <div class="rodape">Verde = comunicando · Vermelho = sem sinal · Amarelo = falha · Cinza = aparelho ainda <b>a instalar</b>.</div>
</section>

<script>
// ──────────────────────────────────────────────────────────────────────────
// TELA "ANTES DE RODAR" — status com o carro parado; vira o painel do piloto ao andar.
// Duas versões de layout: ?tela=notebook (10,5") | ?tela=celular (girado).
// Os DADOS (status + valor de cada aparelho + velocidade) vêm da MESMA volta real
// que o painel usa (na bancada/pista, troca-se a fonte pelo feed real do notebook).
// O painel do piloto APROVADO é embutido sem alteração e aparece quando o carro anda.
// Limiares de velocidade são DEFAULTS de demonstração; calibrar na pista.
// ──────────────────────────────────────────────────────────────────────────
const SVG = {
  rpm:'<path d="M5.2 17.8a9 9 0 1 1 13.6 0"/><path d="M12 12l4-2.5"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/><path d="M12 5v1.4M6.6 9.4l1 .6M17.4 9.4l-1 .6"/>',
  acelerador:'<rect x="9" y="3.5" width="6" height="12.5" rx="3" transform="rotate(10 12 10)"/><path d="M10.6 7l3 .7M10.2 9.6l3 .7M9.8 12.2l3 .7"/><path d="M6 19.5h12"/>',
  'freio-pedal':'<circle cx="11.5" cy="12" r="7.3"/><circle cx="11.5" cy="12" r="2.4"/><rect x="14.6" y="8.8" width="5" height="6.4" rx="1.6"/><path d="M11.5 4.7v1.5M11.5 17.8v1.5M4.6 12h1.5"/>',
  agua:'<path d="M12 4.2a1.8 1.8 0 0 1 1.8 1.8v6.5a3.2 3.2 0 1 1-3.6 0V6a1.8 1.8 0 0 1 1.8-1.8z"/><path d="M12 8v4.2"/><circle cx="12" cy="14.6" r="1.4" fill="currentColor"/><path d="M4.6 20c.9-1 1.8-1 2.7 0s1.8 1 2.7 0M14 20c.9-1 1.8-1 2.7 0s1.8 1 2.7 0"/>',
  lambda:'<path d="M7 19.5L12 6l5 13.5"/><path d="M12 6l-1.5-2.3"/>',
  bateria:'<rect x="3.5" y="8.5" width="17" height="9" rx="1.6"/><path d="M7.5 8.5V6.5h2.2v2M14.3 8.5V6.5h2.2v2"/><path d="M6.5 13h2.6M7.8 11.7v2.6"/><path d="M15 13h2.6"/>',
  'motor-alarme':'<path d="M19.4 13a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/><circle cx="12" cy="12" r="3"/>',
  gps:'<path d="M12 21c-4-4.5-6-7.6-6-10a6 6 0 1 1 12 0c0 2.4-2 5.5-6 10z"/><circle cx="12" cy="11" r="2.3"/>',
  acel:'<circle cx="12" cy="12" r="8"/><path d="M12 4v16M4 12h16"/><circle cx="14.6" cy="9.4" r="1.7" fill="currentColor"/>',
  pneus:'<circle cx="12" cy="12" r="8.4"/><circle cx="12" cy="12" r="5.6"/><circle cx="12" cy="12" r="2.6"/><path d="M12 3.6v2M12 18.4v2M3.6 12h2M18.4 12h2M6.1 6.1l1.4 1.4M16.5 16.5l1.4 1.4M17.9 6.1l-1.4 1.4M6.1 17.9l1.4-1.4"/>',
  suspensao:'<path d="M9 4.5h6M9 19.5h6M12 4.5v1.6M12 17.9v1.6"/><path d="M9 7c0 1.3 6 1.3 6 0M9 10c0 1.3 6 1.3 6 0M9 13c0 1.3 6 1.3 6 0M9 16c0 1.3 6 1.3 6 0"/>',
  cambio:'<circle cx="12" cy="5" r="2"/><path d="M12 7v5"/><path d="M7 12h10"/><path d="M7 12v3M12 12v4M17 12v3"/>',
  'freio-ded':'<circle cx="12" cy="12" r="5"/><path d="M12 9.4v3.1"/><circle cx="12" cy="14.7" r="0.7" fill="currentColor"/><path d="M5 8.5a6.5 6.5 0 0 0 0 7M19 8.5a6.5 6.5 0 0 1 0 7"/>',
  direcao:'<circle cx="12" cy="12" r="8.4"/><circle cx="12" cy="12" r="2.3"/><path d="M9.8 12H3.6M14.2 12h6.2M12 14.3v6.1"/>',
};
const GRUPOS = [
  { nome:'Motor', ids:['rpm','acelerador','freio-pedal','agua','lambda','bateria','motor-alarme'] },
  { nome:'Movimento', ids:['gps','acel'] },
  { nome:'Chassi', ids:['pneus','suspensao','cambio','freio-ded','direcao'] },
];
const NOME = {
  rpm:'Rotação', acelerador:'Acelerador', 'freio-pedal':'Pedal de freio', agua:'Temp. da água',
  lambda:'Sonda lambda', bateria:'Bateria', 'motor-alarme':'Alarmes do motor',
  gps:'GPS', acel:'Força G',
  pneus:'Pneus', suspensao:'Suspensão', cambio:'Câmbio', 'freio-ded':'Freio (linha)', direcao:'Direção',
};
const A_INSTALAR = new Set(['pneus','suspensao','cambio','freio-ded','direcao']);
const PALAVRA = { ok:'Comunicando', off:'Sem sinal', warn:'Falha', instalar:'A instalar' };

// Layout pedido na URL
const params = new URLSearchParams(location.search);
const TELA = (params.get('tela') === 'celular') ? 'celular' : 'notebook';
document.body.dataset.tela = TELA;
const MODO_FIXO = params.get('modo'); // 'parado' | 'andando' trava pra inspecionar

// Monta a grade
const elGrupos = document.getElementById('grupos');
const cardEl = {};
for (const g of GRUPOS) {
  const sec = document.createElement('div'); sec.className = 'grupo';
  sec.innerHTML = `<div class="grupo__tit">${g.nome}</div>`;
  const wrap = document.createElement('div'); wrap.className = 'cards';
  for (const id of g.ids) {
    const c = document.createElement('div'); c.className = 'card'; c.dataset.state = 'off';
    c.innerHTML =
      `<div class="card__nome">${NOME[id]}</div>` +
      `<div class="card__ico"><svg viewBox="0 0 24 24">${SVG[id]}</svg></div>` +
      `<div class="card__dado" data-dado>—</div>` +
      `<div class="card__estado" data-estado>—</div>`;
    wrap.appendChild(c); cardEl[id] = c;
  }
  sec.appendChild(wrap); elGrupos.appendChild(sec);
}

// ── Dados: a MESMA volta real que o painel usa ──
let pista = [], motor = [], iP = 0, iM = 0, start = null;
let prevG = null, velBuf = [], ultKmh = 0, ultMotor = null, gpsRecebido = false;
function metros(a, b){ const R=6378137, r=Math.PI/180; const la1=a.lat*r, la2=b.lat*r;
  const x=(b.lon-a.lon)*r*Math.cos((la1+la2)/2), y=(la2-la1); return Math.sqrt(x*x+y*y)*R; }
function velDe(p){
  if (prevG){ const d=metros(prevG,p), dt=(p.t-prevG.t)/1000;
    if (dt>0){ let v=d/dt*3.6; if (v>200) v=velBuf.length?velBuf[velBuf.length-1]:0; velBuf.push(v); if (velBuf.length>5) velBuf.shift(); } }
  prevG=p; return velBuf.length ? velBuf.reduce((a,b)=>a+b,0)/velBuf.length : 0;
}
// status do motor — mesma regra do painel aprovado (sem inventar falha)
function statusMotor(m){
  const al=m.al||{}, algum=Object.values(al).some(Boolean);
  return {
    rpm:'ok', acelerador:'ok', 'freio-pedal':'ok', bateria:'ok',
    agua:(m.agua>110||al.excessoTempMotor)?'warn':'ok',
    lambda:(al.wbMaximo||al.wbMinimo||al.nbMaximo||al.nbMinimo)?'warn':'ok',
    'motor-alarme':algum?'warn':'ok',
  };
}
function dadoMotor(m){
  const al=m.al||{}, n=Object.values(al).filter(Boolean).length;
  return {
    rpm:Math.round(m.rpm||0)+' rpm',
    acelerador:Math.round(m.tps||0)+'%',
    'freio-pedal':Math.round(m.fre||0)+'%',
    agua:(m.agua!=null?Math.round(m.agua)+'°C':'—'),
    lambda:(m.lam!=null?Number(m.lam).toFixed(2):'—'),
    bateria:(m.bat!=null?Number(m.bat).toFixed(1)+' V':'—'),
    'motor-alarme':(n?n+(n>1?' alertas':' alerta'):'tudo ok'),
  };
}

const $ = id => document.getElementById(id);
function setCard(id, st, dado){
  const c = cardEl[id]; if (!c) return;
  if (c.dataset.state !== st) c.dataset.state = st;
  c.querySelector('[data-estado]').textContent = PALAVRA[st];
  c.querySelector('[data-dado]').textContent = (dado==null||dado==='') ? '—' : dado;
}
function setBig(p, st, estadoTxt, dado){
  $('big'+p).dataset.state = st; $('big'+p+'Estado').textContent = estadoTxt;
  $('big'+p+'Dado').innerHTML = dado || '&nbsp;';
}

// ── Modo parado/andando por velocidade, com histerese ──
const V_ANDA=15, V_PARA=8, T_PARA=800;
let modo='parado', lentoDesde=null;
function decidirModo(vel){
  if (MODO_FIXO==='parado'||MODO_FIXO==='andando'){ modo=MODO_FIXO; return; }
  const now=performance.now();
  if (modo==='parado'){ if (vel>=V_ANDA){ modo='andando'; lentoDesde=null; } }
  else { if (vel<=V_PARA){ if (lentoDesde==null) lentoDesde=now; else if (now-lentoDesde>=T_PARA) modo='parado'; } else lentoDesde=null; }
}

const FATOR = 8;
function frame(now){
  if (start==null) start=now;
  const td=(now-start)*FATOR;
  while (iP<pista.length && pista[iP].t<=td){ ultKmh=velDe(pista[iP]); gpsRecebido=true; iP++; }
  while (iM<motor.length && motor[iM].t<=td){ ultMotor=motor[iM]; iM++; }
  if (iP>=pista.length && iM>=motor.length){ iP=0; iM=0; start=now; prevG=null; velBuf=[]; ultKmh=0; gpsRecebido=false; }

  let velMostrar = ultKmh;
  if (MODO_FIXO==='parado'){ velMostrar=0; }   // inspeção: parado coerente, mas com dados reais
  decidirModo(velMostrar);
  document.body.dataset.modo = modo;
  $('modoTxt').textContent = (modo==='andando') ? 'andando' : 'parado';
  $('velTxt').textContent = Math.round(velMostrar)+' km/h';

  // Motor
  const ms = ultMotor ? statusMotor(ultMotor) : null;
  const md = ultMotor ? dadoMotor(ultMotor) : null;
  for (const id of GRUPOS[0].ids) setCard(id, ms?ms[id]:'off', md?md[id]:'');
  // Movimento
  const gpsSt = gpsRecebido ? 'ok' : 'off';
  setCard('gps', gpsSt, gpsSt==='ok' ? Math.round(velMostrar)+' km/h' : '');
  setCard('acel', 'off', '');   // acelerômetro: a volta gravada não trouxe esse dado
  // Chassi (a instalar)
  for (const id of GRUPOS[2].ids) setCard(id, 'instalar', '');

  // Destaque GPS + Motor (decidem a gravação)
  setBig('Gps', gpsSt, gpsSt==='ok'?'Chegando':'Sem sinal', gpsSt==='ok'?(Math.round(velMostrar)+' km/h'):'');
  const motorOn = !!ultMotor;
  setBig('Motor', motorOn?(ms['motor-alarme']==='warn'?'warn':'ok'):'off', motorOn?'Chegando':'Sem sinal',
         motorOn?('rotação '+md.rpm+' · '+md.agua):'');
  const pronto = (gpsSt==='ok' && motorOn);
  $('pronto').dataset.ok = pronto?'sim':'nao';
  $('prontoTxt').textContent = pronto ? 'Pronto pra gravar' : 'Aguardando sinal';

  requestAnimationFrame(frame);
}

(async function boot(){
  try{
    const r = await fetch('/web/cockpit/fixtures/volta-real-pista-24-05.json');
    const j = await r.json();
    pista = j.pista || []; motor = j.motor || [];
  }catch(e){ /* sem dados: a grade mostra "sem sinal" */ }
  requestAnimationFrame(frame);
})();
</script>
