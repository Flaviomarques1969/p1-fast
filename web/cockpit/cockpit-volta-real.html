<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=956, initial-scale=1">
<title>P1 Fast — Cockpit do Piloto · SUA VOLTA REAL (Brasília)</title>
<link rel="stylesheet" href="cockpit.css">
<style>
  body { margin: 0; background: #050a14; }
  .topo {
    position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
    background: #0b1220; color: #e8eef5; border-bottom: 1px solid #1e293b;
    padding: 8px 16px; font: 12px/1.3 -apple-system, "Segoe UI", sans-serif;
    display: flex; gap: 14px; align-items: center; justify-content: space-between; flex-wrap: wrap;
  }
  .topo b { color: #38bdf8; }
  .topo .real { color: #34d399; font-weight: 800; }
  .topo small { color: #94a3b8; }
  .hud { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .hud .item { display: flex; flex-direction: column; align-items: flex-end; min-width: 60px; }
  .hud .item .lbl { color: #64748b; font-size: 10px; text-transform: uppercase; letter-spacing: .04em; }
  .hud .item .val { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 18px; font-weight: 800; }
  .hud .curva .val { color: #fbbf24; font-size: 15px; min-width: 160px; text-align: right; }
  .stage { padding-top: 86px; display: flex; justify-content: center; }
  /* Flávio 22/06: sem brilho de fundo no painel — nem âmbar (recorde) nem roxo (pior). */
  .device::before { display: none !important; }
  /* Flávio 22/06: número FIXO na esquerda (nunca centralizado, nunca desliza).
     A frase de PILOTAGEM fica embaixo do número, à esquerda. As mensagens
     (crítica/motor/box) vêm pela DIREITA — lugar reservado pro ghost; um troca
     de lugar com o outro (ghost por padrão, mensagem aparece por cima quando vier). */
  .info-bloco { left: 72px; transform: translateY(-50%); align-items: flex-start; text-align: left; }
  .device[data-msg-state="ativa"] .info-bloco { transform: translateY(-50%); }
  /* Flávio 22/06: 14 ícones de sensor no TOPO; barra das voltas desce um pouco;
     coluna de bolinhas da direita sai (vira esta fileira). Cor: vermelho = sem
     comunicação, verde = comunicando, amarelo = falha. */
  .telemetria-chip { display: none !important; }
  .stint-bar { top: 66px !important; }
  /* CLUSTER DE SENSORES — bandeja de vidro com lentes, identidade própria,
     separada da barra de voltas. Vermelho=sem comunicação, verde=comunicando, amarelo=falha. */
  .sensor-row {
    position: absolute; left: 50%; top: 6px; transform: translateX(-50%);
    z-index: 40; pointer-events: none;
    display: flex; align-items: flex-start; gap: 36px; padding: 6px 22px 8px;
    border-radius: 16px;
    background: linear-gradient(180deg, oklch(17% 0 0 / .65), oklch(8% 0 0 / .65));
    border: 1px solid oklch(100% 0 0 / .06);
    box-shadow:
      inset 0 1px 0 oklch(100% 0 0 / .07),
      inset 0 -1px 0 oklch(0% 0 0 / .55),
      0 8px 22px oklch(0% 0 0 / .5);
    -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
  }
  .sensor-group { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .sensor-group__title { font-family: var(--ff-display); font-size: 8px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: oklch(58% 0 0); }
  .sensor-group__icons { display: flex; align-items: center; gap: 12px; }
  .sensor {
    position: relative; width: 25px; height: 25px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 32%, oklch(24% 0 0), oklch(9% 0 0));
    box-shadow: inset 0 1px 0 oklch(100% 0 0 / .10), inset 0 0 0 1px oklch(100% 0 0 / .05), 0 1px 2px oklch(0% 0 0 / .55);
    transition: color 240ms var(--ease-out), box-shadow 240ms var(--ease-out);
  }
  .sensor svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.55; stroke-linecap: round; stroke-linejoin: round; }
  /* vermelho — sem comunicação: contido, sem brilho (parece "aguardando") */
  .sensor[data-state="off"] { color: oklch(58% 0.17 27); box-shadow: inset 0 1px 0 oklch(100% 0 0 / .07), inset 0 0 0 1px oklch(55% 0.20 27 / .30), 0 1px 2px oklch(0% 0 0 / .55); }
  .sensor[data-state="off"] svg { opacity: .82; }
  /* verde — comunicando: vivo, com halo */
  .sensor[data-state="ok"] { color: var(--bom); box-shadow: inset 0 1px 0 oklch(100% 0 0 / .12), inset 0 0 0 1px oklch(80% 0.22 145 / .45), 0 0 11px oklch(80% 0.22 145 / .38), 0 1px 2px oklch(0% 0 0 / .55); }
  .sensor[data-state="ok"] svg { filter: drop-shadow(0 0 3px oklch(80% 0.22 145 / .7)); }
  /* amarelo — falha: halo âmbar + pulso de atenção */
  .sensor[data-state="warn"] { color: var(--foco); animation: sensorPulse 1.4s var(--ease-inout) infinite; }
  .sensor[data-state="warn"] svg { filter: drop-shadow(0 0 4px oklch(82% 0.19 70 / .85)); }
  @keyframes sensorPulse {
    0%, 100% { box-shadow: inset 0 1px 0 oklch(100% 0 0 / .12), inset 0 0 0 1px oklch(82% 0.19 70 / .55), 0 0 9px oklch(82% 0.19 70 / .4), 0 1px 2px oklch(0% 0 0 / .55); }
    50%      { box-shadow: inset 0 1px 0 oklch(100% 0 0 / .12), inset 0 0 0 1px oklch(82% 0.19 70 / .9),  0 0 17px oklch(82% 0.19 70 / .8), 0 1px 2px oklch(0% 0 0 / .55); }
  }
</style>
</head>

<script type="module">
// REPLAY DA VOLTA REAL — 100% local (sem nuvem, sem clique).
// Pista (curva/ápice/entrada/saída/delta/velocidade) = volta real 24/05 (GPS).
//   Velocidade é CALCULADA pela posição (o sensor de velocidade do GPS veio zerado).
// Motor (luz de marcha + água/lambda/acelerador) = sessão real 21/06 (T4000).
// Tudo dado REAL seu. Reusa as peças reais do painel.
import { CockpitState, ApexEstado, TrechoStatus, Tone } from './cockpit-state.js';
import { attachRendererToDocument } from './cockpit-renderer.js';
import { LiveDataBridge, DEFAULT_LIMITS } from './live-data-bridge.js';

const cockpitState = new CockpitState();
attachRendererToDocument(cockpitState, document);
const bridge = new LiveDataBridge({
  cockpitState,
  limits: { ...DEFAULT_LIMITS, peakTorqueRpm: 6050, redlineRpm: 6300, torqueLitOffsetRpm: 700, waterTempMaxC: 110 },
});

const $ = id => document.getElementById(id);
const FATOR = 8;
const RAIO = 40, SAIR = 60;

function metros(a, b) {
  const R = 6378137, r = Math.PI / 180;
  const la1 = a.lat * r, la2 = b.lat * r;
  const x = (b.lng - a.lng) * r * Math.cos((la1 + la2) / 2);
  const y = (la2 - la1);
  return Math.sqrt(x * x + y * y) * R;
}

let curvas = [], pista = [], motor = [], durMax = 0;
let iP = 0, iM = 0, start = null;
let prevG = null, velBuf = [];
let ultKmh = 0;
let curvaAtiva = null;
const tempoAnterior = new Map();

// ── Sensores no topo (14 ícones): vermelho=sem comunicação, verde=comunicando, amarelo=falha.
const sensorEls = {};
document.querySelectorAll('.sensor[data-sensor]').forEach(el => { sensorEls[el.dataset.sensor] = el; });
function setSensor(id, st) { const el = sensorEls[id]; if (el && el.dataset.state !== st) el.dataset.state = st; }
const SENS_MOTOR = ['rpm', 'acelerador', 'freio-pedal', 'bateria', 'agua', 'lambda', 'motor-alarme'];
function aplicarMotorStatus(m) {
  // A injeção está comunicando (temos amostra) → verde. Amarelo só quando o PRÓPRIO
  // dado mostra falha real (alarme do motor ou limite estourado). Sem inventar.
  const al = m.al || {};
  const algumAlarme = Object.values(al).some(Boolean);
  setSensor('rpm', 'ok'); setSensor('acelerador', 'ok'); setSensor('freio-pedal', 'ok'); setSensor('bateria', 'ok');
  setSensor('agua', (m.agua > 110 || al.excessoTempMotor) ? 'warn' : 'ok');
  setSensor('lambda', (al.wbMaximo || al.wbMinimo || al.nbMaximo || al.nbMinimo) ? 'warn' : 'ok');
  setSensor('motor-alarme', algumAlarme ? 'warn' : 'ok');
}

function velDe(p) {
  if (prevG) {
    const d = metros({ lat: prevG.lat, lng: prevG.lon }, { lat: p.lat, lng: p.lon });
    const dt = (p.t - prevG.t) / 1000;
    if (dt > 0) {
      let v = d / dt * 3.6;
      if (v > 200) v = velBuf.length ? velBuf[velBuf.length - 1] : 0;  // descarta salto de GPS
      velBuf.push(v); if (velBuf.length > 5) velBuf.shift();
    }
  }
  prevG = p;
  return velBuf.length ? velBuf.reduce((a, b) => a + b, 0) / velBuf.length : 0;
}

function aplicarMotor(p) {
  bridge.ingestT4000({
    source: 'real', parserVersion: 'real', tMono: p.t, checksumOk: true, bytesLen: 0,
    rpm: p.rpm, tpsPct: p.tps, pedalFreioPct: p.fre, waterTempC: p.agua,
    lambda: p.lam, batteryV: p.bat, alarmes: p.al || {},
  });
  $('hRpm').textContent = Math.round(p.rpm ?? 0);
  $('hTps').textContent = (p.tps != null ? Math.round(p.tps) : 0) + '%';
  $('hAgua').textContent = (p.agua != null ? Math.round(p.agua) + '°' : '—');
  $('hLam').textContent = (p.lam != null ? p.lam.toFixed(2) : '—');
}

function curvaMaisProxima(pos) {
  let best = null, bd = Infinity;
  for (const c of curvas) { const d = metros(pos, c.apice); if (d < bd) { bd = d; best = c; } }
  return { best, bd };
}

function fecharPassagem(p) {
  const a = curvaAtiva; if (!a) return;
  const tempoS = (p.t - a.tEnt) / 1000;
  cockpitState.setApexPonto('saida', { estado: ApexEstado.OK_MELHOR, valorKmh: Math.round(ultKmh), nomeCurva: a.c.nome });
  const ref = tempoAnterior.get(a.c.id);
  if (ref != null && tempoS > 0.5) {
    const d = tempoS - ref;
    // Sem sinal: só o valor. Bom = verde, ruim = vermelho (Flávio 22/06).
    cockpitState.setDelta({ value: Math.abs(d).toFixed(2), tone: d <= 0 ? Tone.BOM : Tone.ERRO });
    cockpitState.setAcao({ texto: d <= 0 ? 'RECORDE' : 'BUSCAR LIMITE', tone: d <= 0 ? Tone.BOM : Tone.NEUTRO });
    cockpitState.setTrechoStatus(d <= 0 ? TrechoStatus.RECORDE_STINT : TrechoStatus.PIOR_STINT);
  } else {
    cockpitState.setAcao({ texto: 'REGISTRANDO', tone: Tone.NEUTRO });
    cockpitState.setTrechoStatus(TrechoStatus.NEUTRO);
  }
  if (tempoS > 0.5) tempoAnterior.set(a.c.id, tempoS);
  curvaAtiva = null;
}

function aplicarGps(p) {
  setSensor('gps', 'ok');   // GPS comunicando (estamos recebendo posição)
  ultKmh = velDe(p);
  $('hVel').textContent = Math.round(ultKmh);
  const pos = { lat: p.lat, lng: p.lon };
  if (!curvaAtiva) {
    const { best, bd } = curvaMaisProxima(pos);
    if (best && bd <= RAIO) {
      curvaAtiva = { c: best, tEnt: p.t, vmin: ultKmh, distMin: bd };
      $('hCurva').textContent = best.nome;
      $('hVmin').textContent = '—'; $('hApice').textContent = Math.round(bd) + ' m';
      cockpitState.setApexPonto('entrada', { estado: ApexEstado.OK_MELHOR, valorKmh: Math.round(ultKmh), nomeCurva: best.nome });
      cockpitState.setApexPonto('freio', { estado: ApexEstado.PENDENTE });
      cockpitState.setApexPonto('apice', { estado: ApexEstado.PENDENTE });
      cockpitState.setApexPonto('saida', { estado: ApexEstado.PENDENTE });
    }
  } else {
    const d = metros(pos, curvaAtiva.c.apice);
    if (ultKmh > 0 && ultKmh < curvaAtiva.vmin) curvaAtiva.vmin = ultKmh;
    if (d < curvaAtiva.distMin) curvaAtiva.distMin = d;
    $('hApice').textContent = Math.round(d) + ' m';        // ao vivo: distância agora
    $('hVmin').textContent = Math.round(curvaAtiva.vmin);
    // Veredito do ápice = MELHOR aproximação desta passagem (distMin), não a distância
    // ao vivo. Quando você passa rente ao ápice ideal, ACENDE verde e FICA até a saída —
    // não volta a vermelho enquanto o carro se afasta (era a mentira de antes).
    // Sem prova de erro a 1 Hz (GPS lê 1×/s; o carro anda ~40 m entre leituras): fora dos
    // 10 m fica NEUTRO, nunca vermelho — o sistema não acusa "errou" o que não mede.
    // (Com o RaceBox a 25×/s esse 10 m aperta de verdade.)
    const dMin = curvaAtiva.distMin;
    cockpitState.setApexPonto('apice', {
      estado: dMin <= 10 ? ApexEstado.OK_MELHOR : ApexEstado.PENDENTE,
      distM: Math.round(dMin),
    });
    if (d > SAIR) fecharPassagem(p);
  }
}

function resetVolta() {
  curvaAtiva = null; prevG = null; velBuf = []; tempoAnterior.clear();
  $('hCurva').textContent = '— (reiniciando)';
  ['gps', ...SENS_MOTOR].forEach(id => setSensor(id, 'off'));   // volta a "sem comunicação" até religar
}

function passo(td) {
  // Só a pista (GPS). O motor desta volta não foi gravado junto — luz de marcha
  // fica fora pra não mostrar rotação incoerente com a velocidade.
  while (iP < pista.length && pista[iP].t <= td) { aplicarGps(pista[iP]); iP++; }
  // O motor (saúde dos sensores) avança em paralelo SÓ pros ícones do topo —
  // não alimenta a luz de marcha (rotação desta gravação não casa com a velocidade do GPS).
  while (iM < motor.length && motor[iM].t <= td) { aplicarMotorStatus(motor[iM]); iM++; }
}

function frame(now) {
  if (start == null) start = now;
  const td = (now - start) * FATOR;
  passo(td);
  const seg = Math.floor(td / 1000);
  $('tempo').textContent = String(Math.floor(seg / 60)).padStart(2, '0') + ':' + String(seg % 60).padStart(2, '0');
  if (iP >= pista.length && iM >= motor.length) { iP = 0; iM = 0; start = now; resetVolta(); }
  requestAnimationFrame(frame);
}

(async function boot() {
  const rc = await fetch('/_design-reference/BARRAS-BRASILIA-FLAVIO-APROVADO-2026-05-27.json');
  const jc = await rc.json();
  const arr = Array.isArray(jc) ? jc : (jc.segments || jc.curvas || jc.barras || Object.values(jc).find(Array.isArray));
  curvas = arr.map(c => ({ id: c.id, nome: c.nome || c.id, apice: { lat: c.apice_gps.lat, lng: c.apice_gps.lng } }));

  const rv = await fetch('/web/cockpit/fixtures/volta-real-pista-24-05.json');
  const jv = await rv.json();
  pista = jv.pista; motor = jv.motor; durMax = Math.max(jv.durPista, jv.durMotor);

  // ?pose=SEGUNDOS congela um instante DENTRO de uma curva (pra conferência/foto)
  const pose = new URLSearchParams(location.search).get('pose');
  if (pose != null) {
    const alvo = Number(pose) * 1000;
    passo(alvo);
    let guard = 0;
    while (!curvaAtiva && iP < pista.length && guard < 5000) { passo(pista[iP].t + 1); guard++; }
    const seg = Math.floor((pista[Math.min(iP, pista.length - 1)]?.t || 0) / 1000);
    $('tempo').textContent = String(Math.floor(seg / 60)).padStart(2, '0') + ':' + String(seg % 60).padStart(2, '0');
  } else {
    requestAnimationFrame(frame);
  }
})();
</script>
