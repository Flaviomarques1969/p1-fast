<!doctype html>
<html lang="pt-BR" data-mobile="true">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=956, initial-scale=1">
<title>P1 Fast — Cockpit Piloto · Bubi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="cockpit.css">
<style>
  /* topo de conexão — minimal, fora do cockpit canônico */
  body { margin: 0; }
  .conn-bar {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; align-items: center; gap: 12px; padding: 8px 14px;
    background: rgba(0,0,0,0.85); color: #e8eef5;
    font: 13px/1.3 -apple-system, "Segoe UI", sans-serif;
    z-index: 1000; border-bottom: 1px solid #2a3645;
  }
  .conn-bar .btn {
    background: #38bdf8; color: #001724; border: none;
    padding: 8px 16px; font-size: 14px; font-weight: 700;
    border-radius: 6px; cursor: pointer;
  }
  .conn-bar .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .conn-status { padding: 4px 10px; border-radius: 5px; font-weight: 600; font-size: 12px; }
  .conn-status.ok   { background: #0f3a23; color: #86efac; }
  .conn-status.warn { background: #3a2a0f; color: #fcd34d; }
  .conn-status.bad  { background: #3a0f0f; color: #fca5a5; }
  .hud { display: flex; gap: 16px; font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  .hud b { color: #8a99a8; font-weight: 600; margin-right: 4px; }
  .conn-log {
    position: fixed; bottom: 8px; right: 8px; max-width: 360px; max-height: 160px; overflow-y: auto;
    background: rgba(0,0,0,0.7); color: #cbd5e1; font: 11px/1.4 ui-monospace, Consolas, monospace;
    padding: 8px; border-radius: 6px; z-index: 999;
  }
  .stage { padding-top: 56px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
</style>
</head>
<body>

<div class="conn-bar">
  <button class="btn" id="btnConnect">Autorizar T3000 via WebUSB</button>
  <span class="conn-status warn" id="connStatus">aguardando</span>
  <span class="hud" id="hud"><b>RPM</b>—</span>
</div>

<div class="stage">
  <div class="device" id="device" data-trecho-status="neutro" data-msg-state="oculta" data-shift-fire="idle">
    <div class="notch"></div>
    <div class="fire-overlay"></div>

    <div class="telemetria-chip">
      <span class="telemetria-chip__dot ok"></span>
      <span class="telemetria-chip__dot ok"></span>
      <span class="telemetria-chip__dot ok"></span>
      <span class="telemetria-chip__dot ok"></span>
      <span class="telemetria-chip__dot ok"></span>
      <span class="telemetria-chip__dot ok"></span>
    </div>

    <div class="shift-light" id="shiftLight" data-state="off">
      <span class="shift-light__dot" data-tier="1"></span>
      <span class="shift-light__dot" data-tier="2"></span>
      <span class="shift-light__dot" data-tier="3"></span>
      <span class="shift-light__dot" data-tier="4"></span>
      <span class="shift-light__dot" data-tier="5"></span>
      <span class="shift-light__dot" data-tier="6"></span>
      <span class="shift-light__dot" data-tier="6"></span>
      <span class="shift-light__dot" data-tier="5"></span>
      <span class="shift-light__dot" data-tier="4"></span>
      <span class="shift-light__dot" data-tier="3"></span>
      <span class="shift-light__dot" data-tier="2"></span>
      <span class="shift-light__dot" data-tier="1"></span>
    </div>

    <section class="apex">
      <div class="apex__ponto" data-estado="pendente">
        <span class="apex__label">Entrada</span>
        <span class="apex__valor">—</span>
      </div>
      <div class="apex__ponto" data-estado="pendente" data-papel="freio">
        <span class="apex__label">Freio</span>
        <span class="apex__valor">—</span>
      </div>
      <div class="apex__ponto" data-estado="pendente">
        <span class="apex__label">Ápice</span>
        <span class="apex__valor">—</span>
      </div>
      <div class="apex__ponto" data-estado="pendente">
        <span class="apex__label">Saída</span>
        <span class="apex__valor">—</span>
      </div>
    </section>

    <div class="info-bloco">
      <span class="info__delta">0.00</span>
      <div class="info__acao"></div>
    </div>

    <aside class="alert-bloco" id="alertBloco" data-tipo="comunicacao">
      <div class="alert__msg" id="alertMsg"></div>
    </aside>

    <div class="stint-bar">
      <div class="stint-bar__block"></div>
      <div class="stint-bar__block"></div>
      <div class="stint-bar__block"></div>
      <div class="stint-bar__block"></div>
      <div class="stint-bar__block"></div>
      <div class="stint-bar__block"></div>
      <div class="stint-bar__block"></div>
      <div class="stint-bar__block"></div>
      <div class="stint-bar__block"></div>
      <div class="stint-bar__block"></div>
      <div class="stint-bar__block"></div>
      <div class="stint-bar__block"></div>
    </div>
  </div>
</div>

<div class="conn-log" id="connLog"></div>

<script type="module" src="main-t3000.js"></script>
</body>
</html>
