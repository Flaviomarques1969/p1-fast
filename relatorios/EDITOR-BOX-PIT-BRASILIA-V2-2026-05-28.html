const INICIAL={box:{"lat": -15.7732731942197, "lng": -47.9009996670708},pit_in:{"a": {"lat": -15.7733731942197, "lng": -47.9010996670708}, "b": {"lat": -15.7733731942197, "lng": -47.900899667070796}},pit_out:{"a": {"lat": -15.7731731942197, "lng": -47.9010996670708}, "b": {"lat": -15.7731731942197, "lng": -47.900899667070796}}};
let m=JSON.parse(JSON.stringify(INICIAL));
function proj(lat,lng){const xm=(lng-PARAMS.lngMin)*PARAMS.M_LNG,ym=(PARAMS.latMax-lat)*PARAMS.M_LAT;return{x:PARAMS.PAD+xm/PARAMS.extX_m*(PARAMS.W-2*PARAMS.PAD),y:PARAMS.PAD+ym/PARAMS.extY_m*(PARAMS.H-2*PARAMS.PAD)};}
function unproj(x,y){const xm=(x-PARAMS.PAD)/(PARAMS.W-2*PARAMS.PAD)*PARAMS.extX_m,ym=(y-PARAMS.PAD)/(PARAMS.H-2*PARAMS.PAD)*PARAMS.extY_m;return{lng:PARAMS.lngMin+xm/PARAMS.M_LNG,lat:PARAMS.latMax-ym/PARAMS.M_LAT};}
const svg=document.getElementById('mapa'),g=document.getElementById('pontos');
function render(){g.innerHTML='';
let ea=proj(m.pit_in.a.lat,m.pit_in.a.lng),eb=proj(m.pit_in.b.lat,m.pit_in.b.lng);
g.insertAdjacentHTML('beforeend',`<line x1="${ea.x}" y1="${ea.y}" x2="${eb.x}" y2="${eb.y}" stroke="#ff6b6b" stroke-width="5" stroke-linecap="round"/><circle class="handle" data-papel="pin-a" cx="${ea.x}" cy="${ea.y}" r="9" fill="#ff6b6b" stroke="#fff" stroke-width="2"/><circle class="handle" data-papel="pin-b" cx="${eb.x}" cy="${eb.y}" r="9" fill="#ff6b6b" stroke="#fff" stroke-width="2"/><text class="label" x="${(ea.x+eb.x)/2}" y="${(ea.y+eb.y)/2-12}" fill="#ff6b6b" text-anchor="middle">PIT-IN</text>`);
let sa=proj(m.pit_out.a.lat,m.pit_out.a.lng),sb=proj(m.pit_out.b.lat,m.pit_out.b.lng);
g.insertAdjacentHTML('beforeend',`<line x1="${sa.x}" y1="${sa.y}" x2="${sb.x}" y2="${sb.y}" stroke="#5dd39e" stroke-width="5" stroke-linecap="round"/><circle class="handle" data-papel="pout-a" cx="${sa.x}" cy="${sa.y}" r="9" fill="#5dd39e" stroke="#fff" stroke-width="2"/><circle class="handle" data-papel="pout-b" cx="${sb.x}" cy="${sb.y}" r="9" fill="#5dd39e" stroke="#fff" stroke-width="2"/><text class="label" x="${(sa.x+sb.x)/2}" y="${(sa.y+sb.y)/2+22}" fill="#5dd39e" text-anchor="middle">PIT-OUT</text>`);
let bp=proj(m.box.lat,m.box.lng);
g.insertAdjacentHTML('beforeend',`<circle class="handle" data-papel="box" cx="${bp.x}" cy="${bp.y}" r="14" fill="#a78bfa" stroke="#fff" stroke-width="2"/><text class="label" x="${bp.x}" y="${bp.y+5}" fill="#0b1220" text-anchor="middle">BOX</text>`);}
render();
let arr=null;
function sc(ev){const r=svg.getBoundingClientRect();return{x:(ev.clientX-r.left)*PARAMS.W/r.width,y:(ev.clientY-r.top)*PARAMS.H/r.height};}
svg.addEventListener('pointerdown',ev=>{if(!ev.target.classList.contains('handle'))return;arr=ev.target.dataset.papel;ev.target.setPointerCapture(ev.pointerId);});
svg.addEventListener('pointermove',ev=>{if(!arr)return;const p=sc(ev),ll=unproj(p.x,p.y);
if(arr==='pin-a')m.pit_in.a=ll;else if(arr==='pin-b')m.pit_in.b=ll;
else if(arr==='pout-a')m.pit_out.a=ll;else if(arr==='pout-b')m.pit_out.b=ll;
else if(arr==='box')m.box=ll;
render();});
svg.addEventListener('pointerup',()=>arr=null);
document.getElementById('btnSalvar').onclick=()=>{
const r=v=>+v.toFixed(7);
const out={salvo_em:new Date().toISOString(),
box:{lat:r(m.box.lat),lng:r(m.box.lng)},
pit_in:{a:{lat:r(m.pit_in.a.lat),lng:r(m.pit_in.a.lng)},b:{lat:r(m.pit_in.b.lat),lng:r(m.pit_in.b.lng)}},
pit_out:{a:{lat:r(m.pit_out.a.lat),lng:r(m.pit_out.a.lng)},b:{lat:r(m.pit_out.b.lat),lng:r(m.pit_out.b.lng)}}};
const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='BOX-PIT-BRASILIA-FLAVIO-'+new Date().toISOString().slice(0,10)+'.json';a.click();
const t=document.getElementById('toast');t.textContent='Baixado: '+a.download;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000);};
</script></body></html>
