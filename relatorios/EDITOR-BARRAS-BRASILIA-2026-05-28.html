<title>Brasília — editor das barras (arrastar e salvar)</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1220;color:#e8eef9;font:14px/1.4 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
.wrap{display:grid;grid-template-columns:1fr 320px;height:100vh}
.map-area{position:relative;overflow:auto;background:#0b1220}
.side{background:#101a2e;border-left:1px solid #1f2f4d;padding:18px;overflow:auto}
h1{font-size:18px;margin:0 0 4px}
.sub{color:#8ea0c1;font-size:12px;margin-bottom:14px}
.legenda{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;font-size:12px}
.legenda span{display:flex;align-items:center;gap:8px}
.sw{width:18px;height:5px;border-radius:2px;display:inline-block}
.sw.entrada{background:#ffb454}
.sw.saida{background:#5dd39e}
.sw.apice{background:#e79800;border-radius:50%;width:12px;height:12px}
.botoes{display:flex;gap:8px;flex-direction:column;margin-bottom:14px}
button{background:#5da3ff;color:#0b1220;border:0;padding:10px 14px;border-radius:8px;font-weight:700;cursor:pointer;font-size:13px}
button.sec{background:#1f2f4d;color:#e8eef9}
button:hover{opacity:.9}
.curva-row{padding:8px;border-radius:6px;background:#15233d;border:1px solid #1f2f4d;margin-bottom:6px;cursor:pointer;font-size:12px;display:flex;justify-content:space-between;align-items:center}
.curva-row:hover{background:#1a2a4a}
.curva-row.ativa{border-color:#ffb454}
.curva-row b{color:#ffb454}
svg{display:block;cursor:default}
.handle{cursor:grab}
.handle:active{cursor:grabbing}
.handle:hover{filter:brightness(1.3)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#e79800;color:#0b1220;padding:10px 18px;border-radius:8px;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;z-index:99}
.toast.show{opacity:1}
.label{pointer-events:none;font-size:10px;font-weight:700}
</style></head>

  <aside class="side">
    <h1>Editor das barras</h1>
    <div class="sub">Arraste as pontas laranjas (entrada), as pontas verdes (saída) e as bolinhas douradas (ápice) para o lugar certo. Quando terminar, clique em Salvar.</div>
    <div class="legenda">
      <span><b class="sw entrada"></b> Pontas de entrada (laranjas)</span>
      <span><b class="sw saida"></b> Pontas de saída (verdes)</span>
      <span><b class="sw apice"></b> Ápice (dourado)</span>
    </div>
    <div class="botoes">
      <button id="btnSalvar">Salvar e baixar arquivo</button>
      <button class="sec" id="btnResetar">Voltar ao estado do banco</button>
    </div>
    <div id="lista"></div>
  </aside>
</div>
<div class="toast" id="toast"></div>
<script>
const PARAMS = {"PAD": 40, "W": 1200, "H": 1392, "lngMin": -47.9029905029621, "latMax": -15.7717600251877, "extX_m": 793.9489222346369, "extY_m": 930.6322437091678, "M_LAT": 111132.0, "M_LNG": 107127.3120016029};
const TRECHOS_INICIAIS = [{"id": "ce78dc3a-ceb4-53b7-8481-d38b62cf1f22", "ordem": 0, "nome": "CURVA 01", "entrada": {"a": {"lat": -15.7718974, "lng": -47.8968895}, "b": {"lat": -15.7718022, "lng": -47.8968365}}, "saida": {"a": {"lat": -15.7723494, "lng": -47.8964373}, "b": {"lat": -15.7722799, "lng": -47.8963515}}, "apice": {"lat": -15.7720235, "lng": -47.8965953}}, {"id": "bb99ec7c-cc04-5f0d-9c38-494d72558815", "ordem": 2, "nome": "CURVA DA RETA OPOSTA", "entrada": {"a": {"lat": -15.7737308, "lng": -47.9016232}, "b": {"lat": -15.7738099, "lng": -47.9015469}}, "saida": {"a": {"lat": -15.7744337, "lng": -47.9020574}, "b": {"lat": -15.7744059, "lng": -47.9019492}}, "apice": {"lat": -15.7739802, "lng": -47.9019389}}, {"id": "c175d6f2-366d-52fc-aa72-f3254202b9b2", "ordem": 3, "nome": "CURVA 2", "entrada": {"a": {"lat": -15.779359, "lng": -47.8956944}, "b": {"lat": -15.7794201, "lng": -47.895602}}, "saida": {"a": {"lat": -15.7797676, "lng": -47.8963753}, "b": {"lat": -15.7798752, "lng": -47.8963661}}, "apice": {"lat": -15.7797165, "lng": -47.8959049}}, {"id": "cf329fd2-6698-5b6b-a687-a5f551a47ece", "ordem": 4, "nome": "CURVA DA JUNÇÃO", "entrada": {"a": {"lat": -15.7785617, "lng": -47.9021793}, "b": {"lat": -15.7786039, "lng": -47.9022824}}, "saida": {"a": {"lat": -15.7780433, "lng": -47.9022014}, "b": {"lat": -15.7779946, "lng": -47.9023014}}, "apice": {"lat": -15.7782949, "lng": -47.9022903}}, {"id": "3a4a6027-55d7-50b8-b338-72c4e556afdd", "ordem": 6, "nome": "CURVA DA BRUXA", "entrada": {"a": {"lat": -15.7739502, "lng": -47.8967773}, "b": {"lat": -15.7739913, "lng": -47.8968809}}, "saida": {"a": {"lat": -15.773389, "lng": -47.897528}, "b": {"lat": -15.7734898, "lng": -47.8975681}}, "apice": {"lat": -15.7736283, "lng": -47.8970424}}, {"id": "5dfc81d1-041c-5047-b84d-0be051b14dcd", "ordem": 8, "nome": "CURVA DO PLACAR", "entrada": {"a": {"lat": -15.7743272, "lng": -47.8978085}, "b": {"lat": -15.7742238, "lng": -47.8977763}}, "saida": {"a": {"lat": -15.7750071, "lng": -47.897522}, "b": {"lat": -15.7750278, "lng": -47.897412}}, "apice": {"lat": -15.7745527, "lng": -47.8974684}}, {"id": "96baf23c-1b45-5bd6-8d07-a4d3c1670161", "ordem": 9, "nome": "CURVA \"S\"", "entrada": {"a": {"lat": -15.7767131, "lng": -47.901862}, "b": {"lat": -15.7768059, "lng": -47.9019193}}, "saida": {"a": {"lat": -15.7760989, "lng": -47.9022644}, "b": {"lat": -15.7761588, "lng": -47.9023576}}, "apice": {"lat": -15.7765917, "lng": -47.9022435}}, {"id": "6c64bc49-bea4-5013-8de8-b858189ee425", "ordem": 10, "nome": "CURVA DA VITÓRIA", "entrada": {"a": {"lat": -15.7745418, "lng": -47.9025176}, "b": {"lat": -15.7745636, "lng": -47.9026273}}, "saida": {"a": {"lat": -15.7740177, "lng": -47.9025206}, "b": {"lat": -15.7739752, "lng": -47.9026236}}, "apice": {"lat": -15.7742604, "lng": -47.9026401}}];
let trechos = JSON.parse(JSON.stringify(TRECHOS_INICIAIS));

function proj(lat, lng) {
  const xm = (lng - PARAMS.lngMin) * PARAMS.M_LNG;
  const ym = (PARAMS.latMax - lat) * PARAMS.M_LAT;
  return {
    x: PARAMS.PAD + xm / PARAMS.extX_m * (PARAMS.W - 2*PARAMS.PAD),
    y: PARAMS.PAD + ym / PARAMS.extY_m * (PARAMS.H - 2*PARAMS.PAD),
  };
}
function unproj(x, y) {
  const xm = (x - PARAMS.PAD) / (PARAMS.W - 2*PARAMS.PAD) * PARAMS.extX_m;
  const ym = (y - PARAMS.PAD) / (PARAMS.H - 2*PARAMS.PAD) * PARAMS.extY_m;
  return {
    lng: PARAMS.lngMin + xm / PARAMS.M_LNG,
    lat: PARAMS.latMax - ym / PARAMS.M_LAT,
  };
}

const svg = document.getElementById('mapa');
const grupo = document.getElementById('pontos');
const lista = document.getElementById('lista');

function render() {
  grupo.innerHTML = '';
  trechos.forEach((t, i) => {
    // entrada line
    const ea = proj(t.entrada.a.lat, t.entrada.a.lng);
    const eb = proj(t.entrada.b.lat, t.entrada.b.lng);
    grupo.insertAdjacentHTML('beforeend', `
      <line class="bar-entrada" data-i="${i}" x1="${ea.x}" y1="${ea.y}" x2="${eb.x}" y2="${eb.y}" stroke="#ffb454" stroke-width="5" stroke-linecap="round"/>
      <circle class="handle" data-i="${i}" data-papel="entrada-a" cx="${ea.x}" cy="${ea.y}" r="9" fill="#ffb454" stroke="#fff" stroke-width="2"/>
      <circle class="handle" data-i="${i}" data-papel="entrada-b" cx="${eb.x}" cy="${eb.y}" r="9" fill="#ffb454" stroke="#fff" stroke-width="2"/>
    `);
    // saída line
    const sa = proj(t.saida.a.lat, t.saida.a.lng);
    const sb = proj(t.saida.b.lat, t.saida.b.lng);
    grupo.insertAdjacentHTML('beforeend', `
      <line class="bar-saida" data-i="${i}" x1="${sa.x}" y1="${sa.y}" x2="${sb.x}" y2="${sb.y}" stroke="#5dd39e" stroke-width="5" stroke-linecap="round"/>
      <circle class="handle" data-i="${i}" data-papel="saida-a" cx="${sa.x}" cy="${sa.y}" r="9" fill="#5dd39e" stroke="#fff" stroke-width="2"/>
      <circle class="handle" data-i="${i}" data-papel="saida-b" cx="${sb.x}" cy="${sb.y}" r="9" fill="#5dd39e" stroke="#fff" stroke-width="2"/>
    `);
    // ápice
    const ap = proj(t.apice.lat, t.apice.lng);
    grupo.insertAdjacentHTML('beforeend', `
      <circle class="handle" data-i="${i}" data-papel="apice" cx="${ap.x}" cy="${ap.y}" r="13" fill="#e79800" stroke="#fff" stroke-width="2"/>
      <text class="label" x="${ap.x}" y="${ap.y+4}" fill="#0b1220" text-anchor="middle">${t.ordem}</text>
      <text class="label" x="${ap.x}" y="${ap.y-22}" fill="#e8eef9" text-anchor="middle">${t.nome}</text>
    `);
  });
  // lista lateral
  lista.innerHTML = trechos.map((t, i) =>
    `<div class="curva-row" data-i="${i}"><span><b>${t.ordem}</b> ${t.nome}</span></div>`
  ).join('');
}
render();

// drag
let arrastando = null;
function svgCoords(ev) {
  const r = svg.getBoundingClientRect();
  const sx = PARAMS.W / r.width;
  const sy = PARAMS.H / r.height;
  return { x: (ev.clientX - r.left) * sx, y: (ev.clientY - r.top) * sy };
}
svg.addEventListener('pointerdown', ev => {
  const tgt = ev.target;
  if (!tgt.classList.contains('handle')) return;
  arrastando = {
    i: +tgt.dataset.i, papel: tgt.dataset.papel, el: tgt,
  };
  tgt.setPointerCapture(ev.pointerId);
});
svg.addEventListener('pointermove', ev => {
  if (!arrastando) return;
  const {x, y} = svgCoords(ev);
  const ll = unproj(x, y);
  const t = trechos[arrastando.i];
  if (arrastando.papel === 'entrada-a') t.entrada.a = ll;
  else if (arrastando.papel === 'entrada-b') t.entrada.b = ll;
  else if (arrastando.papel === 'saida-a')   t.saida.a = ll;
  else if (arrastando.papel === 'saida-b')   t.saida.b = ll;
  else if (arrastando.papel === 'apice')     t.apice = ll;
  render();
});
svg.addEventListener('pointerup', () => arrastando = null);
svg.addEventListener('pointercancel', () => arrastando = null);

document.getElementById('btnSalvar').onclick = () => {
  const out = {
    salvo_em: new Date().toISOString(),
    origem: 'editor visual Flávio',
    trechos: trechos.map(t => ({
      id: t.id, ordem: t.ordem, nome: t.nome,
      entrada_line_gps: {
        a: { lat: +t.entrada.a.lat.toFixed(7), lng: +t.entrada.a.lng.toFixed(7) },
        b: { lat: +t.entrada.b.lat.toFixed(7), lng: +t.entrada.b.lng.toFixed(7) },
      },
      saida_line_gps: {
        a: { lat: +t.saida.a.lat.toFixed(7), lng: +t.saida.a.lng.toFixed(7) },
        b: { lat: +t.saida.b.lat.toFixed(7), lng: +t.saida.b.lng.toFixed(7) },
      },
      apice_gps: { lat: +t.apice.lat.toFixed(7), lng: +t.apice.lng.toFixed(7) },
    })),
  };
  const blob = new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'BARRAS-BRASILIA-FLAVIO-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  const toast = document.getElementById('toast');
  toast.textContent = 'Arquivo baixado: ' + a.download;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
};
document.getElementById('btnResetar').onclick = () => {
  trechos = JSON.parse(JSON.stringify(TRECHOS_INICIAIS));
  render();
};
</script>
</body></html>
