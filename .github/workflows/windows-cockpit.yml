name: windows-cockpit

# CI do port C# do cockpit Windows (WinUI 3 + .NET 8 — ADR-023 amendment 4).
# Por enquanto só roda o projeto Domain (puro .NET 8, multi-OS) — quando a
# camada XAML/WinUI 3 entrar (próxima fase), aí sim precisa runner
# windows-latest. Roda em ubuntu-latest pra economizar minutos.
#
# Trigger:
#   - PRs que tocam em windows/cockpit/** ou no próprio workflow (CI normal).
#   - Push pra main (necessário pro job t4000-capture-release publicar
#     rolling release pública com link estável).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'windows/cockpit/**'
      - '.github/workflows/windows-cockpit.yml'

concurrency:
  group: windows-cockpit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      domain: ${{ steps.filter.outputs.domain }}
      ui: ${{ steps.filter.outputs.ui }}
      capture: ${{ steps.filter.outputs.capture }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            domain:
              - 'windows/cockpit/P1Fast.Cockpit.Domain/**'
              - 'windows/cockpit/P1Fast.Cockpit.Domain.Tests/**'
              - 'windows/cockpit/P1Fast.Cockpit.sln'
              - '.github/workflows/windows-cockpit.yml'
            ui:
              - 'windows/cockpit/P1Fast.Cockpit.UI/**'
              - 'windows/cockpit/P1Fast.Cockpit.Domain/**'
              - '.github/workflows/windows-cockpit.yml'
            capture:
              - 'windows/cockpit/P1Fast.Cockpit.T4000Capture/**'
              - 'windows/cockpit/P1Fast.Cockpit.Domain/**'
              - '.github/workflows/windows-cockpit.yml'

  domain-test:
    needs: changes
    if: needs.changes.outputs.domain == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('windows/cockpit/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        working-directory: windows/cockpit
        run: dotnet restore P1Fast.Cockpit.sln

      - name: Build (Release, warnings as errors via csproj)
        working-directory: windows/cockpit
        run: dotnet build P1Fast.Cockpit.sln --configuration Release --no-restore

      - name: Test (xUnit)
        working-directory: windows/cockpit
        run: dotnet test P1Fast.Cockpit.sln --configuration Release --no-build --verbosity normal

  # ── UI build (WinUI 3 + .NET 8) ──
  # Camada XAML precisa de Windows pra restore/build (Windows App SDK + WinRT
  # projections). Roda em windows-latest mas só quando UI/Domain mudam.
  # Publish self-contained com artifact .exe está em iteração separada
  # (3 tentativas falharam nesta PR — ver PR #153 histórico). Por enquanto
  # esta job só valida que o XAML compila.
  ui-build:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('windows/cockpit/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore (UI)
        working-directory: windows/cockpit
        run: dotnet restore P1Fast.Cockpit.UI/P1Fast.Cockpit.UI.csproj /p:Platform=x64

      - name: Build (UI Release x64)
        working-directory: windows/cockpit
        run: dotnet build P1Fast.Cockpit.UI/P1Fast.Cockpit.UI.csproj --configuration Release --no-restore /p:Platform=x64

  # ── UI publish DIAGNOSTIC ──
  # Tentativa de publish .exe self-contained com captura agressiva de log.
  # Sai TUDO em arquivo + binlog do MSBuild + listing dos artefatos
  # gerados. Sobe como artifact mesmo quando falha (continue-on-error +
  # always upload), pra Flavio baixar e mandar pro Claude analisar.
  # Quando publish funcionar, troca por job real ui-publish.
  ui-publish-diagnostic:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Show env
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path logs | Out-Null
          dotnet --info | Out-File -FilePath logs/dotnet-info.txt -Encoding utf8
          dotnet workload list | Out-File -FilePath logs/dotnet-workload-list.txt -Encoding utf8
        env:
          DOTNET_NOLOGO: 'true'

      - name: Try publish (verbose, capture everything, never fail step)
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force -Path logs | Out-Null
          $env:DOTNET_CLI_TELEMETRY_OPTOUT = '1'
          dotnet publish windows/cockpit/P1Fast.Cockpit.UI/P1Fast.Cockpit.UI.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:Platform=x64 `
            -p:WindowsAppSDKSelfContained=true `
            -p:WindowsPackageType=None `
            -p:PublishReadyToRun=false `
            -p:EnableMsixTooling=false `
            -bl:logs/msbuild-publish.binlog `
            --verbosity diagnostic `
            -o dist/cockpit-ui *>&1 | Tee-Object -FilePath logs/publish-output.txt

      - name: List dist content (mesmo se vazio)
        shell: pwsh
        continue-on-error: true
        run: |
          if (Test-Path dist/cockpit-ui) {
            Get-ChildItem dist/cockpit-ui -Recurse | Select-Object FullName, Length |
              Out-File -FilePath logs/dist-listing.txt -Encoding utf8
          } else {
            "dist/cockpit-ui NAO FOI CRIADO" | Out-File -FilePath logs/dist-listing.txt -Encoding utf8
          }

      - name: Tail of publish output (preview no console do CI)
        shell: pwsh
        continue-on-error: true
        run: |
          if (Test-Path logs/publish-output.txt) {
            Get-Content logs/publish-output.txt -Tail 80
          }

      - name: Upload diagnostic logs (sempre, mesmo se publish falhou)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-publish-diagnostic-${{ github.sha }}
          path: |
            logs/
            dist/cockpit-ui/
          retention-days: 7
          if-no-files-found: warn

  # ── Capture tool publish ──
  # Empacota o p1fast-t4000-capture.exe (single-file, self-contained) e
  # sobe como artifact pra Flávio baixar e rodar no notebook. Usa
  # windows-latest porque precisa do runtime win-x64 + System.IO.Ports.
  # Só dispara quando o projeto da capture tool ou o Domain mudam.
  t4000-capture-publish:
    needs: changes
    if: needs.changes.outputs.capture == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('windows/cockpit/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Publish (single-file, win-x64, self-contained)
        shell: pwsh
        run: |
          dotnet publish windows/cockpit/P1Fast.Cockpit.T4000Capture/P1Fast.Cockpit.T4000Capture.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=embedded `
            --output dist/t4000-capture

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: p1fast-t4000-capture-${{ github.sha }}
          path: dist/t4000-capture/
          retention-days: 14

  # ── Capture tool rolling release ──
  # Quando merge em main, atualiza GitHub Release com tag rolante
  # "t4000-capture-latest" anexando o p1fast-t4000-capture.exe. Dá ao
  # Flávio um link público estável pra baixar no Edge do notebook sem
  # precisar fazer login no GitHub Actions:
  #
  #   https://github.com/Flaviomarques1969/p1-fast/releases/download/
  #     t4000-capture-latest/p1fast-t4000-capture.exe
  #
  # Roda só em push pra main (não em PR), só quando o código de captura
  # mudou. O .exe NÃO é assinado — Windows SmartScreen vai pedir
  # confirmação no primeiro uso.
  t4000-capture-release:
    needs: [changes, t4000-capture-publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.capture == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: p1fast-t4000-capture-${{ github.sha }}
          path: dist/t4000-capture

      - name: Update rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: t4000-capture-latest
          name: T4000 Capture — Latest build
          body: |
            Single-file Windows `.exe` pra capturar o stream raw da central
            Injepro T4000 via USB serial no notebook do carro.

            **Como usar:**
            1. Liga o carro com chave em ON (central T4000 alimentada).
            2. Pluga cabo USB da T4000 no notebook.
            3. Baixa e executa `p1fast-t4000-capture.exe`.
            4. Roda 5-10 min com motor em vários regimes.
            5. Aperta Q ou Esc pra parar.
            6. Os arquivos `.bin` + `.timing.csv` ficam no diretório atual.

            **Windows SmartScreen vai avisar** que o `.exe` não é
            reconhecido (não é assinado digitalmente). Clica em "Mais
            informações" → "Executar assim mesmo".

            Build automatizado de cada merge em `main` que toca o código
            de captura. Commit: `${{ github.sha }}`.
          files: dist/t4000-capture/p1fast-t4000-capture.exe
          make_latest: false
