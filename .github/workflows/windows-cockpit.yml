name: windows-cockpit

# CI do port C# do cockpit Windows (WinUI 3 + .NET 8 — ADR-023 amendment 4).
# Por enquanto só roda o projeto Domain (puro .NET 8, multi-OS) — quando a
# camada XAML/WinUI 3 entrar (próxima fase), aí sim precisa runner
# windows-latest. Roda em ubuntu-latest pra economizar minutos.
#
# Trigger: PRs que tocam em windows/cockpit/** ou no próprio workflow.

on:
  pull_request:
    branches: [main]

concurrency:
  group: windows-cockpit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      domain: ${{ steps.filter.outputs.domain }}
      ui: ${{ steps.filter.outputs.ui }}
      capture: ${{ steps.filter.outputs.capture }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            domain:
              - 'windows/cockpit/P1Fast.Cockpit.Domain/**'
              - 'windows/cockpit/P1Fast.Cockpit.Domain.Tests/**'
              - 'windows/cockpit/P1Fast.Cockpit.sln'
              - '.github/workflows/windows-cockpit.yml'
            ui:
              - 'windows/cockpit/P1Fast.Cockpit.UI/**'
              - 'windows/cockpit/P1Fast.Cockpit.Domain/**'
              - '.github/workflows/windows-cockpit.yml'
            capture:
              - 'windows/cockpit/P1Fast.Cockpit.T4000Capture/**'
              - 'windows/cockpit/P1Fast.Cockpit.Domain/**'
              - '.github/workflows/windows-cockpit.yml'

  domain-test:
    needs: changes
    if: needs.changes.outputs.domain == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('windows/cockpit/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        working-directory: windows/cockpit
        run: dotnet restore P1Fast.Cockpit.sln

      - name: Build (Release, warnings as errors via csproj)
        working-directory: windows/cockpit
        run: dotnet build P1Fast.Cockpit.sln --configuration Release --no-restore

      - name: Test (xUnit)
        working-directory: windows/cockpit
        run: dotnet test P1Fast.Cockpit.sln --configuration Release --no-build --verbosity normal

  # ── UI publish (WinUI 3 + .NET 8) ──
  # Empacota o cockpit (self-contained win-x64 + Windows App SDK self-contained)
  # e sobe como artifact pra Flávio baixar e rodar no notebook a cada iteração.
  # Validação de compilação acontece de graça dentro do próprio publish.
  # Single-file não é viável pra WinUI 3 (precisa dos nativos do App SDK
  # extraídos), então o artifact é uma pasta com o .exe + DLLs.
  ui-publish:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('windows/cockpit/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore (UI, win-x64)
        shell: pwsh
        run: |
          dotnet restore windows/cockpit/P1Fast.Cockpit.UI/P1Fast.Cockpit.UI.csproj `
            -r win-x64 `
            -p:Platform=x64

      - name: Publish (win-x64, self-contained, Windows App SDK bundled)
        shell: pwsh
        run: |
          dotnet publish windows/cockpit/P1Fast.Cockpit.UI/P1Fast.Cockpit.UI.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --no-restore `
            -p:Platform=x64 `
            -p:WindowsAppSDKSelfContained=true `
            -p:WindowsPackageType=None `
            -p:PublishReadyToRun=false `
            -p:EnableMsixTooling=false `
            -o dist/cockpit-ui

      - name: List published files (debug)
        shell: pwsh
        run: |
          if (Test-Path dist/cockpit-ui) {
            Get-ChildItem dist/cockpit-ui -Recurse | Select-Object FullName, Length | Format-Table -AutoSize | Out-String
            $exe = Get-ChildItem dist/cockpit-ui -Filter "P1Fast.Cockpit.UI.exe" -Recurse
            if (-not $exe) { Write-Error "exe nao foi gerado" }
          } else {
            Write-Error "diretorio dist/cockpit-ui nao existe"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: p1fast-cockpit-ui-${{ github.sha }}
          path: dist/cockpit-ui/
          retention-days: 14

  # ── Capture tool publish ──
  # Empacota o p1fast-t4000-capture.exe (single-file, self-contained) e
  # sobe como artifact pra Flávio baixar e rodar no notebook. Usa
  # windows-latest porque precisa do runtime win-x64 + System.IO.Ports.
  # Só dispara quando o projeto da capture tool ou o Domain mudam.
  t4000-capture-publish:
    needs: changes
    if: needs.changes.outputs.capture == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('windows/cockpit/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Publish (single-file, win-x64, self-contained)
        shell: pwsh
        run: |
          dotnet publish windows/cockpit/P1Fast.Cockpit.T4000Capture/P1Fast.Cockpit.T4000Capture.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=embedded `
            --output dist/t4000-capture

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: p1fast-t4000-capture-${{ github.sha }}
          path: dist/t4000-capture/
          retention-days: 14
