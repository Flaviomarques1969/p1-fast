name: windows-cockpit

# CI do port C# do cockpit Windows (WinUI 3 + .NET 8 — ADR-023 amendment 4).
# Por enquanto só roda o projeto Domain (puro .NET 8, multi-OS) — quando a
# camada XAML/WinUI 3 entrar (próxima fase), aí sim precisa runner
# windows-latest. Roda em ubuntu-latest pra economizar minutos.
#
# Trigger: PRs que tocam em windows/cockpit/** ou no próprio workflow.

on:
  pull_request:
    branches: [main]
  push:
    branches: [claude/t3000-t4000-live-stream-tdrk70]
  workflow_dispatch:

concurrency:
  group: windows-cockpit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      domain: ${{ steps.filter.outputs.domain }}
      ui: ${{ steps.filter.outputs.ui }}
      capture: ${{ steps.filter.outputs.capture }}
      livedemo: ${{ steps.filter.outputs.livedemo }}
      probe: ${{ steps.filter.outputs.probe }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            domain:
              - 'windows/cockpit/P1Fast.Cockpit.Domain/**'
              - 'windows/cockpit/P1Fast.Cockpit.Domain.Tests/**'
              - 'windows/cockpit/P1Fast.Cockpit.sln'
              - '.github/workflows/windows-cockpit.yml'
            ui:
              - 'windows/cockpit/P1Fast.Cockpit.UI/**'
              - 'windows/cockpit/P1Fast.Cockpit.Domain/**'
              - '.github/workflows/windows-cockpit.yml'
            capture:
              - 'windows/cockpit/P1Fast.Cockpit.T4000Capture/**'
              - 'windows/cockpit/P1Fast.Cockpit.Domain/**'
              - '.github/workflows/windows-cockpit.yml'
            livedemo:
              - 'windows/cockpit/P1Fast.Cockpit.T4000LiveDemo/**'
              - 'windows/cockpit/P1Fast.Cockpit.Domain/**'
              - '.github/workflows/windows-cockpit.yml'
            probe:
              - 'windows/cockpit/P1Fast.Cockpit.T4000UsbProbe/**'
              - 'windows/cockpit/P1Fast.Cockpit.Domain/**'
              - '.github/workflows/windows-cockpit.yml'

  domain-test:
    needs: changes
    if: needs.changes.outputs.domain == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('windows/cockpit/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        working-directory: windows/cockpit
        run: dotnet restore P1Fast.Cockpit.sln

      - name: Build (Release, warnings as errors via csproj)
        working-directory: windows/cockpit
        run: dotnet build P1Fast.Cockpit.sln --configuration Release --no-restore

      - name: Test (xUnit)
        working-directory: windows/cockpit
        run: dotnet test P1Fast.Cockpit.sln --configuration Release --no-build --verbosity normal

  # ── UI build (WinUI 3 + .NET 8) ──
  # Camada XAML precisa de Windows pra restore/build (Windows App SDK + WinRT
  # projections). Roda em windows-latest mas só quando UI/Domain mudam.
  # Publish self-contained com artifact .exe está em iteração separada
  # (3 tentativas falharam nesta PR — ver PR #153 histórico). Por enquanto
  # esta job só valida que o XAML compila.
  ui-build:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('windows/cockpit/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore (UI)
        working-directory: windows/cockpit
        run: dotnet restore P1Fast.Cockpit.UI/P1Fast.Cockpit.UI.csproj /p:Platform=x64

      - name: Build (UI Release x64)
        working-directory: windows/cockpit
        run: dotnet build P1Fast.Cockpit.UI/P1Fast.Cockpit.UI.csproj --configuration Release --no-restore /p:Platform=x64

  # ── UI publish DIAGNOSTIC ──
  # Tentativa de publish .exe self-contained com captura agressiva de log.
  # Sai TUDO em arquivo + binlog do MSBuild + listing dos artefatos
  # gerados. Sobe como artifact mesmo quando falha (continue-on-error +
  # always upload), pra Flavio baixar e mandar pro Claude analisar.
  # Quando publish funcionar, troca por job real ui-publish.
  ui-publish-diagnostic:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Show env
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path logs | Out-Null
          dotnet --info | Out-File -FilePath logs/dotnet-info.txt -Encoding utf8
          dotnet workload list | Out-File -FilePath logs/dotnet-workload-list.txt -Encoding utf8
        env:
          DOTNET_NOLOGO: 'true'

      - name: Try publish (verbose, capture everything, never fail step)
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force -Path logs | Out-Null
          $env:DOTNET_CLI_TELEMETRY_OPTOUT = '1'
          # 1) Restore SEPARADO (combinar com Publish pula a geracao do XAML .g.cs).
          msbuild windows/cockpit/P1Fast.Cockpit.UI/P1Fast.Cockpit.UI.csproj `
            /t:Restore `
            /p:Configuration=Release /p:Platform=x64 /p:RuntimeIdentifier=win-x64 `
            /v:minimal *>&1 | Tee-Object -FilePath logs/restore-output.txt
          # 2) Publish (o target Publish chama Build -> passes do XAML -> CoreCompile).
          msbuild windows/cockpit/P1Fast.Cockpit.UI/P1Fast.Cockpit.UI.csproj `
            /t:Publish `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:RuntimeIdentifier=win-x64 `
            /p:SelfContained=true `
            /p:WindowsAppSDKSelfContained=true `
            /p:WindowsPackageType=None `
            /p:PublishReadyToRun=false `
            /p:PublishDir=$env:GITHUB_WORKSPACE\dist\cockpit-ui\ `
            /bl:logs/msbuild-publish.binlog `
            /v:minimal *>&1 | Tee-Object -FilePath logs/publish-output.txt

      - name: List dist content (mesmo se vazio)
        shell: pwsh
        continue-on-error: true
        run: |
          if (Test-Path dist/cockpit-ui) {
            Get-ChildItem dist/cockpit-ui -Recurse | Select-Object FullName, Length |
              Out-File -FilePath logs/dist-listing.txt -Encoding utf8
          } else {
            "dist/cockpit-ui NAO FOI CRIADO" | Out-File -FilePath logs/dist-listing.txt -Encoding utf8
          }

      - name: Tail of publish output (preview no console do CI)
        shell: pwsh
        continue-on-error: true
        run: |
          if (Test-Path logs/publish-output.txt) {
            Get-Content logs/publish-output.txt -Tail 80
          }

      - name: Upload diagnostic logs (sempre, mesmo se publish falhou)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-publish-diagnostic-${{ github.sha }}
          path: |
            logs/
            dist/cockpit-ui/
          retention-days: 7
          if-no-files-found: warn

  # ── Capture tool publish ──
  # Empacota o p1fast-t4000-capture.exe (single-file, self-contained) e
  # sobe como artifact pra Flávio baixar e rodar no notebook. Usa
  # windows-latest porque precisa do runtime win-x64 + System.IO.Ports.
  # Só dispara quando o projeto da capture tool ou o Domain mudam.
  t4000-capture-publish:
    needs: changes
    if: needs.changes.outputs.capture == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('windows/cockpit/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Publish (single-file, win-x64, self-contained)
        shell: pwsh
        run: |
          dotnet publish windows/cockpit/P1Fast.Cockpit.T4000Capture/P1Fast.Cockpit.T4000Capture.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=embedded `
            --output dist/t4000-capture

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: p1fast-t4000-capture-${{ github.sha }}
          path: dist/t4000-capture/
          retention-days: 14

  # ── Live demo publish ──
  # Empacota o p1fast-t4000-live-demo.exe (single-file, self-contained):
  # programinha que roda no notebook, simula a Injepro T4000 cospindo dados
  # e mostra o painel reagindo em tempo real — sem precisar plugar no carro.
  # Mesmo padrão da capture tool (win-x64, self-contained, artifact 14d).
  t4000-live-demo-publish:
    needs: changes
    if: needs.changes.outputs.livedemo == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('windows/cockpit/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Publish (single-file, win-x64, self-contained)
        shell: pwsh
        run: |
          dotnet publish windows/cockpit/P1Fast.Cockpit.T4000LiveDemo/P1Fast.Cockpit.T4000LiveDemo.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=embedded `
            --output dist/t4000-live-demo

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: p1fast-t4000-live-demo-${{ github.sha }}
          path: dist/t4000-live-demo/
          retention-days: 14

  # ── USB probe publish ──
  # Empacota o p1fast-t4000-usb-probe.exe (single-file, self-contained):
  # sonda que lê a Injepro T3000/T4000 direto pela USB (WinUSB/libusb), faz o
  # handshake ACK/RI e decodifica o bloco de 460 bytes. Roda no notebook contra
  # a central viva pra provar a aquisição nativa antes de entrar no app WinUI.
  t4000-usb-probe-publish:
    needs: changes
    if: needs.changes.outputs.probe == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('windows/cockpit/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Publish (single-file, win-x64, self-contained)
        shell: pwsh
        run: |
          dotnet publish windows/cockpit/P1Fast.Cockpit.T4000UsbProbe/P1Fast.Cockpit.T4000UsbProbe.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=embedded `
            --output dist/t4000-usb-probe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: p1fast-t4000-usb-probe-${{ github.sha }}
          path: dist/t4000-usb-probe/
          retention-days: 14

  # ── Release pública (link direto pra baixar, sem login) ──
  # Junta os .exe gerados pelos jobs acima e publica/atualiza uma Release
  # com tag fixa "cockpit-latest". O Flávio baixa colando a URL no navegador,
  # sem precisar navegar pelos artifacts (que exigem login e nao tem link direto).
  publish-release:
    needs: [t4000-usb-probe-publish, t4000-capture-publish, t4000-live-demo-publish, ui-publish-diagnostic]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixa todos os artifacts deste run
        uses: actions/download-artifact@v4
        with:
          path: dl

      - name: Prepara os arquivos da release
        shell: bash
        run: |
          set -x
          mkdir -p out
          # .exe single-file (sonda + utilitarios)
          find dl -name 'p1fast-t4000-usb-probe.exe' -exec cp {} out/ \; || true
          find dl -name 'p1fast-t4000-capture.exe'   -exec cp {} out/ \; || true
          find dl -name 'p1fast-t4000-live-demo.exe'  -exec cp {} out/ \; || true
          # cockpit UI vem como pasta (exe + dlls) -> zipa
          cockpit_dir=$(find dl -type d -path '*/dist/cockpit-ui' | head -1)
          if [ -n "$cockpit_dir" ] && [ -n "$(ls -A "$cockpit_dir" 2>/dev/null)" ]; then
            (cd "$cockpit_dir" && zip -r "$GITHUB_WORKSPACE/out/cockpit-ui.zip" .)
          fi
          echo "=== conteudo da release ==="; ls -la out

      - name: Publica/atualiza a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cockpit-latest
          name: P1 Fast — cockpit (build mais recente)
          body: |
            Builds mais recentes do branch de desenvolvimento (atualiza a cada push).
            - **p1fast-t4000-usb-probe.exe** — lê a central T4000 ao vivo (RPM/água/λ).
            - **cockpit-ui.zip** — a tela do piloto (extrair e rodar P1Fast.Cockpit.UI.exe).
            - p1fast-t4000-capture.exe / p1fast-t4000-live-demo.exe — utilitários.
          prerelease: true
          files: out/*
