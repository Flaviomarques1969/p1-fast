# ═══════════════════════════════════════════════════════════
# p1fast-ios — Xcode project gerado por xcodegen
# ═══════════════════════════════════════════════════════════
# Não edite o .xcodeproj/ direto. Edite este arquivo e rode:
#   xcodegen --spec project.yml
# Detalhes em ../README.md.

name: p1fast-ios
options:
  bundleIdPrefix: com.flaviomarques
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: pt-BR
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: NO
    # Personal Team Flávio (K3MU9U9952) — assinatura automática pro device físico.
    # Antes era unsigned (only-simulator) — bloqueou install no iPhone real em
    # 2026-05-05. Mantém Apple Development cert (não distribution). Team ID
    # extraído do profile do imu-test (`~/Library/Developer/Xcode/UserData/
    # Provisioning Profiles/`); o Q7232XJKXY anterior era ID do certificate,
    # não do team — Xcode rejeitava com "No Account for Team Q7232XJKXY".
    DEVELOPMENT_TEAM: K3MU9U9952
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: Apple Development
    CODE_SIGNING_REQUIRED: YES
    CODE_SIGNING_ALLOWED: YES
    TARGETED_DEVICE_FAMILY: "1"

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

packages:
  P1FastCore:
    path: ../p1fast-core
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: 6.29.0
  Daily:
    url: https://github.com/daily-co/daily-client-ios.git
    from: 0.37.0
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: 2.0.0

targets:
  p1fast-ios:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          # Component docs/screenshots NÃO entram no app bundle.
          - "**/docs/**"
          - "**/README.md"
      # Assets.xcassets vai como folder.assetcatalog explícito —
      # `resources: - path: Resources` sozinho não pega o catalog
      # (xcodegen 2.45.4 só copia arquivos soltos quando `path:` é diretório).
      - path: Resources/Assets.xcassets
        type: folder.assetcatalog
        buildPhase: resources
    resources: []
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: P1 Fast
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: SplashBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        DAILY_API_KEY: $(DAILY_API_KEY)
        # MS-2.1 — permissões pra captura ao vivo (CoreMotion + GPS).
        NSLocationWhenInUseUsageDescription: P1 Fast usa GPS pra gravar a telemetria do stint enquanto você pilota.
        NSLocationAlwaysAndWhenInUseUsageDescription: Se a tela apagar ou outro app tomar foco durante o stint, P1 Fast continua gravando o GPS pra não perder voltas. O acelerômetro pausa em background — limitação do iOS — então mantenha a tela aberta sempre que possível.
        NSMotionUsageDescription: P1 Fast usa o acelerômetro do iPhone pra medir aceleração lateral, longitudinal e curvas durante o stint.
        # 2026-05-31 — câmera pra ler código de barras da caixa da peça + fotos no Estoque.
        NSCameraUsageDescription: P1 Fast usa a câmera pra ler o código de barras da caixa da peça e pra tirar fotos das peças no Estoque.
        # 2026-06-09 — chaves exigidas pelo SDK Daily.co (vídeo ao vivo). No
        # teste ao vivo o app só ASSISTE (não publica), mas o SDK pede as
        # descrições de uso de microfone e de rede local.
        NSMicrophoneUsageDescription: P1 Fast usa o microfone no vídeo ao vivo do espelhamento (no teste o app não publica áudio).
        NSLocalNetworkUsageDescription: P1 Fast usa a rede local pra transmitir o vídeo ao vivo entre o notebook e o iPhone com menor latência.
        # MS-2.2 — GPS continua em background. Wake lock
        # (isIdleTimerDisabled) é controlado em runtime pelo recorder.
        UIBackgroundModes:
          - location
    settings:
      base:
        PRODUCT_NAME: p1fast-ios
        PRODUCT_BUNDLE_IDENTIFIER: com.flaviomarques.p1fast
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    dependencies:
      - package: P1FastCore
        product: P1FastCore
      - package: GRDB
        product: GRDB
      - package: Daily
        product: Daily
      - package: Supabase
        product: Supabase

schemes:
  p1fast-ios:
    build:
      targets:
        p1fast-ios: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
