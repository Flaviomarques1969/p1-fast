<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pergunta — 20260518-010500-producao-manutencao</title>
<style>
  :root { --bg:#0f1115; --card:#171a21; --fg:#e8e8e8; --muted:#9aa0a6; --accent:#4f8cff; --ok:#22c55e; --warn:#f59e0b; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--fg); padding:24px; }
  .wrap { max-width: 720px; margin: 0 auto; }
  .card { background:var(--card); border-radius:12px; padding:24px; box-shadow: 0 8px 32px rgba(0,0,0,.35); }
  h1 { font-size: 1.25rem; margin: 0 0 4px; }
  .meta { color: var(--muted); font-size: .85rem; margin-bottom: 16px; }
  .pergunta { font-size: 1.05rem; line-height: 1.45; margin: 0 0 20px; }
  .opcoes { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
  .opcao { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border: 1px solid #2a2f3a; border-radius: 10px; cursor: pointer; transition: all .15s; }
  .opcao:hover { border-color: var(--accent); }
  .opcao input { margin-top: 4px; }
  .opcao-corpo { flex: 1; }
  .opcao-titulo { font-weight: 600; }
  .opcao-just { color: var(--muted); font-size: .9rem; margin-top: 2px; }
  .recomendado { display: inline-block; background: rgba(34,197,94,.15); color: var(--ok); padding: 1px 8px; border-radius: 999px; font-size: .75rem; margin-left: 8px; }
  textarea { width: 100%; background:#0f1115; color:var(--fg); border:1px solid #2a2f3a; border-radius: 8px; padding: 10px; resize: vertical; font-family: inherit; font-size: .95rem; }
  label.bloco { display: block; margin: 16px 0 6px; color: var(--muted); font-size: .85rem; }
  .acoes { display: flex; gap: 10px; margin-top: 18px; }
  button { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 10px 16px; font-size: 1rem; cursor: pointer; }
  button.secundario { background: transparent; border: 1px solid #2a2f3a; color: var(--fg); }
  .status { margin-top: 12px; color: var(--muted); font-size: .85rem; }
  .outra-wrap { display: none; }
  .outra-wrap.ativo { display: block; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Decisão</h1>
    <div class="meta">ID: <code>20260518-010500-producao-manutencao</code></div>
    <p class="pergunta">Você disse "pode colocar em produção". A regra dura do protocolo exige a frase exata <code>MIGRAR PARA PRODUÇÃO: [função]</code> antes de eu tocar no servidor oficial. Qual escopo você está autorizando?</p>

    <form id="form">
      <div class="opcoes">
        <label class="opcao">
          <input type="radio" name="opcao" value="A — só preparar o terreno: criar as 3 tabelas vazias no servidor oficial, sem sincronização ainda">
          <div class="opcao-corpo">
            <div class="opcao-titulo">A — Só preparar o terreno (recomendado pra agora) <span class="recomendado">Recomendado</span></div>
            <div class="opcao-just">Crio as 3 tabelas vazias (manutencoes · manutencao_especificacoes · manutencao_periodicidades) no servidor oficial Supabase, com as regras de acesso por equipe. NÃO sincroniza dados ainda — o iPhone continua usando o banco local. Risco: zero. Tempo: ~30 min. Bom porque deixa o servidor pronto pra quando a sincronização entrar, sem você ter visto a função no aparelho ainda.</div>
          </div>
        </label>

        <label class="opcao">
          <input type="radio" name="opcao" value="B — terreno + sincronização da Manutenção (só a Manutenção, sem mexer no Estoque)">
          <div class="opcao-corpo">
            <div class="opcao-titulo">B — Preparar o terreno + ligar a sincronização (só Manutenção)</div>
            <div class="opcao-just">Tudo da opção A, mais o código que envia cada registro de troca do iPhone pro servidor automaticamente (mesma mecânica usada por carros, eventos, voltas). Estoque continua só local. Risco: médio — precisa escrever sincronização nova + testar no iPhone. Tempo: ~3-4 horas. Bom se você quer Manutenção 100% em produção hoje, mesmo sem Estoque ainda.</div>
          </div>
        </label>

        <label class="opcao">
          <input type="radio" name="opcao" value="C — terreno + sincronização de Manutenção E Estoque (subir os dois juntos)">
          <div class="opcao-corpo">
            <div class="opcao-titulo">C — Manutenção + Estoque juntos em produção</div>
            <div class="opcao-just">Como B, mas inclui o Estoque (que está local desde ontem). Faz sentido subir os dois juntos pra não ficar pela metade. Risco: médio. Tempo: ~5-6 horas. Bom se você quer fechar o ciclo das duas funções entregues nas últimas 24h.</div>
          </div>
        </label>

        <label class="opcao">
          <input type="radio" name="opcao" value="Outra">
          <div class="opcao-corpo">
            <div class="opcao-titulo">Outra</div>
            <div class="opcao-just">Descreva sua opção no campo abaixo. Ex.: "espera eu ver a Manutenção rodando no iPhone antes" / "subir tudo: S1-S8 + Estoque + Manutenção" / "só atualizar o documento STATUS.md primeiro" / etc.</div>
          </div>
        </label>
      </div>

      <div class="outra-wrap" id="outra-wrap">
        <label class="bloco" for="outra-texto">Sua opção</label>
        <textarea id="outra-texto" rows="2" placeholder="Descreva a sua opção"></textarea>
      </div>

      <label class="bloco" for="comentario">Comentário (opcional)</label>
      <textarea id="comentario" rows="3" placeholder="Contexto, ressalvas, prazos..."></textarea>

      <div class="acoes">
        <button type="button" id="exportar">Exportar JSON</button>
        <button type="button" class="secundario" id="limpar">Limpar</button>
      </div>
      <div class="status" id="status"></div>
    </form>
  </div>
</div>

<script>
  const PERGUNTA_ID = "20260518-010500-producao-manutencao";
  const STORAGE_KEY = "padrao-flavio:" + PERGUNTA_ID;

  function carregarLocalStorage() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      const dados = JSON.parse(raw);
      if (dados.escolha) {
        const radio = document.querySelector('input[name="opcao"][value="' + CSS.escape(dados.escolha) + '"]');
        if (radio) radio.checked = true;
      }
      if (dados.outra_texto) {
        document.getElementById("outra-texto").value = dados.outra_texto;
      }
      if (dados.comentario) {
        document.getElementById("comentario").value = dados.comentario;
      }
      atualizarOutraWrap();
    } catch (e) { /* noop */ }
  }

  function salvarLocalStorage() {
    const escolhaEl = document.querySelector('input[name="opcao"]:checked');
    const dados = {
      escolha: escolhaEl ? escolhaEl.value : "",
      outra_texto: document.getElementById("outra-texto").value,
      comentario: document.getElementById("comentario").value,
    };
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(dados)); } catch (e) { /* noop */ }
  }

  function atualizarOutraWrap() {
    const escolhaEl = document.querySelector('input[name="opcao"]:checked');
    const ativo = escolhaEl && escolhaEl.value === "Outra";
    document.getElementById("outra-wrap").classList.toggle("ativo", ativo);
  }

  function montarPayload() {
    const escolhaEl = document.querySelector('input[name="opcao"]:checked');
    const escolha = escolhaEl ? escolhaEl.value : "";
    const outraOpcaoUsada = escolha === "Outra";
    const outraTexto = document.getElementById("outra-texto").value.trim();
    const comentario = document.getElementById("comentario").value.trim();
    return {
      pergunta_id: PERGUNTA_ID,
      pergunta: document.querySelector(".pergunta").innerText.trim(),
      escolha: outraOpcaoUsada ? (outraTexto || "Outra") : escolha,
      outra_opcao_usada: outraOpcaoUsada,
      comentario: comentario,
      respondido_em: new Date().toISOString(),
    };
  }

  function exportar() {
    const payload = montarPayload();
    if (!payload.escolha) {
      document.getElementById("status").textContent = "Escolha uma opção antes de exportar.";
      return;
    }
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = PERGUNTA_ID + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    document.getElementById("status").textContent = "JSON exportado: " + PERGUNTA_ID + ".json — coloque em ./.claude-perguntas/respostas/ e diga 'fiz'.";
  }

  function limpar() {
    document.querySelectorAll('input[name="opcao"]').forEach(r => r.checked = false);
    document.getElementById("outra-texto").value = "";
    document.getElementById("comentario").value = "";
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    atualizarOutraWrap();
    document.getElementById("status").textContent = "Limpo.";
  }

  document.addEventListener("DOMContentLoaded", () => {
    carregarLocalStorage();
    document.querySelectorAll('input[name="opcao"]').forEach(r => {
      r.addEventListener("change", () => { salvarLocalStorage(); atualizarOutraWrap(); });
    });
    document.getElementById("outra-texto").addEventListener("input", salvarLocalStorage);
    document.getElementById("comentario").addEventListener("input", salvarLocalStorage);
    document.getElementById("exportar").addEventListener("click", exportar);
    document.getElementById("limpar").addEventListener("click", limpar);
  });
</script>
</body>
</html>
