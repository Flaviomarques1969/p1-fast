<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=430,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Mockup Eventos — P1 Fast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg: oklch(20% 0.005 240);
  --surface: oklch(24% 0.005 240);
  --surface-2: oklch(28% 0.005 240);
  --hairline: oklch(33% 0.005 240);
  --text: oklch(95% 0.003 240);
  --text-2: oklch(75% 0.01 240);
  --text-3: oklch(58% 0.012 240);
  --accent: oklch(78% 0.13 235);
  --accent-2: oklch(82% 0.10 235 / .15);
  --bom: oklch(78% 0.16 150);
  --atencao: oklch(82% 0.16 80);
  --ouro: oklch(74% 0.16 73);
  --radius: 12px;
  --radius-sm: 10px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{
  min-height:100dvh;width:100vw;
  background:linear-gradient(160deg, oklch(22% 0.005 240) 0%, oklch(18% 0.005 240) 100%);
  color:var(--text);
  font-family:'Inter',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  font-weight:400;
}
body{padding:0 0 96px;}

.app{
  max-width:430px;margin:0 auto;
  padding:16px 20px 0;
}

.context-head{padding:14px 4px 16px;}
.context-head__eyebrow{
  display:inline-flex;align-items:center;gap:7px;
  padding:5px 12px;
  background:var(--accent-2);
  border:1px solid oklch(78% 0.13 235 / .35);
  border-radius:999px;
  font-size:10px;font-weight:600;
  letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent);
  margin-bottom:12px;
}
.context-head__eyebrow__dot{
  width:5px;height:5px;border-radius:50%;
  background:currentColor;
}
.context-head__title{
  font-size:24px;font-weight:600;
  letter-spacing:-.025em;line-height:1.15;
  color:var(--text);
  margin-bottom:4px;
}
.context-head__when{
  font-size:13px;color:var(--text-2);
}
.context-head__when strong{color:var(--accent);font-weight:600;}

/* GROUP */
.group__head{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 4px 10px;
  font-size:11px;font-weight:600;
  letter-spacing:.12em;color:var(--text-3);
  text-transform:uppercase;
}
.group__head:first-child{padding-top:6px;}
.group__head strong{color:var(--accent);font-weight:600;}

/* EVENT CARD */
.event{
  display:flex;align-items:flex-start;gap:14px;
  padding:14px 16px;
  background:var(--surface);
  border:1px solid var(--hairline);
  border-radius:var(--radius);
  margin-bottom:8px;
  cursor:pointer;text-align:left;
  font-family:inherit;color:inherit;width:100%;
  transition:transform .18s cubic-bezier(.34,1.56,.64,1), background .18s, border-color .18s;
}
.event:hover{background:var(--surface-2);}
.event:active{transform:scale(.99);}
.event--proximo{
  border-color:oklch(78% 0.13 235 / .55);
  background:var(--accent-2);
}

/* DATA BLOCK */
.event__date{
  flex:0 0 auto;
  width:52px;height:52px;
  border-radius:10px;
  background:var(--surface-2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:1px solid var(--hairline);
}
.event__day{
  font-size:20px;font-weight:600;color:var(--text);
  font-variant-numeric:tabular-nums;
  line-height:1;letter-spacing:-.02em;
}
.event__mon{
  font-size:10px;font-weight:600;color:var(--text-3);
  letter-spacing:.08em;text-transform:uppercase;
  margin-top:3px;
}
.event--proximo .event__date{
  background:oklch(78% 0.13 235 / .18);
  border-color:oklch(78% 0.13 235 / .45);
}
.event--proximo .event__day{color:var(--accent);}

.event__body{flex:1 1 auto;min-width:0;}
.event__name{
  display:block;
  font-size:16px;font-weight:600;
  letter-spacing:-.005em;color:var(--text);
  line-height:1.2;
}
.event__sub{
  display:block;
  font-size:12px;color:var(--text-3);font-weight:400;
  margin-top:3px;
}
.event__meta{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  margin-top:10px;
}

.tag{
  display:inline-flex;align-items:center;
  padding:3px 8px;border-radius:999px;
  font-size:10px;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;
  color:var(--text-3);
  border:1px solid var(--hairline);
  background:transparent;
  font-variant-numeric:tabular-nums;
}
.tag--proximo{
  color:var(--accent);
  border-color:oklch(78% 0.13 235 / .45);
  background:oklch(78% 0.13 235 / .10);
}
.tag--bom{
  color:var(--bom);
  border-color:oklch(78% 0.16 150 / .45);
  background:oklch(78% 0.16 150 / .12);
}
.tag--tipo{
  color:var(--accent);
  border-color:oklch(78% 0.13 235 / .45);
  background:oklch(78% 0.13 235 / .10);
  letter-spacing:.04em;
}
.tag--ouro{
  color:var(--ouro);
  border-color:oklch(74% 0.16 73 / .45);
  background:oklch(74% 0.16 73 / .12);
}

/* TOP TEMPOS DO TIPO (ranking dourado no topo) */
.top-tipo{
  background:linear-gradient(155deg, oklch(74% 0.16 73 / .14), oklch(74% 0.16 73 / .04));
  border:1px solid oklch(74% 0.16 73 / .35);
  border-radius:var(--radius);
  padding:14px 16px 12px;
  margin-bottom:12px;
}
.top-tipo__head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:10px;
}
.top-tipo__label{
  font-size:10px;font-weight:600;
  letter-spacing:.12em;text-transform:uppercase;
  color:var(--ouro);
  display:inline-flex;align-items:center;gap:7px;
}
.top-tipo__label__dot{width:5px;height:5px;border-radius:50%;background:currentColor;}
.top-tipo__name{
  font-size:13px;font-weight:600;color:var(--text);
  letter-spacing:-.005em;
}
.top-tipo__rows{
  display:flex;flex-direction:column;gap:6px;
}
.top-tipo__row{
  display:grid;grid-template-columns:18px 1fr auto;
  align-items:center;gap:10px;
  font-size:13px;
  font-variant-numeric:tabular-nums;
}
.top-tipo__pos{
  font-size:11px;font-weight:600;
  color:var(--ouro);
  text-align:center;
}
.top-tipo__who{
  color:var(--text-2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.top-tipo__who strong{
  color:var(--text);font-weight:600;
}
.top-tipo__time{
  color:var(--text);font-weight:600;
  letter-spacing:-.01em;
}
.top-tipo__row[data-self="true"] .top-tipo__who strong{color:var(--accent);}

.event__chev{
  flex:0 0 auto;
  width:24px;height:24px;border-radius:8px;
  background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;
  color:var(--text-2);font-size:14px;
  margin-top:14px;
}

/* FAB */
.fab{
  position:fixed;bottom:88px;right:24px;z-index:30;
  background:var(--accent);color:oklch(12% 0.005 240);
  padding:12px 18px;
  border:0;border-radius:999px;
  font-family:inherit;font-size:15px;font-weight:600;
  letter-spacing:-.005em;cursor:pointer;
  box-shadow:0 10px 28px oklch(78% 0.13 235 / .25);
  display:inline-flex;align-items:center;gap:8px;
  transition:transform .18s cubic-bezier(.34,1.56,.64,1), background .18s;
}
.fab:hover{background:oklch(82% 0.14 235);}
.fab:active{transform:scale(.96);}
.fab__plus{font-size:20px;line-height:1;}

/* BOTTOM NAV */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:40;
  background:oklch(18% 0.005 240 / .92);
  -webkit-backdrop-filter:blur(20px) saturate(140%);
  backdrop-filter:blur(20px) saturate(140%);
  border-top:1px solid var(--hairline);
  padding:10px 0 22px;
  display:grid;grid-template-columns:repeat(4,1fr);
}
.bottom-nav__item{
  background:transparent;border:0;padding:8px 6px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:5px;
  font-family:inherit;font-size:10px;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;
  color:var(--text-3);
  transition:color .18s;
}
.bottom-nav__item[data-on="true"]{color:var(--accent);}
.bottom-nav__dot{
  width:5px;height:5px;border-radius:50%;
  background:transparent;transition:background .18s;
}
.bottom-nav__item[data-on="true"] .bottom-nav__dot{
  background:var(--accent);
}
</style>
</head>
<body>
<div class="app">

  <header class="context-head">
    <span class="context-head__eyebrow"><span class="context-head__eyebrow__dot"></span>Eventos</span>
    <h1 class="context-head__title">3 eventos</h1>
    <p class="context-head__when">Próximo: <strong>Brasília · 02/05</strong></p>
  </header>

  <div class="top-tipo" aria-label="Top tempos do tipo Track Day Planal">
    <div class="top-tipo__head">
      <span class="top-tipo__label"><span class="top-tipo__label__dot"></span>Top tempos · tipo</span>
      <span class="top-tipo__name">Track Day Planal</span>
    </div>
    <div class="top-tipo__rows">
      <div class="top-tipo__row" data-self="true">
        <span class="top-tipo__pos">1º</span>
        <span class="top-tipo__who"><strong>Flavio Marx</strong> · 25/04</span>
        <span class="top-tipo__time">1:42.318</span>
      </div>
      <div class="top-tipo__row">
        <span class="top-tipo__pos">2º</span>
        <span class="top-tipo__who">Flavio Marx · 28/03</span>
        <span class="top-tipo__time">1:43.847</span>
      </div>
      <div class="top-tipo__row">
        <span class="top-tipo__pos">3º</span>
        <span class="top-tipo__who">Bruno Marx · 25/04</span>
        <span class="top-tipo__time">1:43.521</span>
      </div>
    </div>
  </div>

  <div class="group__head">
    <span>Próximo</span>
    <strong>1</strong>
  </div>

  <button class="event event--proximo" type="button">
    <div class="event__date">
      <span class="event__day">02</span>
      <span class="event__mon">Mai</span>
    </div>
    <div class="event__body">
      <span class="event__name">Brasília</span>
      <span class="event__sub">Sábado · Nelson Piquet</span>
      <div class="event__meta">
        <span class="tag tag--tipo">Track Day Planal</span>
        <span class="tag tag--proximo">Falta 1 dia</span>
        <span class="tag">64% pronto</span>
      </div>
    </div>
    <span class="event__chev">›</span>
  </button>

  <div class="group__head">
    <span>Passados</span>
    <strong>2</strong>
  </div>

  <button class="event" type="button">
    <div class="event__date">
      <span class="event__day">25</span>
      <span class="event__mon">Abr</span>
    </div>
    <div class="event__body">
      <span class="event__name">Brasília</span>
      <span class="event__sub">Nelson Piquet</span>
      <div class="event__meta">
        <span class="tag tag--tipo">Track Day Planal</span>
        <span class="tag">4 stints</span>
        <span class="tag">47 voltas</span>
        <span class="tag tag--ouro">1:42.318 · PB tipo</span>
      </div>
    </div>
    <span class="event__chev">›</span>
  </button>

  <button class="event" type="button">
    <div class="event__date">
      <span class="event__day">28</span>
      <span class="event__mon">Mar</span>
    </div>
    <div class="event__body">
      <span class="event__name">Brasília</span>
      <span class="event__sub">Nelson Piquet</span>
      <div class="event__meta">
        <span class="tag tag--tipo">Track Day Planal</span>
        <span class="tag">3 stints</span>
        <span class="tag">32 voltas</span>
        <span class="tag tag--bom">1:43.847</span>
      </div>
    </div>
    <span class="event__chev">›</span>
  </button>

</div>

<button class="fab" type="button"><span class="fab__plus">+</span>Novo evento</button>

<nav class="bottom-nav">
  <button class="bottom-nav__item" type="button"><span class="bottom-nav__dot"></span>Home</button>
  <button class="bottom-nav__item" type="button" data-on="true"><span class="bottom-nav__dot"></span>Eventos</button>
  <button class="bottom-nav__item" type="button"><span class="bottom-nav__dot"></span>Pendências</button>
  <button class="bottom-nav__item" type="button"><span class="bottom-nav__dot"></span>Garagem</button>
</nav>
</body>
</html>
