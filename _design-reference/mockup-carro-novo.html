<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=430,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Mockup — Novo carro — P1 Fast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg: oklch(20% 0.005 240);
  --surface: oklch(24% 0.005 240);
  --surface-2: oklch(28% 0.005 240);
  --hairline: oklch(33% 0.005 240);
  --text: oklch(95% 0.003 240);
  --text-2: oklch(75% 0.01 240);
  --text-3: oklch(58% 0.012 240);
  --accent: oklch(78% 0.13 235);
  --accent-2: oklch(82% 0.10 235 / .15);
  --radius: 12px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{
  min-height:100dvh;width:100vw;
  background:linear-gradient(160deg, oklch(22% 0.005 240) 0%, oklch(18% 0.005 240) 100%);
  color:var(--text);font-family:'Inter',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;font-weight:400;
}
body{padding:0 0 110px;}
.app{max-width:430px;margin:0 auto;padding:16px 20px 0;}

.context-head{padding:14px 4px 16px;}
.context-head__eyebrow{
  display:inline-flex;align-items:center;gap:7px;
  padding:5px 12px;background:var(--accent-2);
  border:1px solid oklch(78% 0.13 235 / .35);border-radius:999px;
  font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent);margin-bottom:12px;
}
.context-head__eyebrow__dot{width:5px;height:5px;border-radius:50%;background:currentColor;}
.context-head__title{font-size:24px;font-weight:600;letter-spacing:-.025em;line-height:1.15;color:var(--text);margin-bottom:4px;}
.context-head__sub{font-size:13px;color:var(--text-2);}

.field{margin-bottom:16px;}
.field__lbl{
  font-size:13px;font-weight:500;color:var(--text-2);
  margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;
  letter-spacing:.005em;
}
.field__lbl small{color:var(--text-3);font-weight:400;font-size:12px;}

.input{
  width:100%;background:var(--surface);border:1px solid var(--hairline);
  color:var(--text);font-family:inherit;
  font-size:16px;font-weight:500;letter-spacing:-.005em;
  padding:13px 14px;border-radius:var(--radius);
  outline:none;transition:border-color .18s, box-shadow .18s, background .18s;
}
.input:focus, .input.is-focus{
  border-color:var(--accent);background:oklch(26% 0.01 235);
  box-shadow:0 0 0 4px oklch(78% 0.13 235 / .14);
}

.picker{
  width:100%;background:var(--surface);border:1px solid var(--hairline);
  padding:13px 14px;border-radius:var(--radius);
  display:flex;align-items:center;justify-content:space-between;cursor:pointer;
  transition:border-color .18s, background .18s;
  font-family:inherit;color:inherit;text-align:left;
}
.picker:hover{background:var(--surface-2);}
.picker__val{font-size:16px;font-weight:500;letter-spacing:-.005em;color:var(--text-3);}
.picker__chev{
  width:20px;height:20px;border-radius:6px;background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;color:var(--text-2);font-size:12px;
}

.swatch-rail{display:flex;gap:10px;}
.swatch{
  flex:0 0 auto;width:38px;height:38px;border-radius:50%;
  border:2px solid var(--hairline);background:transparent;
  cursor:pointer;position:relative;
  transition:transform .18s cubic-bezier(.34,1.56,.64,1), border-color .18s, box-shadow .18s;
}
.swatch:active{transform:scale(.92);}
.swatch__dot{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:24px;height:24px;border-radius:50%;
  transition:width .18s, height .18s;
}
.swatch[data-on="true"]{
  border-color:var(--accent);
  box-shadow:0 0 0 3px oklch(78% 0.13 235 / .18);
}
.swatch[data-on="true"] .swatch__dot{width:30px;height:30px;}

.helper-note{
  margin-top:8px;
  padding:14px 16px;background:var(--surface);
  border:1px dashed var(--hairline);border-radius:var(--radius);
  font-size:13px;color:var(--text-2);line-height:1.45;
}
.helper-note strong{color:var(--text);font-weight:600;}

.foot{
  position:fixed;bottom:0;left:0;right:0;z-index:40;
  background:oklch(18% 0.005 240 / .92);
  -webkit-backdrop-filter:blur(20px) saturate(140%);
  backdrop-filter:blur(20px) saturate(140%);
  border-top:1px solid var(--hairline);padding:14px 20px 28px;
}
.foot__inner{max-width:430px;margin:0 auto;display:grid;grid-template-columns:auto 1fr;gap:10px;}
.btn{
  padding:14px 18px;border-radius:var(--radius);cursor:pointer;
  font-family:inherit;font-size:15px;font-weight:600;letter-spacing:-.005em;
  outline:none;border:1px solid transparent;
  transition:transform .18s cubic-bezier(.34,1.56,.64,1), background .18s, color .18s;
}
.btn:active{transform:scale(.97);}
.btn--ghost{background:transparent;color:var(--text-2);border-color:var(--hairline);}
.btn--ghost:hover{background:var(--surface);color:var(--text);}
.btn--primary{background:var(--accent);color:oklch(12% 0.005 240);border-color:var(--accent);}
.btn--primary:hover{background:oklch(82% 0.14 235);}

/* ─── Aba Dinamômetro (Bloco 6 do Smart Shift Light) ─── */
.tab-bar{
  display:grid;grid-template-columns:1fr 1fr;gap:6px;
  padding:4px;background:var(--surface);border:1px solid var(--hairline);
  border-radius:var(--radius);margin-bottom:18px;
}
.tab-bar__btn{
  text-align:center;padding:10px 12px;border-radius:8px;
  font-size:13px;font-weight:600;letter-spacing:-.005em;color:var(--text-2);
  cursor:pointer;transition:background .18s,color .18s;
}
.tab-input{position:absolute;left:-9999px;}
.tab-input:checked + .tab-bar__btn{background:var(--accent);color:oklch(12% 0.005 240);}
.tab-content{display:none;}
.tab-content.is-active{display:block;}

.dyno-load{
  display:grid;grid-template-columns:1fr auto;gap:10px;
  margin-bottom:14px;align-items:center;
}
.dyno-load__btn{
  padding:13px 16px;background:var(--accent-2);
  border:1px solid oklch(78% 0.13 235 / .35);border-radius:var(--radius);
  color:var(--accent);font-weight:600;font-size:13px;letter-spacing:.02em;
  cursor:pointer;font-family:inherit;
}
.dyno-load__hint{font-size:12px;color:var(--text-3);}

.dyno-preview{
  width:100%;height:160px;background:var(--surface);
  border:1px solid var(--hairline);border-radius:var(--radius);
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;margin-bottom:14px;
}
.dyno-preview svg{width:100%;height:100%;}
.dyno-preview__legend{
  position:absolute;top:8px;left:10px;
  font-size:10px;font-weight:600;letter-spacing:.08em;color:var(--text-3);text-transform:uppercase;
}

.dyno-points{display:flex;flex-direction:column;gap:6px;margin-bottom:6px;}
.dyno-points__head{
  display:grid;grid-template-columns:1fr 1fr 1fr 28px;gap:8px;
  font-size:10px;font-weight:600;letter-spacing:.08em;color:var(--text-3);text-transform:uppercase;
  padding:0 4px;
}
.dyno-point{
  display:grid;grid-template-columns:1fr 1fr 1fr 28px;gap:8px;align-items:center;
}
.dyno-point .input{padding:10px 10px;font-size:14px;}
.dyno-point__remove{
  background:none;border:1px solid var(--hairline);color:var(--text-3);
  border-radius:8px;padding:7px 0;cursor:pointer;font-family:inherit;font-size:14px;
}

.dyno-add{
  background:var(--surface);border:1px dashed var(--hairline);border-radius:var(--radius);
  color:var(--text-2);padding:10px;width:100%;cursor:pointer;font-family:inherit;font-size:13px;
  margin-bottom:14px;
}

.dyno-summary{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;
}
</style>
</head>
<body>
<div class="app">
  <header class="context-head">
    <span class="context-head__eyebrow"><span class="context-head__eyebrow__dot"></span>Novo carro</span>
    <h1 class="context-head__title">Cadastrar carro</h1>
    <p class="context-head__sub">Setup base e pneus você cadastra depois.</p>
  </header>

  <div class="field">
    <div class="field__lbl">Apelido</div>
    <input class="input is-focus" placeholder="Ex: Celta 1.4">
  </div>

  <div class="field">
    <div class="field__lbl">Modelo <small>opcional</small></div>
    <input class="input" placeholder="Marca + ano (ex: Chevrolet Celta 1.4 2010)">
  </div>

  <div class="field">
    <div class="field__lbl">Categoria</div>
    <button class="picker" type="button">
      <span class="picker__val">Escolher categoria</span>
      <span class="picker__chev">›</span>
    </button>
  </div>

  <div class="field">
    <div class="field__lbl">Cor</div>
    <div class="swatch-rail">
      <button class="swatch" type="button" aria-label="Vermelho">
        <span class="swatch__dot" style="background:#e8001c"></span>
      </button>
      <button class="swatch" data-on="true" type="button" aria-label="Amarelo">
        <span class="swatch__dot" style="background:#f5c400"></span>
      </button>
      <button class="swatch" type="button" aria-label="Azul">
        <span class="swatch__dot" style="background:#0099ff"></span>
      </button>
      <button class="swatch" type="button" aria-label="Roxo">
        <span class="swatch__dot" style="background:#a855f7"></span>
      </button>
    </div>
  </div>

  <div class="helper-note">
    Depois de salvar, você abre o carro e cadastra
    <strong>setup base</strong> (calibragem, alinhamento, suspensão, freios, motor)
    e <strong>pneus</strong> que esse carro usa.
  </div>
</div>

<div class="foot">
  <div class="foot__inner">
    <button class="btn btn--ghost" type="button">Cancelar</button>
    <button class="btn btn--primary" type="button">Salvar carro</button>
  </div>
</div>
</body>
</html>
