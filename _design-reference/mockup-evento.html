<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=430,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Mockup Evento — criar — P1 Fast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* tokens 1:1 com mockup-eventos-lista.html · padrão B */
:root{
  --bg: oklch(20% 0.005 240);
  --surface: oklch(24% 0.005 240);
  --surface-2: oklch(28% 0.005 240);
  --hairline: oklch(33% 0.005 240);
  --text: oklch(95% 0.003 240);
  --text-2: oklch(75% 0.01 240);
  --text-3: oklch(58% 0.012 240);
  --accent: oklch(78% 0.13 235);
  --accent-2: oklch(82% 0.10 235 / .15);
  --radius: 12px;
  --radius-sm: 10px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{
  min-height:100dvh;width:100vw;
  background:linear-gradient(160deg, oklch(22% 0.005 240) 0%, oklch(18% 0.005 240) 100%);
  color:var(--text);
  font-family:'Inter',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  font-weight:400;
}
body{padding:0 0 110px;}

.app{
  max-width:430px;margin:0 auto;
  padding:16px 20px 0;
}

/* CONTEXT HEAD — 1:1 com mockup-eventos-lista.html */
.context-head{padding:14px 4px 16px;}
.context-head__eyebrow{
  display:inline-flex;align-items:center;gap:7px;
  padding:5px 12px;
  background:var(--accent-2);
  border:1px solid oklch(78% 0.13 235 / .35);
  border-radius:999px;
  font-size:10px;font-weight:600;
  letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent);
  margin-bottom:12px;
}
.context-head__eyebrow__dot{
  width:5px;height:5px;border-radius:50%;
  background:currentColor;
}
.context-head__title{
  font-size:24px;font-weight:600;
  letter-spacing:-.025em;line-height:1.15;
  color:var(--text);
  margin-bottom:4px;
}
.context-head__sub{
  font-size:13px;color:var(--text-2);
}

/* SECTION */
.section{margin-bottom:18px;}

/* FIELD */
.field{margin-bottom:16px;}
.field:last-child{margin-bottom:0;}
.field__lbl{
  font-size:13px;font-weight:500;color:var(--text-2);
  margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;
  letter-spacing:.005em;
}
.field__lbl small{color:var(--text-3);font-weight:400;font-size:12px;}

/* INPUT */
.input{
  width:100%;background:var(--surface);border:1px solid var(--hairline);
  color:var(--text);font-family:inherit;
  font-size:16px;font-weight:500;letter-spacing:-.005em;
  padding:13px 14px;border-radius:var(--radius);
  outline:none;transition:border-color .18s, box-shadow .18s, background .18s;
}
.input:focus, .input.is-focus{
  border-color:var(--accent);
  background:oklch(26% 0.01 235);
  box-shadow:0 0 0 4px oklch(78% 0.13 235 / .14);
}

/* MEMORY HINT */
.memory{
  margin-top:8px;display:inline-flex;align-items:center;gap:6px;
  font-size:12px;color:var(--text-3);font-weight:400;cursor:pointer;
  background:transparent;border:0;padding:4px 0;
  font-family:inherit;
}
.memory b{color:var(--accent);font-weight:500;}

/* PICKER */
.picker{
  width:100%;background:var(--surface);border:1px solid var(--hairline);
  padding:13px 14px;border-radius:var(--radius);
  display:flex;align-items:center;justify-content:space-between;cursor:pointer;
  transition:border-color .18s, background .18s;
  font-family:inherit;color:inherit;text-align:left;
}
.picker:hover{background:var(--surface-2);}
.picker.is-focus{
  border-color:var(--accent);
  background:oklch(26% 0.01 235);
  box-shadow:0 0 0 4px oklch(78% 0.13 235 / .14);
}
.picker__val{font-size:16px;font-weight:500;letter-spacing:-.005em;color:var(--text);}
.picker__hint{font-size:12px;color:var(--text-3);margin-top:2px;font-weight:400;}
.picker__chev{
  width:20px;height:20px;border-radius:6px;background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;color:var(--text-2);font-size:12px;
}

/* CHIPS rail (Quando) */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;-ms-overflow-style:none;}
.chips::-webkit-scrollbar{display:none;}
.chip{
  flex:0 0 auto;padding:10px 14px;
  background:var(--surface);border:1px solid var(--hairline);
  border-radius:var(--radius-sm);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  min-width:78px;
  transition:transform .18s cubic-bezier(.34,1.56,.64,1), background .18s, border-color .18s;
  font-family:inherit;
}
.chip:hover{background:var(--surface-2);}
.chip__top{font-size:10px;font-weight:600;color:var(--text-3);letter-spacing:.06em;text-transform:uppercase;}
.chip__main{font-size:14px;font-weight:600;letter-spacing:-.005em;color:var(--text);font-variant-numeric:tabular-nums;}
.chip.is-active{
  background:oklch(78% 0.13 235 / .14);
  border-color:oklch(78% 0.13 235 / .55);
}
.chip.is-active .chip__top{color:var(--accent);}
.chip.is-active .chip__main{color:var(--text);}

/* TIME row (Janela) */
.time-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.time-card{
  background:var(--surface);border:1px solid var(--hairline);
  padding:14px 16px;border-radius:var(--radius);
  cursor:pointer;text-align:left;
  font-family:inherit;color:inherit;
  transition:background .18s, border-color .18s;
}
.time-card:hover{background:var(--surface-2);}
.time-card__lbl{font-size:11px;font-weight:600;color:var(--text-3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px;}
.time-card__val{
  font-size:30px;font-weight:600;letter-spacing:-.025em;color:var(--text);
  font-variant-numeric:tabular-nums;line-height:1;
}
.time-card__val .colon{color:var(--text-3);}
.time-card__sub{font-size:11px;color:var(--text-3);margin-top:6px;font-weight:400;}

/* TIPO rail (segmented) */
.tipo-rail{display:flex;gap:6px;flex-wrap:wrap;}
.tipo{
  padding:9px 14px;border:1px solid var(--hairline);background:var(--surface);
  border-radius:999px;font-size:13px;font-weight:500;letter-spacing:-.005em;
  cursor:pointer;color:var(--text-2);
  font-family:inherit;
  transition:transform .18s cubic-bezier(.34,1.56,.64,1), background .18s, border-color .18s, color .18s;
}
.tipo:hover{background:var(--surface-2);color:var(--text);}
.tipo.is-active{
  background:var(--accent);color:oklch(15% 0.01 235);border-color:var(--accent);
  font-weight:600;
}
.tipo--new{
  border-style:dashed;color:var(--text-3);
}
.tipo--new:hover{color:var(--accent);border-color:var(--accent);}

/* SUMMARY */
.summary{
  background:var(--surface);border:1px solid var(--hairline);
  padding:13px 14px;border-radius:var(--radius);
  font-size:12px;color:var(--text-2);
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin-top:6px;
}
.summary__lbl{
  font-size:10px;font-weight:600;color:var(--text-3);
  letter-spacing:.08em;text-transform:uppercase;
}
.summary b{color:var(--text);font-weight:600;font-size:13px;font-variant-numeric:tabular-nums;}

/* FOOT FIXED */
.foot{
  position:fixed;bottom:0;left:0;right:0;z-index:40;
  background:oklch(18% 0.005 240 / .92);
  -webkit-backdrop-filter:blur(20px) saturate(140%);
  backdrop-filter:blur(20px) saturate(140%);
  border-top:1px solid var(--hairline);
  padding:14px 20px 28px;
}
.foot__inner{
  max-width:430px;margin:0 auto;
  display:grid;grid-template-columns:auto 1fr;gap:10px;
}
.btn{
  padding:14px 18px;border-radius:var(--radius);cursor:pointer;
  font-family:inherit;font-size:15px;font-weight:600;letter-spacing:-.005em;
  outline:none;border:1px solid transparent;
  transition:transform .18s cubic-bezier(.34,1.56,.64,1), background .18s, color .18s;
}
.btn:active{transform:scale(.97);}
.btn--ghost{
  background:transparent;color:var(--text-2);border-color:var(--hairline);
}
.btn--ghost:hover{background:var(--surface);color:var(--text);}
.btn--primary{
  background:var(--accent);color:oklch(12% 0.005 240);border-color:var(--accent);
}
.btn--primary:hover{background:oklch(82% 0.14 235);}
</style>
</head>
<body>
<div class="app">

  <header class="context-head">
    <span class="context-head__eyebrow"><span class="context-head__eyebrow__dot"></span>Novo evento</span>
    <h1 class="context-head__title">Criar evento</h1>
    <p class="context-head__sub">Track day, treino, corrida ou sessão de testes</p>
  </header>

  <div class="field">
    <div class="field__lbl">Nome <small>obrigatório</small></div>
    <input class="input" value="Copa Brasília — Etapa 2">
    <button class="memory" type="button">Sugerido <b>· Copa Brasília — Etapa 1</b></button>
  </div>

  <div class="field">
    <div class="field__lbl">Autódromo <small>obrigatório</small></div>
    <button class="picker is-focus" type="button">
      <div>
        <div class="picker__val">Brasília</div>
        <div class="picker__hint">Auto. Int. Nelson Piquet · DF · 3,4 km</div>
      </div>
      <div class="picker__chev">›</div>
    </button>
    <button class="memory" type="button">Último usado <b>· Brasília</b></button>
  </div>

  <div class="field">
    <div class="field__lbl">Quando <small>obrigatório</small></div>
    <div class="chips">
      <button class="chip" type="button"><span class="chip__top">Hoje</span><span class="chip__main">qui 30/04</span></button>
      <button class="chip is-active" type="button"><span class="chip__top">Sábado</span><span class="chip__main">02/05</span></button>
      <button class="chip" type="button"><span class="chip__top">Domingo</span><span class="chip__main">03/05</span></button>
      <button class="chip" type="button"><span class="chip__top">Próx. FDS</span><span class="chip__main">09/05</span></button>
      <button class="chip" type="button"><span class="chip__top">Calendário</span><span class="chip__main">···</span></button>
    </div>
  </div>

  <div class="field">
    <div class="field__lbl">Janela do dia <small>opcional</small></div>
    <div class="time-row">
      <button class="time-card" type="button">
        <div class="time-card__lbl">Início</div>
        <div class="time-card__val">08<span class="colon">:</span>00</div>
        <div class="time-card__sub">Padrão de track day</div>
      </button>
      <button class="time-card" type="button">
        <div class="time-card__lbl">Fim</div>
        <div class="time-card__val">17<span class="colon">:</span>00</div>
        <div class="time-card__sub">Padrão de track day</div>
      </button>
    </div>
  </div>

  <div class="field">
    <div class="field__lbl">Tipo <small>opcional</small></div>
    <div class="tipo-rail">
      <button class="tipo is-active" type="button">Track Day</button>
      <button class="tipo" type="button">Treino</button>
      <button class="tipo" type="button">Treino de largada</button>
      <button class="tipo" type="button">Corrida</button>
      <button class="tipo" type="button">Validação</button>
      <button class="tipo" type="button">Sessão de testes</button>
      <button class="tipo" type="button">Prática livre</button>
      <button class="tipo tipo--new" type="button">+ Novo tipo</button>
    </div>
  </div>

  <div class="summary">
    <span class="summary__lbl">Resumo</span>
    <b>Sábado 02/05 · 08–17h · Brasília · Track Day</b>
  </div>

</div>

<div class="foot">
  <div class="foot__inner">
    <button class="btn btn--ghost" type="button">Cancelar</button>
    <button class="btn btn--primary" type="button">Salvar evento</button>
  </div>
</div>
</body>
</html>
