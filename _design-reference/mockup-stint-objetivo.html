<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=430, initial-scale=1, viewport-fit=cover">
<title>Mockup Stint — Objetivo do stint — P1 Fast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg: oklch(20% 0.005 240);
  --surface: oklch(24% 0.005 240);
  --surface-2: oklch(28% 0.005 240);
  --hairline: oklch(33% 0.005 240);
  --text: oklch(95% 0.003 240);
  --text-2: oklch(75% 0.01 240);
  --text-3: oklch(58% 0.012 240);
  --accent: oklch(78% 0.13 235);
  --accent-2: oklch(82% 0.10 235 / .15);
  --green: oklch(78% 0.16 150);
  --radius: 12px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:linear-gradient(160deg, oklch(22% 0.005 240) 0%, oklch(18% 0.005 240) 100%);
  color:var(--text);
  display:flex;align-items:center;justify-content:center;
  padding:20px;min-height:100vh;
  -webkit-font-smoothing:antialiased;
  font-weight:400;
}

.device{
  width:430px;height:932px;
  background:var(--bg);
  border-radius:48px;
  border:1px solid oklch(28% 0.005 240);
  box-shadow:0 30px 80px oklch(0% 0 0 / .6), 0 0 0 8px oklch(12% 0.005 240);
  position:relative;overflow:hidden;
  display:flex;flex-direction:column;
}
.notch{
  position:absolute;top:8px;left:50%;transform:translateX(-50%);
  width:128px;height:36px;background:#000;border-radius:20px;z-index:50;
}

.modal{
  flex:1;display:flex;flex-direction:column;
  padding-top:60px;
}

/* HEAD */
.head{
  padding:18px 24px 14px;
  display:flex;align-items:center;justify-content:space-between;
}
.head__title{
  font-size:22px;font-weight:600;letter-spacing:-.02em;color:var(--text);
}
.head__sub{
  font-size:12px;font-weight:400;color:var(--text-3);margin-top:1px;letter-spacing:.005em;
}
.head__close{
  background:transparent;border:0;color:var(--text-2);
  font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;
  padding:8px 12px;border-radius:8px;
}
.head__close:hover{background:oklch(28% 0.005 240);}

/* BODY */
.body{flex:1;overflow-y:auto;padding:6px 24px 24px;}

.field{margin-bottom:22px;}
.field__lbl{
  font-size:13px;font-weight:500;color:var(--text-2);
  margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;
  letter-spacing:.005em;
}
.field__lbl small{color:var(--text-3);font-weight:400;font-size:12px;}

/* INPUT */
.input{
  width:100%;background:var(--surface);border:1px solid var(--hairline);
  color:var(--text);font-family:inherit;
  font-size:17px;font-weight:500;letter-spacing:-.005em;
  padding:14px 16px;border-radius:var(--radius);
  outline:none;transition:border-color .18s, box-shadow .18s, background .18s;
}
.input:focus, .input.is-focus{
  border-color:var(--accent);
  background:oklch(26% 0.01 235);
  box-shadow:0 0 0 4px oklch(78% 0.13 235 / .14);
}

/* CHIP-SUG (sugestões pra preencher o input) */
.chips-sug{
  display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;
}
.chip-sug{
  padding:7px 12px;
  background:transparent;
  border:1px solid var(--hairline);
  border-radius:999px;
  font-size:12px;font-weight:500;color:var(--text-3);
  cursor:pointer;
  transition:all .2s cubic-bezier(.34,1.56,.64,1);
}
.chip-sug:hover{
  background:var(--surface);
  color:var(--text-2);
  border-color:oklch(40% 0.005 240);
}

/* TOGGLE ROW (P1 Coach) */
.toggle-row{
  width:100%;background:var(--surface);
  border:1px solid var(--hairline);
  padding:14px 16px;border-radius:var(--radius);
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  cursor:pointer;font-family:inherit;color:inherit;
  transition:border-color .18s, background .18s;
}
.toggle-row:hover{background:var(--surface-2);}
.toggle-row[data-on="true"]{
  border-color:oklch(78% 0.13 235 / .45);
  background:oklch(26% 0.012 235);
}
.toggle-row__title{
  font-size:15px;font-weight:600;letter-spacing:-.005em;
  color:var(--text);text-align:left;
}
.toggle-row__sub{
  font-size:12px;color:var(--text-3);font-weight:400;
  margin-top:3px;text-align:left;
}
.toggle-switch{
  flex:0 0 auto;
  width:44px;height:26px;
  background:oklch(36% 0.005 240);
  border-radius:999px;
  position:relative;transition:background .22s;
}
.toggle-switch[data-on="true"]{background:var(--accent);}
.toggle-switch__knob{
  position:absolute;top:3px;left:3px;
  width:20px;height:20px;border-radius:50%;
  background:oklch(96% 0 0);
  transition:transform .22s cubic-bezier(.34,1.56,.64,1);
  box-shadow:0 1px 3px oklch(0% 0 0 / .2);
}
.toggle-switch[data-on="true"] .toggle-switch__knob{transform:translateX(18px);}

/* COACH-OPTIONS (sub-escolhas, visíveis só com toggle on) */
.coach-options{
  border-left:2px solid oklch(78% 0.13 235 / .4);
  padding-left:14px;margin-left:2px;
  margin-bottom:6px;
}

/* PHASE-RAIL (3 botões grandes Entrada/Apex/Saída) */
.phase-rail{
  display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;
}
.phase{
  padding:14px 8px;
  background:var(--surface);
  border:1px solid var(--hairline);
  border-radius:var(--radius);
  font-family:inherit;font-size:14px;font-weight:600;
  letter-spacing:-.005em;color:var(--text-2);
  cursor:pointer;text-align:center;
  transition:all .2s cubic-bezier(.34,1.56,.64,1);
}
.phase:hover{background:var(--surface-2);color:var(--text);}
.phase.is-active{
  background:var(--accent);color:oklch(15% 0.01 235);
  border-color:var(--accent);
}

/* PICKER (mesmo do mockup-evento) */
.picker{
  width:100%;background:var(--surface);border:1px solid var(--hairline);
  padding:13px 16px;border-radius:var(--radius);
  display:flex;align-items:center;justify-content:space-between;cursor:pointer;
  transition:border-color .18s, background .18s;
  font-family:inherit;color:inherit;text-align:left;
}
.picker:hover{background:var(--surface-2);}
.picker__val{font-size:16px;font-weight:500;letter-spacing:-.005em;color:var(--text);}
.picker__val.is-empty{color:var(--text-3);}
.picker__hint{font-size:12px;color:var(--text-3);margin-top:2px;font-weight:400;}
.picker__chev{
  width:20px;height:20px;border-radius:6px;background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;color:var(--text-2);font-size:12px;
}

/* SUMMARY */
.summary{
  background:var(--surface);border:1px solid var(--hairline);
  padding:12px 14px;border-radius:var(--radius);
  font-size:12px;color:var(--text-2);margin-top:6px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.summary span{color:var(--text-3);flex:0 0 auto;}
.summary b{color:var(--text);font-weight:600;text-align:right;}

/* FOOT */
.foot{
  padding:14px 24px 30px;
  background:linear-gradient(180deg,transparent,var(--bg) 30%);
  display:grid;grid-template-columns:auto 1fr;gap:10px;
}
.btn{
  padding:14px 18px;border-radius:14px;cursor:pointer;
  font-family:inherit;font-size:15px;font-weight:600;letter-spacing:-.005em;
  outline:none;border:0;
  transition:transform .18s cubic-bezier(.34,1.56,.64,1), background .18s;
}
.btn:active{transform:scale(.97);}
.btn--ghost{background:transparent;color:var(--text-2);}
.btn--ghost:hover{background:var(--surface);color:var(--text);}
.btn--primary{background:var(--accent);color:oklch(12% 0.005 240);}
.btn--primary:hover{background:oklch(82% 0.14 235);}
</style>
</head>
<body>
<div class="device">
  <div class="notch"></div>
  <div class="modal">

    <div class="head">
      <div>
        <div class="head__title">Stint #3</div>
        <div class="head__sub">Brasília · sábado 02/05 · 14:32</div>
      </div>
      <button class="head__close">Fechar</button>
    </div>

    <div class="body">

      <!-- ── Objetivo do stint ── -->
      <div class="field">
        <div class="field__lbl">Objetivo deste stint <small>opcional</small></div>
        <input class="input" placeholder="Ex: Atacar tempo no S do Senna" value="Atacar tempo no S do Senna">
        <div class="chips-sug">
          <button class="chip-sug">Aquecer</button>
          <button class="chip-sug">Atacar tempo</button>
          <button class="chip-sug">Consistência</button>
          <button class="chip-sug">Treinar largada</button>
          <button class="chip-sug">Treinar trecho</button>
          <button class="chip-sug">Validar setup</button>
        </div>
      </div>

      <!-- ── Toggle P1 Coach ── -->
      <div class="field">
        <button class="toggle-row" data-on="true">
          <div>
            <div class="toggle-row__title">Aprendizado com IA</div>
            <div class="toggle-row__sub">P1 Coach orienta no cockpit · 7 lições disponíveis</div>
          </div>
          <span class="toggle-switch" data-on="true">
            <span class="toggle-switch__knob"></span>
          </span>
        </button>
      </div>

      <!-- ── Sub-escolhas do P1 Coach (visíveis só com toggle on) ── -->
      <div class="coach-options">

        <div class="field">
          <div class="field__lbl">Área de foco <small>obrigatório</small></div>
          <div class="phase-rail">
            <button class="phase">Entrada</button>
            <button class="phase is-active">Apex</button>
            <button class="phase">Saída</button>
          </div>
        </div>

        <div class="field">
          <div class="field__lbl">Lição específica <small>opcional · trava em 1 lição</small></div>
          <button class="picker">
            <div>
              <div class="picker__val">V-Min</div>
              <div class="picker__hint">L002 · velocidade · intro · alta confiança</div>
            </div>
            <div class="picker__chev">›</div>
          </button>
        </div>

        <div class="field">
          <div class="field__lbl">Trecho específico <small>opcional · trava em 1 trecho</small></div>
          <button class="picker">
            <div>
              <div class="picker__val is-empty">Sem trecho específico</div>
              <div class="picker__hint">Coach atua em todas as curvas elegíveis</div>
            </div>
            <div class="picker__chev">›</div>
          </button>
        </div>

      </div>

      <!-- ── Resumo ── -->
      <div class="summary">
        <span>Resumo</span>
        <b>Atacar tempo · IA travada em V-Min · foco apex</b>
      </div>

    </div>

    <div class="foot">
      <button class="btn btn--ghost">Cancelar</button>
      <button class="btn btn--primary">Salvar e ir pro cockpit</button>
    </div>

  </div>
</div>
</body>
</html>
