<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=430,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Mockup — Tipo de evento — P1 Fast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg: oklch(20% 0.005 240);
  --surface: oklch(24% 0.005 240);
  --surface-2: oklch(28% 0.005 240);
  --hairline: oklch(33% 0.005 240);
  --text: oklch(95% 0.003 240);
  --text-2: oklch(75% 0.01 240);
  --text-3: oklch(58% 0.012 240);
  --accent: oklch(78% 0.13 235);
  --accent-2: oklch(82% 0.10 235 / .15);
  --gold: oklch(80% 0.13 90);
  --radius: 12px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{
  min-height:100dvh;width:100vw;
  background:linear-gradient(160deg, oklch(22% 0.005 240) 0%, oklch(18% 0.005 240) 100%);
  color:var(--text);font-family:'Inter',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;font-weight:400;
}
body{padding:0 0 110px;}
.app{max-width:430px;margin:0 auto;padding:16px 20px 0;}

.context-head{padding:14px 4px 16px;}
.context-head__eyebrow{
  display:inline-flex;align-items:center;gap:7px;
  padding:5px 12px;background:var(--accent-2);
  border:1px solid oklch(78% 0.13 235 / .35);border-radius:999px;
  font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent);margin-bottom:12px;
}
.context-head__eyebrow__dot{width:5px;height:5px;border-radius:50%;background:currentColor;}
.context-head__title{font-size:24px;font-weight:600;letter-spacing:-.025em;line-height:1.15;color:var(--text);margin-bottom:4px;}
.context-head__sub{font-size:13px;color:var(--text-2);}

.group__head{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 4px 10px;
  font-size:11px;font-weight:600;
  letter-spacing:.12em;color:var(--text-3);
  text-transform:uppercase;
}
.group__head:first-of-type{padding-top:6px;}
.group__head strong{color:var(--accent);font-weight:600;}

.tipo-row{
  width:100%;
  display:flex;align-items:flex-start;gap:14px;
  padding:14px 16px;
  background:var(--surface);
  border:1px solid var(--hairline);
  border-radius:var(--radius);
  margin-bottom:8px;cursor:pointer;
  font-family:inherit;color:inherit;text-align:left;
  transition:transform .18s cubic-bezier(.34,1.56,.64,1), background .18s, border-color .18s;
}
.tipo-row:hover{background:var(--surface-2);}
.tipo-row:active{transform:scale(.99);}
.tipo-row[data-on="true"]{
  border-color:oklch(78% 0.13 235 / .55);
  background:var(--accent-2);
}

.tipo-radio{
  flex:0 0 auto;
  width:24px;height:24px;border-radius:50%;
  border:2px solid var(--hairline);
  background:var(--surface-2);
  margin-top:2px;
  transition:background .18s, border-color .18s;
  position:relative;
}
.tipo-row[data-on="true"] .tipo-radio{
  border-color:var(--accent);
  background:var(--accent);
}
.tipo-row[data-on="true"] .tipo-radio::after{
  content:'';
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:8px;height:8px;border-radius:50%;
  background:oklch(12% 0.005 240);
}

.tipo-body{flex:1 1 auto;min-width:0;}
.tipo-name{
  display:block;
  font-size:16px;font-weight:600;
  letter-spacing:-.005em;color:var(--text);
  line-height:1.2;
}
.tipo-stats{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  margin-top:8px;
}
.tipo-stat{
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 8px;border-radius:999px;
  font-size:10px;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;
  color:var(--text-3);
  border:1px solid var(--hairline);
  background:transparent;
  font-variant-numeric:tabular-nums;
}
.tipo-stat strong{color:var(--text-2);font-weight:700;}
.tipo-stat--pb{
  color:var(--gold);
  border-color:oklch(80% 0.13 90 / .35);
  background:oklch(80% 0.13 90 / .08);
}
.tipo-stat--pb strong{color:var(--gold);}

.tipo-row[data-on="true"] .tipo-stat{
  color:var(--text-2);
  border-color:oklch(78% 0.13 235 / .35);
}
.tipo-row[data-on="true"] .tipo-stat strong{color:var(--text);}

.add-row{
  width:100%;margin-top:8px;
  display:flex;align-items:center;justify-content:center;gap:8px;
  background:transparent;
  border:1px dashed var(--hairline);
  border-radius:var(--radius);
  color:var(--text-2);
  font-family:inherit;font-size:14px;font-weight:600;
  letter-spacing:-.005em;cursor:pointer;
  padding:14px 16px;
  transition:border-color .18s, color .18s, background .18s;
}
.add-row:hover{
  border-color:var(--accent);
  color:var(--accent);
  background:oklch(78% 0.13 235 / .06);
}
.add-row__plus{font-size:18px;line-height:1;font-weight:500;}

.foot{
  position:fixed;bottom:0;left:0;right:0;z-index:40;
  background:oklch(18% 0.005 240 / .92);
  -webkit-backdrop-filter:blur(20px) saturate(140%);
  backdrop-filter:blur(20px) saturate(140%);
  border-top:1px solid var(--hairline);padding:14px 20px 28px;
}
.foot__inner{max-width:430px;margin:0 auto;display:grid;grid-template-columns:auto 1fr;gap:10px;}
.btn{
  padding:14px 18px;border-radius:var(--radius);cursor:pointer;
  font-family:inherit;font-size:15px;font-weight:600;letter-spacing:-.005em;
  outline:none;border:1px solid transparent;
  transition:transform .18s cubic-bezier(.34,1.56,.64,1), background .18s, color .18s;
}
.btn:active{transform:scale(.97);}
.btn--ghost{background:transparent;color:var(--text-2);border-color:var(--hairline);}
.btn--ghost:hover{background:var(--surface);color:var(--text);}
.btn--primary{background:var(--accent);color:oklch(12% 0.005 240);border-color:var(--accent);}
.btn--primary:hover{background:oklch(82% 0.14 235);}
</style>
</head>
<body>
<div class="app">

  <header class="context-head">
    <span class="context-head__eyebrow"><span class="context-head__eyebrow__dot"></span>Tipo do evento</span>
    <h1 class="context-head__title">Que tipo é</h1>
    <p class="context-head__sub">Eventos do mesmo tipo entram no mesmo histórico — comparam-se entre si.</p>
  </header>

  <div class="group__head">
    <span>Cadastrados</span>
    <strong>4</strong>
  </div>

  <button class="tipo-row" type="button" data-on="true">
    <span class="tipo-radio"></span>
    <span class="tipo-body">
      <span class="tipo-name">Track Day Planal</span>
      <span class="tipo-stats">
        <span class="tipo-stat"><strong>3</strong> edições</span>
        <span class="tipo-stat"><strong>22</strong> stints</span>
        <span class="tipo-stat tipo-stat--pb"><strong>1:31.89</strong> melhor</span>
      </span>
    </span>
  </button>

  <button class="tipo-row" type="button" data-on="false">
    <span class="tipo-radio"></span>
    <span class="tipo-body">
      <span class="tipo-name">Track Day Campo Grande</span>
      <span class="tipo-stats">
        <span class="tipo-stat"><strong>2</strong> edições</span>
        <span class="tipo-stat"><strong>14</strong> stints</span>
        <span class="tipo-stat tipo-stat--pb"><strong>1:48.20</strong> melhor</span>
      </span>
    </span>
  </button>

  <button class="tipo-row" type="button" data-on="false">
    <span class="tipo-radio"></span>
    <span class="tipo-body">
      <span class="tipo-name">Endurance 4h</span>
      <span class="tipo-stats">
        <span class="tipo-stat"><strong>1</strong> edição</span>
        <span class="tipo-stat"><strong>8</strong> stints</span>
        <span class="tipo-stat tipo-stat--pb"><strong>1:33.45</strong> melhor</span>
      </span>
    </span>
  </button>

  <button class="tipo-row" type="button" data-on="false">
    <span class="tipo-radio"></span>
    <span class="tipo-body">
      <span class="tipo-name">Treino livre</span>
      <span class="tipo-stats">
        <span class="tipo-stat"><strong>5</strong> edições</span>
        <span class="tipo-stat"><strong>32</strong> stints</span>
      </span>
    </span>
  </button>

  <button class="add-row" type="button">
    <span class="add-row__plus">+</span>Cadastrar tipo de evento
  </button>

</div>

<div class="foot">
  <div class="foot__inner">
    <button class="btn btn--ghost" type="button">Cancelar</button>
    <button class="btn btn--primary" type="button">Confirmar</button>
  </div>
</div>

<script>
document.querySelectorAll('.tipo-row').forEach(function(row){
  row.addEventListener('click', function(){
    document.querySelectorAll('.tipo-row').forEach(function(r){ r.setAttribute('data-on','false'); });
    row.setAttribute('data-on','true');
  });
});
</script>
</body>
</html>
