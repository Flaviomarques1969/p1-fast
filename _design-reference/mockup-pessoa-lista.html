<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=430,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Mockup — Time / Pessoas — P1 Fast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg: oklch(20% 0.005 240);
  --surface: oklch(24% 0.005 240);
  --surface-2: oklch(28% 0.005 240);
  --hairline: oklch(33% 0.005 240);
  --text: oklch(95% 0.003 240);
  --text-2: oklch(75% 0.01 240);
  --text-3: oklch(58% 0.012 240);
  --accent: oklch(78% 0.13 235);
  --accent-2: oklch(82% 0.10 235 / .15);
  --radius: 12px;
  --radius-sm: 10px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{
  min-height:100dvh;width:100vw;
  background:linear-gradient(160deg, oklch(22% 0.005 240) 0%, oklch(18% 0.005 240) 100%);
  color:var(--text);
  font-family:'Inter',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;font-weight:400;
}
body{padding:0 0 110px;}
.app{max-width:430px;margin:0 auto;padding:16px 20px 0;}

.context-head{padding:14px 4px 16px;}
.context-head__eyebrow{
  display:inline-flex;align-items:center;gap:7px;
  padding:5px 12px;background:var(--accent-2);
  border:1px solid oklch(78% 0.13 235 / .35);border-radius:999px;
  font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent);margin-bottom:12px;
}
.context-head__eyebrow__dot{width:5px;height:5px;border-radius:50%;background:currentColor;}
.context-head__title{font-size:24px;font-weight:600;letter-spacing:-.025em;line-height:1.15;color:var(--text);margin-bottom:4px;}
.context-head__sub{font-size:13px;color:var(--text-2);}

/* Filtro por papel — chip rail */
.filter-rail{
  display:flex;gap:8px;overflow-x:auto;
  padding:8px 0 16px;
  margin:0 -4px;
  scrollbar-width:none;
}
.filter-rail::-webkit-scrollbar{display:none;}
.filter-chip{
  flex:0 0 auto;
  padding:8px 14px;border-radius:999px;
  font-family:inherit;font-size:13px;font-weight:600;letter-spacing:-.005em;
  background:var(--surface);
  color:var(--text-2);
  border:1px solid var(--hairline);cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;
  transition:transform .18s cubic-bezier(.34,1.56,.64,1), background .18s, color .18s, border-color .18s;
}
.filter-chip:active{transform:scale(.97);}
.filter-chip[data-on="true"]{
  background:var(--accent-2);
  color:var(--accent);
  border-color:oklch(78% 0.13 235 / .55);
}
.filter-chip__count{
  font-variant-numeric:tabular-nums;
  font-weight:500;
  color:var(--text-3);
}
.filter-chip[data-on="true"] .filter-chip__count{color:inherit;opacity:.7;}

.group__head{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 4px 10px;
  font-size:11px;font-weight:600;
  letter-spacing:.12em;color:var(--text-3);
  text-transform:uppercase;
}
.group__head strong{color:var(--accent);font-weight:600;}

.person-row{
  width:100%;
  display:flex;align-items:flex-start;gap:14px;
  padding:14px 16px;
  background:var(--surface);
  border:1px solid var(--hairline);
  border-radius:var(--radius);
  margin-bottom:8px;cursor:pointer;
  font-family:inherit;color:inherit;text-align:left;
  transition:transform .18s cubic-bezier(.34,1.56,.64,1), background .18s, border-color .18s;
}
.person-row:hover{background:var(--surface-2);}
.person-row:active{transform:scale(.99);}

.person-avatar{
  flex:0 0 auto;
  width:40px;height:40px;border-radius:50%;
  background:var(--surface-2);
  border:1px solid var(--hairline);
  display:grid;place-items:center;
  font-size:14px;font-weight:600;color:var(--text-2);letter-spacing:-.01em;
}

.person-body{flex:1 1 auto;min-width:0;}
.person-name{
  display:block;
  font-size:16px;font-weight:600;
  letter-spacing:-.005em;color:var(--text);
  line-height:1.2;
}
.person-roles{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  margin-top:6px;
}
.role-tag{
  display:inline-flex;align-items:center;
  padding:3px 8px;border-radius:999px;
  font-size:10px;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;
}
.role-tag--piloto{color:var(--accent);background:var(--accent-2);border:1px solid oklch(78% 0.13 235 / .35);}
.role-tag--neutro{color:var(--text-3);background:transparent;border:1px solid var(--hairline);}

.person-meta{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  margin-top:8px;
}
.meta-tag{
  display:inline-flex;align-items:center;
  padding:3px 8px;border-radius:999px;
  font-size:10px;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;
  color:var(--text-3);
  border:1px solid var(--hairline);
  background:transparent;
  font-variant-numeric:tabular-nums;
}

.person-chev{
  flex:0 0 auto;align-self:center;
  font-size:20px;color:var(--text-3);font-weight:300;
  margin-left:4px;
}

.add-row{
  width:100%;margin-top:8px;
  display:flex;align-items:center;justify-content:center;gap:8px;
  background:transparent;
  border:1px dashed var(--hairline);
  border-radius:var(--radius);
  color:var(--text-2);
  font-family:inherit;font-size:14px;font-weight:600;
  letter-spacing:-.005em;cursor:pointer;
  padding:14px 16px;
  transition:border-color .18s, color .18s, background .18s;
}
.add-row:hover{
  border-color:var(--accent);
  color:var(--accent);
  background:oklch(78% 0.13 235 / .06);
}
.add-row__plus{font-size:18px;line-height:1;font-weight:500;}

.foot{
  position:fixed;bottom:0;left:0;right:0;z-index:40;
  background:oklch(18% 0.005 240 / .92);
  -webkit-backdrop-filter:blur(20px) saturate(140%);
  backdrop-filter:blur(20px) saturate(140%);
  border-top:1px solid var(--hairline);
  padding:14px 20px 28px;
}
.foot__inner{
  max-width:430px;margin:0 auto;
}
.foot__btn{
  width:100%;
  padding:14px 18px;border-radius:var(--radius);cursor:pointer;
  font-family:inherit;font-size:15px;font-weight:600;letter-spacing:-.005em;
  outline:none;border:1px solid var(--hairline);
  background:transparent;color:var(--text-2);
  transition:transform .18s cubic-bezier(.34,1.56,.64,1), background .18s, color .18s;
}
.foot__btn:active{transform:scale(.97);}
.foot__btn:hover{background:var(--surface);color:var(--text);}
</style>
</head>
<body>
<div class="app">

  <header class="context-head">
    <span class="context-head__eyebrow"><span class="context-head__eyebrow__dot"></span>Time</span>
    <h1 class="context-head__title">Pessoas</h1>
    <p class="context-head__sub">7 cadastradas · piloto, engenheiro, mecânico, professor, chefe e visitante</p>
  </header>

  <!-- Filtro por papel -->
  <div class="filter-rail">
    <button class="filter-chip" type="button" data-on="true">Todas <span class="filter-chip__count">7</span></button>
    <button class="filter-chip" type="button" data-on="false">Piloto <span class="filter-chip__count">4</span></button>
    <button class="filter-chip" type="button" data-on="false">Engenheiro <span class="filter-chip__count">2</span></button>
    <button class="filter-chip" type="button" data-on="false">Mecânico <span class="filter-chip__count">2</span></button>
    <button class="filter-chip" type="button" data-on="false">Professor <span class="filter-chip__count">1</span></button>
    <button class="filter-chip" type="button" data-on="false">Chefe <span class="filter-chip__count">1</span></button>
    <button class="filter-chip" type="button" data-on="false">Visitante <span class="filter-chip__count">2</span></button>
  </div>

  <div class="group__head">
    <span>Cadastradas</span>
    <strong>7</strong>
  </div>

  <button class="person-row" type="button">
    <span class="person-avatar">FM</span>
    <span class="person-body">
      <span class="person-name">Flavio Marx</span>
      <span class="person-roles">
        <span class="role-tag role-tag--piloto">Piloto</span>
        <span class="role-tag role-tag--neutro">Chefe</span>
      </span>
      <span class="person-meta">
        <span class="meta-tag">1,75 m</span>
        <span class="meta-tag">78 kg</span>
        <span class="meta-tag">45 anos</span>
      </span>
    </span>
    <span class="person-chev">›</span>
  </button>

  <button class="person-row" type="button">
    <span class="person-avatar">BM</span>
    <span class="person-body">
      <span class="person-name">Bruno Marx</span>
      <span class="person-roles">
        <span class="role-tag role-tag--piloto">Piloto</span>
      </span>
      <span class="person-meta">
        <span class="meta-tag">1,80 m</span>
        <span class="meta-tag">82 kg</span>
        <span class="meta-tag">38 anos</span>
      </span>
    </span>
    <span class="person-chev">›</span>
  </button>

  <button class="person-row" type="button">
    <span class="person-avatar">LB</span>
    <span class="person-body">
      <span class="person-name">Luiz Bresser</span>
      <span class="person-roles">
        <span class="role-tag role-tag--piloto">Piloto</span>
        <span class="role-tag role-tag--neutro">Professor</span>
      </span>
      <span class="person-meta">
        <span class="meta-tag">1,78 m</span>
        <span class="meta-tag">85 kg</span>
        <span class="meta-tag">52 anos</span>
      </span>
    </span>
    <span class="person-chev">›</span>
  </button>

  <button class="person-row" type="button">
    <span class="person-avatar">AM</span>
    <span class="person-body">
      <span class="person-name">Alain Mesquita</span>
      <span class="person-roles">
        <span class="role-tag role-tag--piloto">Piloto</span>
      </span>
      <span class="person-meta">
        <span class="meta-tag">1,72 m</span>
        <span class="meta-tag">76 kg</span>
        <span class="meta-tag">41 anos</span>
      </span>
    </span>
    <span class="person-chev">›</span>
  </button>

  <button class="person-row" type="button">
    <span class="person-avatar">MS</span>
    <span class="person-body">
      <span class="person-name">Miguel Souza</span>
      <span class="person-roles">
        <span class="role-tag role-tag--neutro">Engenheiro</span>
        <span class="role-tag role-tag--neutro">Mecânico</span>
      </span>
      <span class="person-meta">
        <span class="meta-tag">1,68 m</span>
        <span class="meta-tag">72 kg</span>
      </span>
    </span>
    <span class="person-chev">›</span>
  </button>

  <button class="person-row" type="button">
    <span class="person-avatar">RC</span>
    <span class="person-body">
      <span class="person-name">Ricardo Costa</span>
      <span class="person-roles">
        <span class="role-tag role-tag--neutro">Engenheiro</span>
      </span>
      <span class="person-meta">
        <span class="meta-tag">1,82 m</span>
        <span class="meta-tag">88 kg</span>
      </span>
    </span>
    <span class="person-chev">›</span>
  </button>

  <button class="person-row" type="button">
    <span class="person-avatar">JV</span>
    <span class="person-body">
      <span class="person-name">João Visitante</span>
      <span class="person-roles">
        <span class="role-tag role-tag--neutro">Visitante</span>
      </span>
    </span>
    <span class="person-chev">›</span>
  </button>

  <button class="add-row" type="button">
    <span class="add-row__plus">+</span>Cadastrar pessoa
  </button>

</div>

<div class="foot">
  <div class="foot__inner">
    <button class="foot__btn" type="button">Voltar pra Home</button>
  </div>
</div>

<script>
document.querySelectorAll('.filter-chip').forEach(function(chip){
  chip.addEventListener('click', function(){
    document.querySelectorAll('.filter-chip').forEach(function(c){ c.setAttribute('data-on','false'); });
    chip.setAttribute('data-on','true');
  });
});
</script>
</body>
</html>
