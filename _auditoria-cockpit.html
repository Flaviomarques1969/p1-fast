<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auditoria do Cockpit do Piloto — P1 Fast</title>
<style>
  :root{ --bg:#0a0d12; --card:#141a22; --bd:#222c38; --ink:#e8eef5; --muted:#93a1b3; --green:#2fcf6a; --red:#ff5147; --amber:#f4c145; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
  .wrap{max-width:1000px;margin:0 auto;padding:28px 20px 90px}
  h1{font-size:26px;margin:0 0 4px}
  h2{font-size:19px;margin:30px 0 12px;border-bottom:1px solid var(--bd);padding-bottom:6px}
  .sub{color:var(--muted);margin:0 0 22px}
  .resumo{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:22px}
  .kpi{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 18px;flex:1;min-width:150px}
  .kpi .n{font-size:30px;font-weight:800}
  .kpi .l{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
  .alerta{background:linear-gradient(180deg,#2a1416,#1a0f12);border:1px solid #50262a;border-radius:12px;padding:16px 18px;margin-bottom:8px;color:#ffd9d6}
  .alerta b{color:#ff7b73}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px 20px;margin-bottom:16px}
  .card h3{margin:0 0 10px;font-size:18px}
  .selos{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
  .selo{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;border:1px solid}
  .selo.sim{color:var(--green);border-color:#1f5a36;background:#11271a}
  .selo.parcial{color:var(--amber);border-color:#5a4a1f;background:#241f11}
  .selo.nao{color:var(--red);border-color:#5a2622;background:#271312}
  .selo.na{color:var(--muted);border-color:#33414f;background:#161d26}
  .selo.demo{color:#ffb454;border-color:#5a3a1f;background:#241a11}
  .sev{font-size:11px;font-weight:800;padding:3px 8px;border-radius:6px;text-transform:uppercase}
  .sev.alta{background:#3a1614;color:#ff7b73}
  .sev.media{background:#3a2e14;color:#f4c145}
  .sev.baixa{background:#14302a;color:#2fcf6a}
  .lbl{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em;margin:13px 0 4px}
  pre.ev{white-space:pre-wrap;word-break:break-word;background:#0c1117;border:1px solid var(--bd);border-radius:8px;padding:10px 12px;font-size:12px;color:#c8d3df;margin:0}
  ul.prob{margin:4px 0 0;padding-left:18px}
  ul.prob li{margin-bottom:5px}
  .rec{background:#10231a;border:1px solid #1f5a36;border-radius:8px;padding:10px 12px;color:#bff0d0}
  .item{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;margin-bottom:12px}
  .item .q{margin-bottom:10px}
  .item .q .pt{color:#cdd8e4;margin-top:4px}
  .btns{display:flex;gap:10px}
  button{font:inherit;font-weight:700;border-radius:8px;padding:8px 16px;cursor:pointer;border:1px solid var(--bd);background:#1b232d;color:var(--ink)}
  button.ap.on{background:#11271a;border-color:#1f5a36;color:var(--green)}
  button.re.on{background:#271312;border-color:#5a2622;color:var(--red)}
  .contador{position:sticky;top:0;background:var(--bg);padding:10px 0;color:var(--muted);font-size:13px;z-index:5;font-weight:700}
</style>
</head>

<div class="wrap">
  <h1>Auditoria do Cockpit do Piloto — P1 Fast</h1>
  <p class="sub">Comissão de agentes · verifica, componente a componente, se está ligado a sensor real e calculando certo</p>
  <div id="resumo" class="resumo"></div>
  <div id="alerta"></div>
  <h2>Componentes auditados</h2>
  <div id="cards"></div>
  <h2>Pontos de decisão — clique para registrar</h2>
  <div class="contador" id="contador"></div>

<script>const DADOS = [{"ligadoSensorReal":"nao","calculoRealCorreto":"parcial","soFuncionaNoDemo":true,"evidencia":"Shift light (17 LEDs) no .exe NAO esta ligado a sensor real. Verificado:\n\n1) App.xaml.cs:24-29 (OnLaunched) so faz `new MainWindow(options)` + Activate(). Nao cria T4000Provider, LiveDataBridge, reader nem orquestrador.\n\n2) Grep em todo o repo: `IniciarFeedReal`/`AlimentarMotor`/`AlimentarGps` so aparecem na propria definicao (MainWindow.xaml.cs:284/292/296) e em docs/.claude-exec. NENHUM caller real. Logo `_orquestrador` (campo MainWindow.xaml.cs:26) fica null para sempre; `AlimentarMotor` faz `_orquestrador?.IngestMotor(...)` -\u003e no-op.\n\n3) Grep de CockpitOrchestrator/LiveDataBridge/T4000Provider/IngestT4000 no projeto UI: unicos hits sao o campo orfao (linha 26), o `new CockpitOrchestrator` dentro do IniciarFeedReal orfao (289) e o IngestMotor orfao (294). O caminho RPM-\u003eshift real (LiveDataBridge.IngestT4000 -\u003e RpmToShift -\u003e CockpitState.ApplyShift) nunca e exercido pela UI.\n\n4) Unico caminho que move os LEDs no .exe = `--demo` (MainWindow.xaml.cs:203-228). Sem a flag, so roda o estado inicial do CockpitState (LEDs apagados/LedOff). E mesmo com --demo, o shift light NAO usa RPM: o proprio ApplyScene:513 comenta \"O shift light e comandado pela varredura demo (DemoShiftRender), nao pela cena\". O `_shiftSweepTimer` (224-227) varre 0-\u003e8 LEDs num timer de 110ms via RenderShiftFill (241) — animacao sintetica, sem nenhum RPM.\n\n5) O \"flash de upshift\" (ApplyShift:588-599) e proxy derivado: detecta queda de Level\u003e=5, NAO um sinal real de \"shift up\" do volante. So dispara quando ApplyShift recebe niveis — que no .exe so vem do demo, nunca de RpmToShift.\n\nCALCULO: a formula real RpmToShift existe e e correta no modo legado (LiveDataBridge.cs:135-153: Overrev\u003eredline, Fire\u003e=fireThreshold, Lit linear 1..6, Off; defensivo NaN/Inf/neg). Mas ela nunca roda no .exe. E diverge da web: o C# so tem o modo legado por %-de-redline; a web rpmToShift (live-data-bridge.js:69-77) tem o modo TORQUE como PREFERIDO (acende progressivo antes do peakTorqueRpm, FIRE no pico). A referencia cockpit-volta-real.html:283 usa peakTorqueRpm:6050 — ou seja, roda o ramo torque que o C# nem implementa. Calibracao Bubi C# (LiveLimits.Bubi, LiveDataBridge.cs:41-48) usa FireThresholdRatio=6050/6300 como aproximacao, so consumida pelo CockpitOrchestrator que nao roda.","problemas":["Nao conectado: App.OnLaunched (App.xaml.cs:24-29) nunca chama IniciarFeedReal nem instancia T4000Provider/LiveDataBridge — o shift light real fica morto no .exe.","Codigo orfao: IniciarFeedReal/AlimentarMotor/AlimentarGps (MainWindow.xaml.cs:284-297) e o campo _orquestrador estao definidos mas sem nenhum caller no repo inteiro (confirmado por Grep).","So-demo: sem --demo a tela fica congelada (LEDs LedOff). Com --demo os LEDs sao varredura sintetica por timer (_shiftSweepTimer, MainWindow.xaml.cs:224-227 + RenderShiftFill:241), nao derivada de RPM.","Divergencia de paridade com a web: C# RpmToShift (LiveDataBridge.cs:135) so tem o modo legado %-redline; falta o modo TORQUE (peakTorqueRpm/torqueLitOffsetRpm) que e o PREFERIDO na web (live-data-bridge.js:69-77) e o usado pela referencia real cockpit-volta-real.html:283 (peakTorqueRpm:6050). Mesmo se o feed fosse ligado, o .exe acenderia os LEDs por curva diferente da referencia.","Flash de upshift e proxy: ApplyShift:588 infere upshift por queda de nivel, nao por sinal real de troca de marcha do volante/cambio."],"recomendacao":"Antes de levar o .exe pra pista como cockpit real: (1) ligar o feed real no startup — em App.OnLaunched (ou no MainWindow quando sem --demo) instanciar T4000SerialReader/T4000Provider + LiveDataBridge/CockpitOrchestrator e chamar IniciarFeedReal, bombeando IngestT4000 do USB; hoje esses metodos sao orfaos. (2) Portar o modo TORQUE pro C# RpmToShift (LiveDataBridge.cs) com peakTorqueRpm/torqueLitOffsetRpm, espelhando live-data-bridge.js:69-77, e usar a calibracao Bubi por torque (6050) — senao, mesmo ligado, o shift light do .exe diverge da referencia aprovada. Enquanto isso nao for feito, tratar o shift light do .exe como protótipo visual (--demo), nao como instrumento de pilotagem.","pontoDecisao":"O shift light do .exe Windows so funciona em modo --demo (varredura sintetica por timer, sem RPM). O pipeline real (RpmToShift -\u003e CockpitState) esta implementado e testado no Domain, mas a UI nunca o pluga: App.OnLaunched nao liga o feed e IniciarFeedReal/AlimentarMotor sao codigo orfao. Alem disso o C# nao tem o modo TORQUE que a web usa como referencia real. Decisao para o Flavio: nao usar este .exe como instrumento de pista ate ligar o feed T4000 real e portar o modo torque; hoje e protótipo visual.","severidade":"alta","componente":"Shift light de potência/troca de marcha (LEDs de RPM)","key":"shift-light"},{"ligadoSensorReal":"nao","calculoRealCorreto":"nao","soFuncionaNoDemo":true,"evidencia":"A barra de luz de freio (9 LEDs por lado) no .exe NÃO está ligada a sensor/GPS. Caminho da animação: o único método que acende a barra é ApplyBrake(int level) em MainWindow.xaml.cs:790, que recebe um inteiro sintético (não velocidade/desaceleração). Seu único chamador é DemoBrakeRender (MainWindow.xaml.cs:262 e :264), que por sua vez só roda via _brakeTimer. O _brakeTimer é criado e iniciado APENAS dentro de if(_options.Demo) em MainWindow.xaml.cs:217-220 (Tick a cada 120 ms varrendo _brakeStep 0..16). Logo, sem --demo a barra nunca atualiza e fica no estado inicial apagado. ApplyScene (cenas demo) sequer chama ApplyBrake — a barra é uma varredura 0→9 totalmente desacoplada de qualquer dado (DemoBrakeRender: step\u003c=9 -\u003e ApplyBrake(step); step 10/12/14 -\u003e RenderAllBrake vermelho; senão ApplyBrake(0)). O caminho de dado REAL (GPS) jamais é alimentado: IniciarFeedReal/AlimentarGps/AlimentarMotor (MainWindow.xaml.cs:284/292/296) aparecem só na própria definição/comentários (Grep em todos os .cs do repo: nenhum chamador), e App.OnLaunched (App.xaml.cs:24-29) só faz new MainWindow + Activate, sem criar orquestrador/provider/reader. Portanto _orquestrador fica null e o ponto de freada real (que passaria por IngestGps -\u003e SetApexPonto(\u0027freio\u0027)) nunca corre. O número \u0027resultado da freada\u0027 ApplyBrakeResult (MainWindow.xaml.cs:811, diff = atualM - refM) é chamado de ApplyScene (:535) com FreioAtualM/FreioRefM hardcoded das DemoScenes (campos definidos em :312-313) — também demo, não sensor.","problemas":["A barra de luz de freio (ApplyBrake, MainWindow.xaml.cs:790) é pura animacao de demo: recebe um inteiro de varredura do _brakeTimer, sem nenhuma entrada de sensor ou GPS.","_brakeTimer so e iniciado dentro de if(_options.Demo) (MainWindow.xaml.cs:217-220). Sem a flag --demo a barra de freio fica congelada apagada (estado inicial do CockpitState).","O caminho de dado real para a freada (GPS -\u003e IngestGps -\u003e SetApexPonto(\u0027freio\u0027)) nunca e acionado: IniciarFeedReal/AlimentarGps (MainWindow.xaml.cs:284/296) nao tem nenhum chamador no repo (confirmado por Grep), e App.OnLaunched (App.xaml.cs:27) nao cria o orquestrador. _orquestrador permanece null.","O numero do resultado da freada (ApplyBrakeResult, :811) usa FreioAtualM/FreioRefM vindos hardcoded das DemoScenes via ApplyScene (:535), nao de medicao real.","Divergencia com a referencia web: cockpit-volta-real.html:343 atualizarFreio() calcula a luz de freio de dado real (v em m/s do GPS, distancia ao apice \u0027bd\u0027, ponto de freada ideal \u0027brakeRef\u0027 da melhor passagem, antecipacao FREIO_LEAD, deteccao de inicio de freada pelo pico de velocidade). Nada disso existe ligado no .exe — a barra do .exe e so um sweep 0-\u003e9 ciclico."],"recomendacao":"Ligar a barra de luz de freio ao pipeline real: (1) em App.OnLaunched (ou no MainWindow apos carregar as curvas de Brasilia) chamar IniciarFeedReal(curvas) e instanciar o feed real (T4000Provider/reader + fonte de GPS) que chame AlimentarGps/AlimentarMotor; (2) expor o estado de freio derivado do CockpitState/orquestrador (SetApexPonto(\u0027freio\u0027) / classificacao de freio) para a barra de 9 LEDs, em vez de ApplyBrake(level) por timer; (3) portar para o C# a logica de cockpit-volta-real.html:343 (m/s do GPS, distancia ao apice, ponto de freada ideal da melhor passagem, antecipacao por tempo) para ter paridade com a web; (4) restringir _brakeTimer/DemoBrakeRender estritamente ao modo --demo e deixar claro na UI quando nao ha feed real, para nao confundir animacao com medicao. Decisao de escopo (ligar feed real na UI) e do Flavio — eu posso propor, ele decide.","pontoDecisao":"O .exe so move a barra de luz de freio no modo --demo (sweep sintetico 0-\u003e9 via _brakeTimer); sem --demo ela fica apagada. O calculo real de ponto de freada por GPS existe so na referencia web (atualizarFreio); no C# o caminho real nunca e instanciado porque IniciarFeedReal/AlimentarGps nao tem chamador. Decidir: o entregavel de notebook precisa da luz de freio mostrando freada real (entao plugar o feed real na UI e portar o calculo do web), ou --demo basta por enquanto? Quem decide e o Flavio.","severidade":"alta","componente":"Luz de freio lateral (ponto de freada / brake light)","key":"luz-freio"},{"ligadoSensorReal":"nao","calculoRealCorreto":"parcial","soFuncionaNoDemo":true,"evidencia":"No .exe, o Delta (numero grande) so e movido pelo modo --demo. App.xaml.cs:24-29 (OnLaunched) so faz `new MainWindow(options)` + Activate() — nao cria orquestrador, T4000 reader nem feed de GPS. MainWindow.xaml.cs:201-228: o timer de cenas (e portanto SetDelta) so liga `if (_options.Demo)`. ApplyScene (MainWindow.xaml.cs:510-515) chama `_cockpitState.SetDelta(s.DeltaValue, s.DeltaTone)` com strings/tons HARDCODED por cena (record DemoScene tem campos `string DeltaValue, Tone DeltaTone`, linhas 306-307). O caminho real e CockpitOrchestrator.FecharPassagem (CockpitOrchestrator.cs:151-189): chama DeltaCalculator.Calcular (linha 163) e _cockpit.SetDelta(FormatDelta(delta.DeltaTotalS), tone) (linha 171), tom por limiar +/-0.05s (linha 170). Mas esse FecharPassagem so dispara via IngestGps-\u003edetector (evento \u0027saida-cruzou\u0027, linha 115), e IngestGps so e alimentado por MainWindow.AlimentarGps (MainWindow.xaml.cs:297-298), que faz `_orquestrador?.IngestGps` — e `_orquestrador` so e criado por IniciarFeedReal (linha 284-290). Grep em todo o repo: IniciarFeedReal/AlimentarMotor/AlimentarGps/_orquestrador aparecem APENAS na propria definicao e em docs (.claude-exec, docs/COCKPIT_FONTE_DA_VERDADE.md) — nenhum executavel os chama. Logo _orquestrador fica null para sempre e o Delta real nunca roda no .exe. A formula real existe e e testada (DeltaCoach.cs:58-107: integra dtAtual-dtRef = ds/v por par de pontos, acumula por sub-trecho, soma total na linha 96).","problemas":["Nao conectado: no .exe o Delta so funciona com --demo; sem a flag fica congelado no valor inicial do CockpitState. O caminho real (FecharPassagem-\u003eDeltaCalculator) nunca executa porque _orquestrador e null (IniciarFeedReal nunca e chamado — confirmado por Grep no repo inteiro).","Valor fixo no demo: ApplyScene aplica DeltaValue/DeltaTone hardcoded por cena (MainWindow.xaml.cs:306-307,515), nao um calculo de GPS.","Divergencia de algoritmo vs web: o C# (DeltaCoach.cs:68-96) calcula delta por INTEGRACAO ghost por sub-trecho (soma de ds/vAtual - ds/vRef ponto a ponto). A web (cockpit-volta-real.html:442-448) calcula delta como simples diferenca de TEMPO TOTAL de volta no trecho: d = tempoS - ref, tempoS = (p.t - a.tEnt)/1000. Sao metodos diferentes; podem dar numeros diferentes para a mesma volta.","Divergencia de sinal/formato: a web mostra Math.abs(d) sem sinal (cockpit-volta-real.html:448, decisao Flavio 22/06 \u0027sem sinal, so o valor\u0027); o C# FormatDelta (CockpitOrchestrator.cs:53-57) mantem o sinal \u0027+\u0027/\u0027-\u0027. Paridade visual quebrada.","Limiar de tom divergente: web usa d \u003c= 0 -\u003e BOM, senao ERRO (binario, sem zona neutra); C# usa banda morta de +/-0.05s com terceiro estado Neutro (CockpitOrchestrator.cs:170). Mesma volta pode dar cor diferente perto de zero.","Mesmo se o feed real fosse ligado, o Delta real depende de IngestGps (GPS), que nenhum executavel de UI alimenta — a captura real vive em consoles separados (T4000Capture, T4000LiveDemo) que nao desenham a tela."],"recomendacao":"Ligar o feed real na UI: em App.OnLaunched (ou no MainWindow construtor quando !Demo) chamar IniciarFeedReal(curvasBrasilia) e plugar uma fonte de GPS real (replay/SessaoReplay ou transporte USB) em AlimentarGps, senao o Delta nunca acende fora do --demo. Antes de produção, alinhar o algoritmo do Delta com a referencia aprovada: decidir entre o ghost por sub-trecho (C#) e a diferenca de tempo total de volta (web) — hoje divergem. Alinhar tambem sinal (web sem sinal, decisao 22/06) e o limiar de cor (web binario vs C# banda morta 0.05s).","pontoDecisao":"Confirmar com o Flavio qual e a formula de Delta aprovada (tempo total de volta como na web aprovada 22/06, OU integracao ghost por sub-trecho como no C#) e padronizar sinal/limiar de cor entre .exe e web antes de levar pra pista.","severidade":"alta","componente":"Delta (tempo perdido/ganho vs referência)","key":"delta"},{"ligadoSensorReal":"nao","calculoRealCorreto":"parcial","soFuncionaNoDemo":true,"evidencia":"App.xaml.cs:27 (OnLaunched) so faz `new MainWindow(options)` + Activate() — nao cria CockpitOrchestrator, T4000Provider/reader, nem ponte console-\u003eUI. Os metodos que ligariam o Apex ao GPS real (MainWindow.xaml.cs:284 IniciarFeedReal, :293 AlimentarMotor, :297 AlimentarGps) estao definidos mas Grep em todo o repo (.cs) confirma ZERO chamadores: so aparecem na propria definicao e em docs/comentarios. Logo `_orquestrador` (MainWindow.xaml.cs:26) fica null pra sempre e AlimentarGps faz `_orquestrador?.IngestGps(...)` -\u003e no-op. O caminho REAL do Apex vive todo no CockpitOrchestrator e esta atras de IngestGps (CockpitOrchestrator.cs:76), que nunca e alimentado: OnTrechoEvento (:93) -\u003e PontoVelocidade (:127, escreve entrada/apice/saida comparando com _refPontos da 1a passagem) e PontoFreio (:135 -\u003e CockpitState.ClassifyFreio); a bolinha continua do apice vem de AtualizarBolinha (:193) -\u003e Ghost.CalcularBolinha (:202). Nada disso roda. O UNICO caminho que move o Apex no .exe e o --demo: ApplyScene (MainWindow.xaml.cs:519-524) chama SetApexPonto so para \"entrada\"/\"freio\"/\"apice\" com km/h hardcoded das DemoScenes; NUNCA chama \"saida\". A UI tem 4 tiles (ApplyApex MainWindow.xaml.cs:866-872, incluindo ApplyApexPonto(ApexSaidaValor...) :871) mas no demo a Saida fica \"—\". Sem --demo (modo \"producao\" segundo App.xaml.cs:34-35) a tela inteira, Apex incluso, fica congelada no estado inicial. A web de referencia cockpit-volta-real.html DRIVE os 4 pontos incluindo saida de GPS real replay (:443 setApexPonto(\u0027saida\u0027,...), :506 apice por distancia dMin\u003c=10), entao ha divergencia real .exe x web.","problemas":["NAO CONECTADO: o Apex no .exe nunca recebe dado de GPS. App.xaml.cs:27 nao chama IniciarFeedReal; AlimentarGps/IngestGps nunca sao invocados (Grep confirma 0 chamadores). _orquestrador fica null -\u003e AlimentarGps e no-op.","SO FUNCIONA NO --demo: os 4 pontos do Apex sao alimentados exclusivamente por ApplyScene (MainWindow.xaml.cs:519-524) com km/h FIXOS hardcoded nas DemoScenes. Sem a flag --demo a tela fica estatica.","STUB DE SAIDA mesmo no demo: ApplyScene seta apenas entrada/freio/apice (linhas 520/522/524). \u0027saida\u0027 nunca e setado, entao o tile Saida (ApexSaidaValor, MainWindow.xaml.cs:871) mostra \u0027—\u0027 permanentemente — divergente da web, que preenche saida de GPS real (cockpit-volta-real.html:443).","CALCULO REAL EXISTE E E CORRETO, MAS MORTO: PontoVelocidade (CockpitOrchestrator.cs:127-133) compara km/h da passagem atual com a 1a passagem (_refPontos) e colore OkMelhor/OkPior; PontoFreio (:135-140) usa CockpitState.ClassifyFreio; a bolinha usa Ghost.CalcularBolinha (:202). Esta logica esta implementada/testada no Domain mas nunca executa no .exe por falta de feed.","DIVERGENCIA .exe x web: a web (cockpit-volta-real.html) faz replay de dado GPS real via o mesmo CockpitState e preenche os 4 pontos do Apex; o .exe nao tem nenhum vinculo a GPS — so animacao/cenas fixas. Paridade conceitual existe no Domain, mas a UI do .exe nao a pluga."],"recomendacao":"Ligar o feed real do Apex no executavel: em App.OnLaunched (ou em MainWindow apos InitializeComponent) chamar IniciarFeedReal(curvas das 8 de Brasilia) quando nao estiver em --demo, e criar a ponte que entrega GPS (TransportSelector/replay) -\u003e MainWindow.AlimentarGps -\u003e CockpitOrchestrator.IngestGps. Enquanto isso nao existir, o Apex (e os demais componentes) so existe como demo. Como correcao minima de honestidade visual, preencher tambem \u0027saida\u0027 no ApplyScene do demo (hoje o 4o tile fica \u0027—\u0027), espelhando a web. Validar com o replay de cockpit-volta-real.html como gabarito (ele ja exercita os 4 pontos a partir de dado real).","pontoDecisao":"O .exe da tela do piloto so funciona em modo --demo (cenas fixas). O cerebro de dado real do Apex (CockpitOrchestrator: TrechoDetector + Ghost + comparacao com 1a passagem) esta implementado e testado no Domain, mas a UI NUNCA o instancia nem o alimenta — IniciarFeedReal/AlimentarGps tem zero chamadores. Decisao: priorizar a ligacao captura-GPS -\u003e UI antes de exibir o .exe como \u0027producao\u0027, porque hoje sem --demo a tela fica congelada e mesmo com --demo o tile \u0027Saida\u0027 fica vazio.","severidade":"alta","componente":"Apex: Entrada / Freio / Ápice / Saída","key":"apex"},{"ligadoSensorReal":"nao","calculoRealCorreto":"nao","soFuncionaNoDemo":true,"evidencia":"Cluster de 14 sensores (Motor 7 / Movimento 2 / Chassi 5) NO .exe: confirmado no codigo que esta 100% desconectado de sensor real.\n\n1) Wiring inexistente: App.xaml.cs:24-29 (OnLaunched) so faz `new MainWindow(options)` + Activate(). Nunca chama IniciarFeedReal. MainWindow.xaml.cs:284-290 (IniciarFeedReal cria o CockpitOrchestrator) e :293-298 (AlimentarMotor/AlimentarGps) sao orfaos — Grep no repo so acha referencias na propria definicao e em comentarios/docs (linhas 25, 202, 278). Logo _orquestrador fica null e AlimentarMotor/AlimentarGps sao no-op (`_orquestrador?.Ingest...`).\n\n2) O cluster NEM PASSA pelo orquestrador: Grep por Sensor|Chassi|Lambda|Agua|Alarme em CockpitOrchestrator.cs = ZERO matches. IngestMotor/IngestGps nunca tocam o status do cluster. Ou seja, mesmo que IniciarFeedReal fosse chamado, o cluster continuaria sem fonte real — nao ha caminho dado-real -\u003e ApplySensors no C#.\n\n3) Unico caminho que pinta o cluster e demo: ApplySensors so e chamado em ApplyScene (MainWindow.xaml.cs:539), que so roda sob --demo (timer de 2s ligado em :203-214, guard `if (_options.Demo)`). ApplySensors (:828-841): motor+movimento SEMPRE verde (SensorOk hardcoded), chassi SEMPRE vermelho (SensorOff, \u0027a instalar\u0027). O unico \u0027warn\u0027 vem do parametro `falhaMotor` = `s.MsgTipo == MsgTipo.Grave` (:539) — derivado do TIPO DE MENSAGEM da cena demo, nao de leitura de sensor. Sem --demo, ApplySensors nunca roda e as 14 elipses ficam no Fill inicial do XAML.\n\n4) Divergencia vs web (referencia): web cockpit-volta-real.html:310-319 aplicarMotorStatus(m) deriva status do PROPRIO dado T4000: agua = `m.agua \u003e 110 || al.excessoTempMotor`; lambda = `al.wbMaximo||al.wbMinimo||al.nbMaximo||al.nbMinimo`; alarme = bitfield `al` com algum true. O .exe colapsa tudo isso num unico bool e acende agua+lambda+alarme JUNTOS (:837-839) sem distinguir a condicao real.","problemas":["NAO CONECTADO: o cluster de sensores nunca recebe dado real. App.OnLaunched (App.xaml.cs:27) nao chama MainWindow.IniciarFeedReal; _orquestrador fica null para sempre.","ORFAOS: MainWindow.IniciarFeedReal/AlimentarMotor/AlimentarGps (MainWindow.xaml.cs:284-298) estao definidos mas nunca sao invocados em lugar nenhum do repo (confirmado por Grep).","SEM CAMINHO DE DADO: CockpitOrchestrator nao tem nenhuma referencia a sensor/agua/lambda/alarme/chassi. Mesmo com o orquestrador rodando, o cluster nao seria alimentado — falta a logica equivalente ao aplicarMotorStatus do web no lado C#.","PLACEHOLDER/HARDCODE: ApplySensors (MainWindow.xaml.cs:828-841) seta cores fixas — motor/movimento verde, chassi vermelho — sem ler comunicacao real de nenhum sensor.","GATILHO FALSO: o unico estado \u0027warn\u0027 (agua/lambda/alarme amarelos) e disparado por s.MsgTipo==MsgTipo.Grave de uma CENA DEMO (MainWindow.xaml.cs:539), nao por leitura de sensor.","CALCULO DIVERGENTE DO WEB: o web distingue agua\u003e110, alarmes lambda wb/nb e bitfield de alarme do motor (cockpit-volta-real.html:316-318); o .exe acende os tres juntos a partir de um unico bool, perdendo a semantica.","ESTADO CONGELADO SEM --demo: ApplySensors so roda dentro de ApplyScene (guard `if (_options.Demo)` em :203). Em producao (sem a flag) o cluster nunca atualiza."],"recomendacao":"Tratar o cluster de 14 sensores do .exe como cosmetico/demo, NAO como indicador real. Para ter paridade com o web: (1) ligar o feed real chamando MainWindow.IniciarFeedReal no App.OnLaunched (ou via ponte console-\u003eUI) e alimentar via AlimentarMotor/AlimentarGps; (2) portar a logica do aplicarMotorStatus (cockpit-volta-real.html:310-319) para o CockpitOrchestrator/CockpitState, mapeando agua\u003e110, alarmes lambda wb/nb e o bitfield de alarme do motor da AmostraAlerta para o estado de cada elipse; (3) trocar a assinatura ApplySensors(bool falhaMotor) por um estado por-sensor real, eliminando o gatilho via MsgTipo.Grave. Enquanto isso nao existir, nao usar o cluster do .exe em pista — ele nao reflete o carro.","pontoDecisao":"Decisao para o Flavio: o cluster de sensores no .exe e puramente visual (demo). Aprovar a ligacao do feed real na UI (IniciarFeedReal no OnLaunched) + portar o aplicarMotorStatus do web para o C# antes de confiar nesses 14 icones em pista? Ou manter o .exe so como tela demo e usar o web/consoles para dado real por ora?","severidade":"alta","componente":"Cluster de 14 sensores (Motor / Movimento / Chassi)","key":"sensores"},{"ligadoSensorReal":"nao","calculoRealCorreto":"na","soFuncionaNoDemo":true,"evidencia":"A barra de stint (12 blocos _stintBlocks) no .exe so e escrita por ApplyStintPattern (MainWindow.xaml.cs:990-998), chamado exclusivamente de ApplyScene (MainWindow.xaml.cs:532) com padroes HARDCODED (StintDuringV5...StintAfterV8Best, MainWindow.xaml.cs:334-341). ApplyScene so roda sob o _demoTimer, criado APENAS quando _options.Demo e true (MainWindow.xaml.cs:203-214). Sem --demo, a barra fica no estado inicial do XAML e nunca atualiza. O calculo REAL por curva existe no Domain: CockpitOrchestrator.FecharPassagem grava _estadoTrecho[segId] = faster/slower/neutral/reference (CockpitOrchestrator.cs:174-182), derivado de DeltaCalculator.Calcular sobre GPS real. Mas esse estado e exposto so por EstadoDoTrecho(segId) (CockpitOrchestrator.cs:35) que tem ZERO consumidores no repo inteiro (Grep por EstadoDoTrecho retorna 1 unico arquivo, o proprio CockpitOrchestrator.cs). Nao ha codigo ligando _estadoTrecho aos _stintBlocks da UI. Alem disso o orquestrador nunca roda: IniciarFeedReal/AlimentarMotor/AlimentarGps (MainWindow.xaml.cs:284-298) so aparecem em sua propria definicao e em comentarios (Grep confirma: linhas 25,202,278 comentario; 284,293,297 def), nenhum call site. App.OnLaunched (App.xaml.cs:24-29) so faz new MainWindow + Activate, nao instancia reader/provider/orquestrador. Logo _orquestrador fica null para sempre e AlimentarMotor/Gps fazem _orquestrador?.Ingest = no-op.","problemas":["A barra de stint do .exe e 100% demo: padroes fixos hardcoded (StintDuringV5..StintAfterV8Best, MainWindow.xaml.cs:334-341) aplicados por ApplyStintPattern via ApplyScene sob o --demo timer. Sem --demo, fica congelada.","Desconexao total: CockpitOrchestrator.EstadoDoTrecho (CockpitOrchestrator.cs:35) que carrega o resultado real por curva (faster/slower/reference) nao e lido por NENHUM lugar do repo (Grep: 1 arquivo). A UI nunca consome _estadoTrecho.","Orquestrador nunca e instanciado: IniciarFeedReal (MainWindow.xaml.cs:284) e o unico ponto que faz new CockpitOrchestrator, mas nunca e chamado (sem call site). _orquestrador permanece null; AlimentarMotor/AlimentarGps viram no-op.","App.xaml.cs:27 (OnLaunched) nao liga feed real: so cria MainWindow e Activate, sem reader/provider/ponte console-\u003eUI. A captura real vive em executaveis separados sem UI (T4000Capture, T4000LiveDemo).","Mesmo se o orquestrador rodasse, SetTrechoStatus so dirige o halo (status unico instantaneo), nao ha mapeamento de _estadoTrecho por segId para os 12 _stintBlocks historicos da barra. A logica de pintar a barra com resultado real simplesmente nao existe na UI."],"recomendacao":"Tratar a barra de stint do .exe como mock visual, nao como feature funcional. Para ligar de verdade: (1) chamar IniciarFeedReal nas curvas da pista no startup (App.OnLaunched ou MainWindow) e alimentar AlimentarMotor/AlimentarGps a partir do T4000Provider/GPS, hoje presos em executaveis de console sem UI; (2) criar um metodo na UI que leia CockpitOrchestrator.EstadoDoTrecho(segId) por curva e pinte os 12 _stintBlocks (mapear faster-\u003eFaster, slower-\u003eSlower, reference-\u003equadriculado/Neutral, atual-\u003eCurrent), substituindo o caminho ApplyStintPattern demo; (3) emitir esse estado via CockpitState (novo campo observavel tipo \"stint\") em vez de polling, para seguir o mesmo padrao reativo dos outros componentes. Antes disso, nao apresentar a barra de stint como ligada a dado real em nenhuma demo pro Flavio.","pontoDecisao":"Decidir se a barra de stint do .exe (tela do piloto Windows) precisa estar ligada a dado real T4000/GPS para o proximo dia de pista, ou se segue como mock visual --demo por enquanto. Hoje ela so funciona em --demo (padroes fixos) e o resultado real por curva calculado no Domain (CockpitOrchestrator._estadoTrecho) nao tem nenhuma ponte ate a UI. Isso exige decisao de escopo/arquitetura (Flavio), nao so codigo.","severidade":"alta","componente":"Barra de voltas / stint","key":"stint"},{"ligadoSensorReal":"nao","calculoRealCorreto":"parcial","soFuncionaNoDemo":true,"evidencia":"CONFIRMADO no código. (1) App.OnLaunched (App.xaml.cs:24-29) só faz `new MainWindow(options)` + Activate; não cria reader/provider/bridge/orquestrador. (2) Grep em TODO o repo por IniciarFeedReal|AlimentarMotor|AlimentarGps retorna SÓ a própria definição (MainWindow.xaml.cs:25,202,278,284,293,297) e markdown de docs — ZERO chamadores. Logo _orquestrador (MainWindow.xaml.cs:26) fica null pra sempre e AlimentarMotor/AlimentarGps fazem `_orquestrador?.Ingest...` = no-op. (3) Único caminho que move a tela é `--demo` (MainWindow.xaml.cs:203-228): _demoTimer aplica DemoScenes (348-508, 30 cenas hardcoded) a cada 2s; _brakeTimer (217-220) varre 0→9 a luz de freio; _shiftSweepTimer (224-227) varre o shift. Sem --demo, a tela fica no estado inicial do CockpitState. (4) O cérebro real EXISTE e está completo no Domain: CockpitOrchestrator.IngestMotor (CockpitOrchestrator.cs:62) chama LiveDataBridge.RpmToShift; IngestGps (76) alimenta TrechoDetector/Ghost; FecharPassagem (151) chama DeltaCalculator.Calcular (163) e grava _estadoTrecho (174-182). Nada disso roda porque o orquestrador nunca é instanciado pela UI. (5) Captura real só nos consoles: T4000LiveDemo/Program.cs desenha via Console.Clear()+Console.Write(LivePanel.Render) (278-279), alimentado por T4000Simulator (118) — sem UI WinUI, sem MainWindow.","problemas":["NÃO CONECTADO (causa-raiz): App.xaml.cs:27 nunca chama MainWindow.IniciarFeedReal; não instancia T4000Provider/T4000SerialReader nem LiveDataBridge; não há ponte console→UI. Os 3 métodos de entrada de dado real (IniciarFeedReal/AlimentarMotor/AlimentarGps, MainWindow.xaml.cs:284-298) são código morto — nenhum chamador no repo.","Shift light (17 LEDs): no .exe é comandado pela varredura demo (DemoShiftRender, MainWindow.xaml.cs:234-239) e pelas cenas; o caminho RPM→RpmToShift→ApplyShift real (CockpitOrchestrator.cs:62-65) nunca dispara. O \u0027flash de upshift\u0027 (MainWindow.xaml.cs:589-593) é proxy derivado do nível, não sinal real de troca de marcha.","DIVERGÊNCIA DE CÁLCULO shift: C# LiveDataBridge.RpmToShift (LiveDataBridge.cs:135-153) só tem o modo legado por % de redline; NÃO implementa o modo TORQUE (peakTorqueRpm). LiveLimits.Bubi (LiveDataBridge.cs:41-48) nem define peakTorqueRpm. Já o web rpmToShift (live-data-bridge.js:69-77) tem o modo torque e a referência cockpit-volta-real.html:283 usa peakTorqueRpm:6050/torqueLitOffsetRpm:700. Paridade quebrada — no carro real o C# acenderia diferente do aprovado.","Luz de freio (9/lado): no .exe é pura animação (_brakeTimer enche 0→9 ciclicamente, MainWindow.xaml.cs:217-220,790). Nenhuma entrada de GPS/sensor ligada. O web (cockpit-volta-real.html:343-367 atualizarFreio) deriva de GPS real: distância ao ápice + desaceleração (pico de velocidade) + ponto ideal da melhor passagem (brakeRef). Esse cálculo NÃO existe no .exe ligado a nada.","Delta (número grande): no .exe vem de DeltaValue/DeltaTone hardcoded por cena (ApplyScene, MainWindow.xaml.cs:515). O DeltaCalculator.Calcular real (CockpitOrchestrator.cs:163) depende de IngestGps, nunca alimentado.","Apex 4 pontos: no .exe SetApexPonto com km/h fixos por cena (ApplyScene:519-524). O caminho real (TrechoDetector + Ghost.CalcularBolinha + PontoVelocidade, CockpitOrchestrator.cs:93-204) está atrás de IngestGps, nunca chamado. Demo nem preenche \u0027saida\u0027 (só entrada/freio/apice).","Cluster 14 sensores: ApplySensors (MainWindow.xaml.cs:828-841) é cosmético/demo — motor+movimento sempre verde, chassi sempre vermelho; água/lambda/alarme viram amarelo SÓ quando a cena demo é MsgTipo.Grave (ApplyScene:539). Não lê comunicação real. O web aplicarMotorStatus (cockpit-volta-real.html:310-319) deriva do próprio dado T4000 (alarme do bitfield, água\u003e110, λ). Vínculo ausente no .exe.","Barra de stint (12 blocos): no .exe usa padrões hardcoded (StintDuringV5...StintAfterV8Best, MainWindow.xaml.cs:334-341) via ApplyStintPattern (990). O _estadoTrecho real do orquestrador (CockpitOrchestrator.cs:34-35,174-182) não está conectado à barra — a UI não lê EstadoDoTrecho e o orquestrador não roda.","T4000LiveDemo (console) usa T4000Simulator (Program.cs:118), não hardware real; mesmo o pipeline de console é simulado por padrão."],"recomendacao":"Tratar o componente \u0027Captura de sensores T4000(USB)+GPS chegando no .exe\u0027 como NÃO ENTREGUE para o executável da tela do piloto. O dado real não chega a NENHUM componente da UI: a tela só anima no modo --demo (cenas/timers fixos) e, sem a flag, fica congelada. Para fechar o gap: (1) em App.OnLaunched, quando NÃO for --demo, instanciar T4000Provider+T4000SerialReader (porta USB CDC-ACM real) e LiveDataBridge/CockpitOrchestrator, chamar MainWindow.IniciarFeedReal(8 curvas de Brasília) e ligar a captura aos métodos AlimentarMotor/AlimentarGps; (2) prover o feed de GPS real (transporte iPhone↔Windows) para IngestGps — hoje inexistente no .exe; (3) conectar _estadoTrecho do orquestrador à barra de stint e o status real T4000 ao cluster de 14 sensores (hoje cosméticos); (4) portar o modo TORQUE (peakTorqueRpm) para o C# RpmToShift e adicionar peakTorqueRpm/torqueLitOffsetRpm em LiveLimits.Bubi, para paridade com o web aprovado; (5) ligar a luz de freio a um cálculo real (GPS desaceleração/ponto), como o atualizarFreio do web. Antes disso, qualquer demonstração do .exe é puramente sintética e não prova captura de sensor.","pontoDecisao":"O .exe da tela do piloto está pronto VISUALMENTE mas NÃO lê sensor real em nenhum componente: a captura T4000/GPS só existe em consoles separados (sem UID) e nos métodos órfãos IniciarFeedReal/AlimentarMotor/AlimentarGps (zero chamadores). Decisão para o Flávio: aceitar que o .exe atual é demo-only e priorizar a fiação App.OnLaunched→IniciarFeedReal+provider USB+feed GPS, OU manter --demo apenas como vitrine e adiar a integração real. Sem essa fiação, levar o .exe pra pista mostra dados inventados, não o carro.","severidade":"alta","componente":"Captura de sensores: T4000 (USB) + GPS chegando no .exe","key":"captura"}];</script>
<script>
(function(){
  var sevOrder = { alta:0, media:1, baixa:2 };
  var dados = DADOS.slice().sort(function(a,b){ return (sevOrder[a.severidade]==null?9:sevOrder[a.severidade]) - (sevOrder[b.severidade]==null?9:sevOrder[b.severidade]); });
  function cont(k,v){ return dados.filter(function(d){ return d[k]===v; }).length; }

  var resumo = document.getElementById('resumo');
  var kpis = [
    ['Componentes', dados.length, ''],
    ['Ligados a sensor real', cont('ligadoSensorReal','sim'), 'green'],
    ['Só funcionam no demo', dados.filter(function(d){return d.soFuncionaNoDemo;}).length, 'red'],
    ['Severidade alta', cont('severidade','alta'), 'red']
  ];
  kpis.forEach(function(k){
    var d=document.createElement('div'); d.className='kpi';
    var n=document.createElement('div'); n.className='n'; n.textContent=k[1];
    if(k[2]==='red')n.style.color='var(--red)'; if(k[2]==='green')n.style.color='var(--green)';
    var l=document.createElement('div'); l.className='l'; l.textContent=k[0];
    d.appendChild(n); d.appendChild(l); resumo.appendChild(d);
  });

  if(cont('ligadoSensorReal','sim')===0){
    var a=document.getElementById('alerta'); a.className='alerta';
    var b=document.createElement('b'); b.textContent='Achado crítico: ';
    a.appendChild(b);
    a.appendChild(document.createTextNode('Nenhum componente do .exe está ligado a sensor real — todos só funcionam no modo --demo (dados sintéticos). O cérebro de dado real existe e está testado no Domain, mas a interface (App.OnLaunched) nunca o liga. Hoje o .exe é um protótipo visual, não um instrumento de pista.'));
  }

  function selo(label,val){ var s=document.createElement('span'); s.className='selo '+val; s.textContent=label+': '+String(val).toUpperCase(); return s; }
  var cards=document.getElementById('cards');
  dados.forEach(function(d){
    var c=document.createElement('div'); c.className='card';
    var h=document.createElement('h3'); h.textContent=d.componente; c.appendChild(h);
    var selos=document.createElement('div'); selos.className='selos';
    selos.appendChild(selo('Sensor real', d.ligadoSensorReal));
    selos.appendChild(selo('Cálculo', d.calculoRealCorreto));
    if(d.soFuncionaNoDemo){ var bd=document.createElement('span'); bd.className='selo demo'; bd.textContent='SÓ DEMO'; selos.appendChild(bd); }
    var sv=document.createElement('span'); sv.className='sev '+d.severidade; sv.textContent='Severidade '+d.severidade; selos.appendChild(sv);
    c.appendChild(selos);
    function block(label,node){ var l=document.createElement('div'); l.className='lbl'; l.textContent=label; c.appendChild(l); c.appendChild(node); }
    var ev=document.createElement('pre'); ev.className='ev'; ev.textContent=d.evidencia; block('Evidência', ev);
    if(d.problemas&&d.problemas.length){ var ul=document.createElement('ul'); ul.className='prob'; d.problemas.forEach(function(p){ var li=document.createElement('li'); li.textContent=p; ul.appendChild(li); }); block('Problemas', ul); }
    var rec=document.createElement('div'); rec.className='rec'; rec.textContent=d.recomendacao; block('Recomendação', rec);
    cards.appendChild(c);
  });

  var store = {};
  try { store = JSON.parse(localStorage.getItem('auditCockpitDecisoes')||'{}'); } catch(e){ store={}; }
  function persist(){ try { localStorage.setItem('auditCockpitDecisoes', JSON.stringify(store)); } catch(e){} render(); }
  function render(){ document.getElementById('contador').textContent='Decisões tomadas: '+Object.keys(store).length+' de '+dados.length; }
  var dec=document.getElementById('decisoes');
  dados.forEach(function(d,i){
    var it=document.createElement('div'); it.className='item';
    var q=document.createElement('div'); q.className='q';
    var t=document.createElement('b'); t.textContent=(i+1)+'. '+d.componente; q.appendChild(t);
    var pt=document.createElement('div'); pt.className='pt'; pt.textContent=d.pontoDecisao; q.appendChild(pt);
    it.appendChild(q);
    var btns=document.createElement('div'); btns.className='btns';
    var ap=document.createElement('button'); ap.className='ap'; ap.textContent='Aprovar';
    var re=document.createElement('button'); re.className='re'; re.textContent='Recusar';
    function upd(){ ap.classList.toggle('on', store[d.key]==='ap'); re.classList.toggle('on', store[d.key]==='re'); }
    ap.onclick=function(){ store[d.key]='ap'; persist(); upd(); };
    re.onclick=function(){ store[d.key]='re'; persist(); upd(); };
    btns.appendChild(ap); btns.appendChild(re); it.appendChild(btns);
    dec.appendChild(it); upd();
  });
  render();
})();
</script>
